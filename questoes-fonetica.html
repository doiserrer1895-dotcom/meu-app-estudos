const QUESTIONS=[{"number":1,"level":1,"category":"Acentuação e Prosódia","topic":"Acentuação gráfica","stem":"De acordo com as regras de acentuação, assinale a alternativa em que as palavras receberam\nacento gráfico por serem classificadas, respectivamente, como: oxítonas, paroxítonas e\nproparoxítonas.","options":[{"letter":"A","text":"açaí, arquétipo, táctil"},{"letter":"B","text":"mocotó, bíceps, exército"},{"letter":"C","text":"café, alcoólatra, escritório"},{"letter":"D","text":"trânsito, baía, ômega"},{"letter":"E","text":"dúvida, rubrica, órfã"}],"answer":"B"},{"number":2,"level":1,"category":"Acentuação e Prosódia","topic":"Acentuação gráfica","stem":"Assinale a alternativa em que os vocábulos obedecem às mesmas regras de acentuação\ngráfica das palavras “temática” e “saúde”, respectivamente.","options":[{"letter":"A","text":"hífen, ótimo."},{"letter":"B","text":"parabéns, mágico."},{"letter":"C","text":"médico, conteúdo."},{"letter":"D","text":"robótica, café."},{"letter":"E","text":"revólver, faísca."}],"answer":"C"},{"number":3,"level":1,"category":"Acentuação e Prosódia","topic":"Acentuação gráfica","stem":"Marque a alternativa que classifica as palavras abaixo quanto à acentuação,\nrespectivamente:\nTábua / Céu / Tórax","options":[{"letter":"A","text":"Paroxítona / Paroxítona / Paroxítona."},{"letter":"B","text":"Oxítona / Monossílabo átono / Paroxítona."},{"letter":"C","text":"Paroxítona / Monossílabo tônico / Paroxítona."},{"letter":"D","text":"Monossílabo átono / Paroxítona / Oxítona."},{"letter":"E","text":"Proparoxítona / Paroxítona / Oxítona."}],"answer":"C"},{"number":4,"level":1,"category":"Ortografia","topic":"Acordo ortográfico","stem":"Segundo o acordo ortográfico de 2009/2010, quanto à acentuação, marque a alternativa\nem que a palavra em","options":[{"letter":"A","text":"Quanto à limpeza, eu sou paranóica."},{"letter":"B","text":"Sempre precisamos de novas ideias."},{"letter":"C","text":"Nesta cidade, todos os hoteis são bons."},{"letter":"D","text":"Os docentes não vêem com bons olhos a nova proposta de calendário escolar."},{"letter":"E","text":"Meu esposo sempre pára o carro para atender ao celular."}],"answer":"B"},{"number":5,"level":1,"category":"Ortografia","topic":"Acentuação e grafia","stem":"Assinale a alternativa em que as regras de acentuação, nos conjuntos de palavras, foram\nempregadas de acordo com a norma padrão:","options":[{"letter":"A","text":"taínha, juiz e juízes"},{"letter":"B","text":"panacéia, apto, décadas"},{"letter":"C","text":"taxímetro, pangeia, baú."},{"letter":"D","text":"imã, apto, bíceps"},{"letter":"E","text":"herói, jaú, geléia."}],"answer":"C"},{"number":6,"level":1,"category":"Acentuação e Prosódia","topic":"Acentuação gráfica","stem":"Assinale a alternativa em que todas as palavras são consideradas paroxítonas na escrita:","options":[{"letter":"A","text":"publica – astronauta – viajaram – história."},{"letter":"B","text":"Paris – Brasil – Londres – Munique."},{"letter":"C","text":"Brasília – Amazônia – Califórnia – Júpiter."},{"letter":"D","text":"universidade – significado – Singapura – país."},{"letter":"E","text":"rubrica – satélites – fenômeno – planetário."}],"answer":"A"},{"number":7,"level":1,"category":"Fonética e Fonologia","topic":"Encontros consonantais","stem":"Assinale a alternativa em que todas as palavras possuam encontros consonantais:","options":[{"letter":"A","text":"samba, clima, apto."},{"letter":"B","text":"mnemônico, obturar, subdelegado."},{"letter":"C","text":"sucção, istmo, chave"},{"letter":"D","text":"exceção, mundo, sonda."},{"letter":"E","text":"jejum, aquilo, chave."}],"answer":"B"},{"number":8,"level":1,"category":"Ortografia","topic":"Acentuação e grafia","stem":"Assinale a alternativa em que as regras de acentuação, nos conjuntos de palavras, foram\nempregadas de acordo com a norma padrão:","options":[{"letter":"A","text":"lmã, apto, bíceps."},{"letter":"B","text":"panacéia, ápto, décadas."},{"letter":"C","text":"herói, jaú, geléia."},{"letter":"D","text":"taxímetro, pangeia, baú."},{"letter":"E","text":"taínha, juiz, juizes."}],"answer":"D"},{"number":9,"level":1,"category":"Acentuação e Prosódia","topic":"Acentuação gráfica","stem":"Assinale a alternativa em que todos os vocábulos são acentuados pela mesma regra.","options":[{"letter":"A","text":"plástico, últimos, mamíferos, único."},{"letter":"B","text":"contrário, hipóteses, sensíveis, hotéis."},{"letter":"C","text":"indústria, países, além, já."},{"letter":"D","text":"reutilizáveis, através, início, resíduos."},{"letter":"E","text":"próprio, sanitários, lá, descartável."}],"answer":"A"},{"number":10,"level":1,"category":"Acentuação e Prosódia","topic":"Acentuação gráfica","stem":"Assinale a alternativa em que todos os vocábulos do enunciado são acentuados pela mesma\nregra.","options":[{"letter":"A","text":"Uma sólida política de saneamento tem que levar em conta os problemas econômicos da população."},{"letter":"B","text":"Há um sistema acessível, mas também regulatório."},{"letter":"C","text":"Pressente-se um crônico sentimento de impotência, resíduo da própria história."},{"letter":"D","text":"Os termos de privacidade do sistema construído pelos estagiários são inaceitáveis."},{"letter":"E","text":"As audiências públicas são realizadas em caráter extraordinário."}],"answer":"A"},{"number":11,"level":1,"category":"Acentuação e Prosódia","topic":"Acentuação gráfica","stem":"Assinale a alternativa cujo vocábulo só pode ser empregado com acento gráfico.","options":[{"letter":"A","text":"Diálogo"},{"letter":"B","text":"Até"},{"letter":"C","text":"Análogo"},{"letter":"D","text":"É"},{"letter":"E","text":"Música"}],"answer":"C"},{"number":12,"level":1,"category":"Acentuação e Prosódia","topic":"Acentuação gráfica","stem":"De acordo com as regras ortográficas, é correto afirmar que:","options":[{"letter":"A","text":"“límpido” e “lírio” são acentuados por seguirem a mesma regra de acentuação."},{"letter":"B","text":"“urubu” e “caju” não são acentuados por serem vocábulos paroxítonos."},{"letter":"C","text":"“Piauí” e “teiú” são acentuadas por estarem sozinhas, em posição tônica final de sílaba."},{"letter":"D","text":"“ninguém” e “álbum” são acentuados por serem vocábulos oxítonos terminados em - m."},{"letter":"E","text":"“ruim” e “feiura” não são acentuados pelo mesmo motivo."}],"answer":"C"},{"number":13,"level":1,"category":"Ortografia","topic":"Acentuação e grafia","stem":"Assinale a alternativa em que todas as palavras devem ser acentuadas.","options":[{"letter":"A","text":"caroço - miudo - feiura"},{"letter":"B","text":"caju - poti - guarani"},{"letter":"C","text":"textil - moinho - aguentar"},{"letter":"D","text":"teiu - Grajau -virus"},{"letter":"E","text":"aldeia - taoismo - ruim"}],"answer":"D"},{"number":14,"level":1,"category":"Acentuação e Prosódia","topic":"Acentuação gráfica","stem":"Com relação às palavras abaixo, podemos afirmar que, de acordo com os padrões normativos:\ncaráter – Júpiter – júnior","options":[{"letter":"A","text":"são todas proparoxítonas."},{"letter":"B","text":"todas mudam de significado ao passar para o plural."},{"letter":"C","text":"todas apresentam metafonia."},{"letter":"D","text":"todas mudam de sílaba tônica no plural."},{"letter":"E","text":"nenhuma possui marca de número."}],"answer":"D"},{"number":15,"level":1,"category":"Ortografia","topic":"Acentuação e grafia","stem":"Assinale a alternativa em que todas as palavras foram acentuadas adequadamente.","options":[{"letter":"A","text":"O cajú já era alimento básico das populações autoctônes antes do descobrimento do Brasil e da chegada dos portugueses."},{"letter":"B","text":"O taoísmo é uma doutrina mística e filosófica formulada no século VI a.C. por Lao Tse."},{"letter":"C","text":"O júri condenou o réu a oito anos de prisão pelo homicidio do casal."},{"letter":"D","text":"A palavra bem-te-vi possui três hifens."},{"letter":"E","text":"Aquí no trabalho, sua austeridáde é percebida na rigidez de opiniões e habitos."}],"answer":"D"},{"number":16,"level":1,"category":"Acentuação e Prosódia","topic":"Acentuação gráfica","stem":"Assinale a alternativa correta.","options":[{"letter":"A","text":"As palavras “papéis” e “herói” são acentuadas por serem oxítonas com hiato."},{"letter":"B","text":"As palavras “faísca” e “caído” são acentuadas por representarem a segunda vogal tônica de um hiato."},{"letter":"C","text":"As palavras “lírio” e “régua” são acentuadas porque terminam com ditongo oral tônico."},{"letter":"D","text":"As palavras “bíceps” e “fórceps” são acentuadas por serem proparoxítonas."},{"letter":"E","text":"As palavras “Piauí” e “teiú” são acentuadas por serem oxítonas com ditongos abertos."}],"answer":"B"},{"number":17,"level":1,"category":"Acentuação e Prosódia","topic":"Acentuação gráfica","stem":"Assinale a alternativa em que as palavras são acentuadas por serem oxítonas com ditongos\nabertos.","options":[{"letter":"A","text":"órgão – órfão"},{"letter":"B","text":"anéis – heróis"},{"letter":"C","text":"Piauí – teiú"},{"letter":"D","text":"papéis – tuiuiú"},{"letter":"E","text":"pontapés – carijós"}],"answer":"B"},{"number":18,"level":1,"category":"Acentuação e Prosódia","topic":"Acentuação gráfica","stem":"Leia o trecho abaixo.\n“[...] o conhecimento do real, a ordenação das ideias, o domínio do gênero textual, a\nintenção comunicativa...” (6º§)\nAssinale a opção em que a palavra proposta deve ser acentuada por não seguir a\nmesma regra de acentuação do termo em destaque no trecho.","options":[{"letter":"A","text":"Aldeia."},{"letter":"B","text":"Cheia."},{"letter":"C","text":"Conteiner"},{"letter":"D","text":"Epopeico."},{"letter":"E","text":"Boleia."}],"answer":"C"},{"number":19,"level":1,"category":"Ortografia","topic":"Uso do hífen","stem":"Leia o trecho a seguir.\n“[...] um leque de marfim semiaberto comprimia-lhe os lábios rebeldes que queriam\nexpandir-se num riso franco [...] (1º§)\nDe acordo com as normas ortográficas vigentes, a palavra destacada foi corretamente\nescrita. Marque a opção em que um dos vocábulos, ao contrário do trecho acima, está\nescrito de forma INORRETA.","options":[{"letter":"A","text":"Contrassenha; autoescola."},{"letter":"B","text":"Ab-rupto; ab-rogar."},{"letter":"C","text":"Panmágico; micro-ondas."},{"letter":"D","text":"Vaga-lume; finca-pé."},{"letter":"E","text":"Cobra-d’água; feijão-verde."}],"answer":"C"},{"number":20,"level":1,"category":"Ortografia","topic":"Ortografia","stem":"Observe o trecho a seguir.\n \n“Talvez aí, nessa hora, surja um voyeurismo que surpreenda o escritor, lá onde ele não se\nadivinhava, quando pode se desconhecer em suas palavras, estas que saem de seu pobre\nteatro do quotidiano e o espreitam, no chão mesmo da poesia, na sua letra, ao pé da letra.\"\n(7º§)\nO termo sublinhado possui uma variante ortográfica, que substitui o qu- inicial por um c-,\npodendo, portanto, ser também escrito como \"cotidiano\", sem implicar qualquer mudança do\nseu sentido original. Assinale a opção em que o termo apresentado também apresenta essa\npropriedade.","options":[{"letter":"A","text":"Quartel."},{"letter":"B","text":"Quadrilha."},{"letter":"C","text":"Quadragésimo."},{"letter":"D","text":"Quatorze."},{"letter":"E","text":"Quaresma."}],"answer":"D"},{"number":21,"level":2,"category":"Acentuação e Prosódia","topic":"Acentuação e prosódia","stem":"Assinale a opção em que os vocábulos são acentuados seguindo a mesma regra, de acordo\ncom a gramática normativa.","options":[{"letter":"A","text":"éden – pólen – vinténs"},{"letter":"B","text":"abará – Grajaú – carijó"},{"letter":"C","text":"açúcar – éter – revólver"},{"letter":"D","text":"amável – ágil – límpido"},{"letter":"E","text":"também – médium – vírus"}],"answer":"C"},{"number":22,"level":2,"category":"Acentuação e Prosódia","topic":"Acentuação e prosódia","stem":"Em qual dos trios de palavras abaixo, a acentuação se justifica pelas mesmas regras?","options":[{"letter":"A","text":"baú – cajá – avô"},{"letter":"B","text":"cipó – órfão – jiló"},{"letter":"C","text":"júri – cáqui – beribéri"},{"letter":"D","text":"caráter – amável – saída"},{"letter":"E","text":"cálido – fórceps – álbum"}],"answer":"C"},{"number":23,"level":2,"category":"Acentuação e Prosódia","topic":"Acentuação e prosódia","stem":"Assinale a alternativa em que os vocábulos são acentuados seguindo a mesma regra, de\nacordo com a gramática normativa.","options":[{"letter":"A","text":"cajá – ímãs – avó"},{"letter":"B","text":"viúva – útil – júri"},{"letter":"C","text":"vênus – você – Irecê"},{"letter":"D","text":"saúde – viúva – Grajaú"},{"letter":"E","text":"cátedra – cálido – fórceps"}],"answer":"D"},{"number":24,"level":2,"category":"Fonética e Fonologia","topic":"Ortoépia e prosódia","stem":"Quanto à acentuação, analise as afirmativas abaixo e, a seguir, assinale a alternativa\ncorreta.\nI. são, sem, sob e com são monossílabos tônicos.\nII. leucemia, pudico, inaudito, ibero e palato são vocábulos paroxítonos.\nIII. ambrosia, hieróglifo, ortoepia e réptil são vocábulos que apresentam oscilação de\npronúncia.\nIV. Todas as palavras monossilábicas são oxítonas.","options":[{"letter":"A","text":"Somente I e II estão corretas."},{"letter":"B","text":"Somente I e IV estão corretas."},{"letter":"C","text":"Somente II e III estão corretas."},{"letter":"D","text":"Somente II e IV estão corretas."},{"letter":"E","text":"Somente III e IV estão corretas."}],"answer":"C"},{"number":25,"level":2,"category":"Acentuação e Prosódia","topic":"Acentuação e prosódia","stem":"Quanto à acentuação, assinale a alternativa correta.","options":[{"letter":"A","text":"\"Dom\", \"mas\", \"são\" são monossílabos tônicos."},{"letter":"B","text":"\"Ureter\", \"ruim\", \"sutil\" são palavras oxítonas."},{"letter":"C","text":"\"Vem\", \"muito\", \"boi\" apresentam ditongos orais."},{"letter":"D","text":"\"Ibero\", \"palato\", \"Gibraltar\" são palavras paroxítonas."},{"letter":"E","text":"\"Ciclope\", “policromo”, \"avaro\" são palavras proparoxítonas."}],"answer":"B"},{"number":26,"level":2,"category":"Fonética e Fonologia","topic":"Prosódia","stem":"As silabadas, ou erros de prosódia, são frequentes no uso da língua. Assinale a\nalternativa onde não ocorre nenhuma silabada:","options":[{"letter":"A","text":"Eis aí um protótipo de rúbrica de um homem vaidoso."},{"letter":"B","text":"Para mim a humanidade está dividida em duas metades: a dos filântropos e a dos misântropos."},{"letter":"C","text":"Os arquétipos de iberos são mais pudicos que se pensa."},{"letter":"D","text":"Nesse ínterim chegou o médico com a contagem de leucócitos e o resultado da cultura de levêdos."},{"letter":"E","text":"Ávaro de informações, segui todas as pegadas do éfebo."}],"answer":"C"},{"number":27,"level":2,"category":"Fonética e Fonologia","topic":"Tonicidade","stem":"Assinale a alternativa em que todas as palavras são paroxítonas (foram omitidos os\nacentos):","options":[{"letter":"A","text":"rubrica - avaro - pegada - acrobata"},{"letter":"B","text":"mister - filantropo - misantropo - condor"},{"letter":"C","text":"pegaso - prototipo - arquetipo - rubrica"},{"letter":"D","text":"necromancia - quiromancia - ibero - nobel"},{"letter":"E","text":"nenhuma das anteriores"}],"answer":"A"},{"number":28,"level":2,"category":"Fonética e Fonologia","topic":"Fonética e prosódia","stem":"Analise as afirmativas abaixo:\nI – No vocábulo “ruim” há um hiato.\nII – É facultativo pronunciar-se o “u” depois de “g” na palavra “antiguidade”.\nIII – “X” soa “Ks” nas palavras “tóxico”, “asfixia”, “intoxicar”.\nIV – São proparoxítonas “caracteres”, “edito”(lei, decreto), “filantropo”\nCom base na avaliação das afirmativas, assinale a alternativa correta.","options":[{"letter":"A","text":"Todas as afirmativas são verdadeiras."},{"letter":"B","text":"São verdadeiras as afirmativas I, II e III."},{"letter":"C","text":"São verdadeiras as afirmativas I, II e IV."},{"letter":"D","text":"São verdadeiras as afirmativas I, III e IV."},{"letter":"E","text":"São verdadeiras as afirmativas II, III e IV."}],"answer":"B"},{"number":29,"level":2,"category":"Fonética e Fonologia","topic":"Tonicidade","stem":"A proposição em que todas as palavras são paroxítonas é:\nObs.: As palavras não foram acentuadas propositalmente.","options":[{"letter":"A","text":"fluido, creem, misantropo, ureter."},{"letter":"B","text":"ruim, nobel, ambar, taxi."},{"letter":"C","text":"pudico, aziago, libido, filantropo."},{"letter":"D","text":"omega, textil, rubrica, efebo."}],"answer":"C"},{"number":30,"level":2,"category":"Fonética e Fonologia","topic":"Ortoépia e prosódia","stem":"De acordo com as normas da pronúncia, tonicidade e prosódia, analise as afirmativas\nabaixo:\nI. No vocábulo \"léxico\" o \"x\" soa como /ks/.\nII. Na palavra \"abrupto\", o \"r\" deve ser pronunciado múltiplo e sem fazer grupo com a\nconsoante anterior.\nIII. As palavras \"ureter\" e \"ruim\" são oxítonas.\nIV. As palavras \"couve-flor \" e \"arco-íris\" são paroxítonas.\nCom base na análise, assinale a alternativa correta.","options":[{"letter":"A","text":"Somente I está correta."},{"letter":"B","text":"Somente II e IV estão corretas."},{"letter":"C","text":"Somente III e IV estão corretas."},{"letter":"D","text":"Somente I, II e III estão corretas."},{"letter":"E","text":"Todas estão corretas."}],"answer":"D"},{"number":31,"level":2,"category":"Fonética e Fonologia","topic":"Silabada e tonicidade","stem":"Assinale a alternativa em que ocorre silabada:","options":[{"letter":"A","text":"batavo, pegada, rubrica, edito (lei)."},{"letter":"B","text":"fac-símile, Pégaso, sótão, tulipa."},{"letter":"C","text":"zéfiro, omega, farândula, economia."},{"letter":"D","text":"caracteres, o fluido, batavo, caráter."},{"letter":"E","text":"lêvedo, réquiem, revérbero, a súplica."}],"answer":"C"},{"number":32,"level":2,"category":"Fonética e Fonologia","topic":"Classificação da sílaba tônica","stem":"Assinale a alternativa que apresenta somente palavras proparoxítonas. Os acentos,\nquando existentes, foram propositalmente omitidos.","options":[{"letter":"A","text":"opimo, responsavel, prognostico, impecavel"},{"letter":"B","text":"barbarie, condomino, azafama, lampada"},{"letter":"C","text":"pudico, politica, amago, interim"},{"letter":"D","text":"epoca, zenite, prototipo, enobrece"},{"letter":"E","text":"acrobata, avaro, deficiencia, levedo"}],"answer":"B"},{"number":33,"level":2,"category":"Acentuação e Prosódia","topic":"Acentuação e prosódia","stem":"Assinale a alternativa em que os vocábulos são acentuados de acordo com as mesmas\nregras de acentuação gráfica das palavras abaixo transcritas, respectivamente:\nsandália; úmida; só; sensível; conteúdo.","options":[{"letter":"A","text":"réstia, sifilítico, vê, grátis, baú"},{"letter":"B","text":"água, família, há, revólver, frágil"},{"letter":"C","text":"infância, matéria, à, móveis, saúva"},{"letter":"D","text":"estória, poético, têm, viúva, maiúscula"},{"letter":"E","text":"solitária, fáceis, deixá-lo, médio, carícia"}],"answer":"A"},{"number":34,"level":2,"category":"Acentuação e Prosódia","topic":"Acentuação e prosódia","stem":"Dentre os vocábulos abaixo, assinale aquele cuja regra de acentuação é diversa\ndaquela usada no vocábulo destacado em: \"(...) a verdade é questionável\".","options":[{"letter":"A","text":"abdômen"},{"letter":"B","text":"fóssil"},{"letter":"C","text":"fascínio"},{"letter":"D","text":"tórax"},{"letter":"E","text":"câncer"}],"answer":"C"},{"number":35,"level":2,"category":"Acentuação e Prosódia","topic":"Acentuação e prosódia","stem":"Assinale a opção que apresenta palavras que devem ser acentuadas seguindo as\nmesmas regras, respectivamente, das palavras destacadas no trecho \"A diferença - a\nfavor do cachorro - é que este está realmente por perto, todos os dias, e é sensível aos\nnossos estados de ânimo, tornando-se intimo a seu modo.\" (7°§).","options":[{"letter":"A","text":"Ruim, aprazivel, penultimo."},{"letter":"B","text":"Hifens, climax, hiperbole."},{"letter":"C","text":"Parabens, exequivel, interim."},{"letter":"D","text":"Açai, gratuito, rubrica."},{"letter":"E","text":"Tenaz, improvavel, alcoolico."}],"answer":"C"},{"number":36,"level":2,"category":"Acentuação e Prosódia","topic":"Acentuação e prosódia","stem":"Assinale a opção em que a palavra destacada foi corretamente acentuada.","options":[{"letter":"A","text":"Devemos procurar apôio uns com os outros."},{"letter":"B","text":"Manteve o braço na tipóia durante toda a manobra."},{"letter":"C","text":"Nem todos os heróis de guerra foram condecorados."},{"letter":"D","text":"Não convêm levar as crianças para a festa na praia."},{"letter":"E","text":"Os meninos abandonados foram conduzidos ao Juízado."}],"answer":"C"},{"number":37,"level":2,"category":"Acentuação e Prosódia","topic":"Acentuação e prosódia","stem":"Assinale a opção na qual a palavra em destaque está acentuada conforme a regra\nortográfica vigente.","options":[{"letter":"A","text":"O marido estava com os pêlos do braço emaranhados por esfregá-los na toalha."},{"letter":"B","text":"Alegando estar com cefaléia, a mulher continuou em silêncio até o final do jantar."},{"letter":"C","text":"O marido pediu ao garçom uma pêra flambada com calda de chocolate para dois."},{"letter":"D","text":"A mulher não prestou atenção ao escarcéu que o marido fez por causa da Internet."},{"letter":"E","text":"De um pólo a outro, muitos abdicam de uma conversa ao vivo para usar o whatsApp."}],"answer":"D"},{"number":38,"level":2,"category":"Acentuação e Prosódia","topic":"Acentuação e prosódia","stem":"Em que opção a acentuação do termo destacado está correta?","options":[{"letter":"A","text":"A prática da leitura constrói cidadãos capazes de entender criticamente a realidade."},{"letter":"B","text":"De acordo com o texto, pessoas que lêem, desenvolvem o raciocínio e falam melhor."},{"letter":"C","text":"Quando o conferencista enfatizou a importância da leitura, foi ovacionado pela platéia."},{"letter":"D","text":"A ignorân a, paroxítona e proparoxítona."},{"letter":"D","text":"Oxítona, proparoxítona e paroxítona."},{"letter":"E","text":"Oxítona, paroxítona e proparoxítona."}],"answer":"C"},{"number":58,"level":3,"category":"Ortografia","topic":"Uso do hífen","stem":"Segundo a convenção ortográfica\natual, não se emprega o hífen em autoescola. Aponte a alternativa em que a palavra esteja\ncorretamente grafada, com ou sem hífen.","options":[{"letter":"A","text":"auto-retrato"},{"letter":"B","text":"infrahepático"},{"letter":"C","text":"intra-venoso"},{"letter":"D","text":"proto-evangelho"},{"letter":"E","text":"subchefe"}],"answer":"E"},{"number":59,"level":3,"category":"Acentuação e Prosódia","topic":"Acentuação gráfica","stem":"Assinale a alternativa em que os\nvocábulos estejam acentuados pela mesma razão.","options":[{"letter":"A","text":"também, álbum"},{"letter":"B","text":"matemática, táxi"},{"letter":"C","text":"parabéns, hífen"},{"letter":"D","text":"júri, raízes"},{"letter":"E","text":"troféu, remói"}],"answer":"E"},{"number":60,"level":3,"category":"Acentuação e Prosódia","topic":"Acentuação gráfica","stem":"Assinale a opção em que todos os\nvocábulos seguem, respectivamente, as mesmas regras de acentuação das seguintes palavras\ndo texto: última, satisfatório e além.","options":[{"letter":"A","text":"seriíssimo, náufrago, enxáguem."},{"letter":"B","text":"álibi, necessário, vintém."},{"letter":"C","text":"hífen, própria, aniversário."},{"letter":"D","text":"também, série, até."},{"letter":"E","text":"matemática, ninguém, parabéns."}],"answer":"B"}];
const $=s=>document.querySelector(s);let index=0,answered={};

function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

const chosen=answered[q.number];$("#card").innerHTML='<div class="meta"><span class="tag">Questão '+q.number+'</span><span class="tag">Nível '+q.level+'</span><span class="tag">'+esc(q.category)+'</span><span class="tag">'+esc(q.topic)+'</span></div><p class="stem">'+esc(q.stem)+'</p><div class="choices">'+q.options.map(o=>'<button class="choice '+(chosen?(o.letter===q.answer?'correct':o.letter===chosen?'wrong':''):'')+'" data-answer="'+o.letter+'" '+(chosen?'disabled':'')+'><b>'+o.letter+') </b>'+esc(o.text)+'</button>').join('')+'</div><div id="feedback" class="feedback '+(chosen?(chosen===q.answer?'show good':'show bad'):'')+'">'+(chosen?'<div class="answerline">R: letra '+q.answer+'</div>'+(chosen===q.answer?'Resposta correta.':'Resposta incorreta.'):'')+'</div>';
$("#counter").textContent=(index+1)+" / "+L.length;$("#prev").disabled=index===0;$("#next").disabled=index>=L.length-1;
document.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>answer(q,b.dataset.answer)));
}
function answer(q,picked){if(answered[q.number])return;answered[q.number]=picked;const correct=picked===q.answer;try{const target=window.opener&&window.opener.parent;if(target)target.postMessage({type:"eear-question-attempt",attempt:{source:"fonetica",questionId:"pdf-fonetica-"+q.number,eventId:"pdf-fonetica-"+q.number+"-"+Date.now(),subject:"Português",topic:q.category,content:q.topic,picked,correct:correct,date:new Date().toISOString().slice(0,10)}},"*")}catch(e){}render()}
