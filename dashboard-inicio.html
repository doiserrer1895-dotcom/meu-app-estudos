<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Painel geral · Início</title>
<style>
:root{
  --bg:#050505; --s1:rgba(255,255,255,.035); --s2:rgba(255,255,255,.055); --s3:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.17);
  --tx:#fafafa; --mu:#8e8e95; --mu2:#5a5a60; --cream:#f3f1ec; --ink:#080808;
  --ok:#6ee7a0; --warn:#f6b04a; --r:24px; --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#020202;color:var(--tx);font-family:Inter,-apple-system,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum","cv11"}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:center;background:radial-gradient(60% 50% at 50% 0%,#161616,#020202)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.app{width:100%;max-width:440px;height:100vh;height:100dvh;max-height:940px;position:relative;overflow:hidden;
  background:radial-gradient(120% 55% at 85% -8%,rgba(255,255,255,.11),transparent 55%),radial-gradient(90% 45% at 0% 105%,rgba(255,255,255,.06),transparent 60%),#050505}
@media(min-width:520px){
  body{padding:24px}
  .app{height:min(940px,calc(100vh - 48px));border-radius:46px;border:1px solid var(--line2);box-shadow:0 0 0 9px #0a0a0a,0 50px 140px rgba(255,255,255,.08)}
}
.main{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0;transform-origin:left center;transition:transform .55s var(--ease),filter .55s var(--ease),border-radius .55s}
.dopen .main{transform:translateX(9%) scale(.93);filter:brightness(.55);border-radius:30px;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:20px 18px 10px}
.hello{flex:1;min-width:0}
.hello small{display:block;color:var(--mu);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.hello h1{font-size:25px;font-weight:800;letter-spacing:-.035em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:8px}
.ibtn{width:44px;height:44px;border-radius:15px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid var(--line);display:grid;place-items:center;position:relative;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);transition:.25s var(--ease)}
.ibtn:active{transform:scale(.92)}
.ibtn svg{width:20px;height:20px}
.ibtn.menu{background:#fff;border-color:#fff}
.ibtn.menu svg{stroke:#000}
.dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #151515,0 0 10px #fff}
.content{flex:1;overflow-y:auto;padding:12px 18px 40px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.sub{display:none}
.sub.on{display:block}
.sub.on>*{animation:rise .6s var(--ease) both}
.sub.on>*:nth-child(2){animation-delay:.05s}.sub.on>*:nth-child(3){animation-delay:.1s}.sub.on>*:nth-child(4){animation-delay:.15s}.sub.on>*:nth-child(5){animation-delay:.2s}.sub.on>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.sec{display:flex;justify-content:space-between;align-items:center;margin:26px 4px 12px}
.sec h3{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);font-weight:700}
.sec a{font-size:12px;color:#fff;font-weight:700;opacity:.65}
.card{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 14px 36px rgba(0,0,0,.4)}
.card.light{background:linear-gradient(155deg,#fff 0%,#e7e4dd 100%);color:var(--ink);border-color:#fff;box-shadow:0 22px 60px rgba(255,255,255,.09),inset 0 -1px 0 rgba(0,0,0,.07)}
.card.light .mu{color:#6b6860}
.card.glow{background:radial-gradient(130% 150% at 100% 0%,rgba(255,255,255,.17),rgba(255,255,255,.02) 55%),#0a0a0a}
.card.glow::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;border:1px solid rgba(255,255,255,.1);box-shadow:0 0 0 22px rgba(255,255,255,.025),0 0 0 44px rgba(255,255,255,.015);pointer-events:none}
.mu{color:var(--mu)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.stat b{display:block;font-size:25px;font-weight:800;letter-spacing:-.035em}
.stat span{font-size:11.5px;color:var(--mu);font-weight:600}
.big{font-size:46px;font-weight:900;letter-spacing:-.05em;line-height:1}
.h{font-size:17px;font-weight:700;letter-spacing:-.02em}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.08);font-size:11.5px;font-weight:700;border:1px solid var(--line)}
.pill.w{background:#fff;color:#000;border-color:#fff}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#9a9a9a,#fff);box-shadow:0 0 14px rgba(255,255,255,.45);transition:width .8s var(--ease)}
.card.light .bar{background:#d3d0c8}.card.light .bar i{background:linear-gradient(90deg,#555,#000);box-shadow:none}
.up{color:var(--ok);font-weight:700;font-size:12px}
.lv{display:flex;gap:16px;align-items:flex-end;position:relative;z-index:1}
.lv .num{font-size:96px;font-weight:900;letter-spacing:-.07em;line-height:.82;background:linear-gradient(180deg,#fff,#8a8a8a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(3px 4px 0 #2e2e2e)}
.lv .sm{font-size:13px;font-weight:800;letter-spacing:.24em;color:var(--mu)}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#fff,#7a7a7a);color:#000;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.08)}
.avatar.sm{width:40px;height:40px;font-size:13px}
.avatar.d{background:linear-gradient(135deg,#2a2a2a,#111);color:#fff;border:1px solid var(--line2);box-shadow:none}
.week{display:flex;justify-content:space-between;margin-top:14px}
.wd{text-align:center;font-size:11px;color:var(--mu);font-weight:700}
.wd i{display:grid;place-items:center;width:35px;height:35px;border-radius:50%;margin-top:7px;border:1.5px solid var(--line2);font-style:normal;font-size:13px;color:var(--mu2)}
.wd.ok i{background:#fff;color:#000;border-color:#fff;box-shadow:0 0 16px rgba(255,255,255,.3)}
.wd.today i{border-color:#fff;color:#fff}
.grp-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:15px;background:linear-gradient(135deg,#fff,#e6e3dc);color:#111;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:16px 0 9px}
.grp-h.late{background:linear-gradient(135deg,#fbe7bd,#f0cf8e)}
.grp-h .n{margin-left:auto;background:#111;color:#fff;border-radius:99px;padding:2px 9px;font-size:11px}
.task{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid var(--line);margin-bottom:9px;transition:.35s var(--ease);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.task:active{transform:scale(.985)}
.task .ck{width:25px;height:25px;border-radius:50%;border:2px solid #666;flex:none;display:grid;place-items:center;transition:.3s var(--ease)}
.task .ck svg{width:13px;height:13px;opacity:0;stroke:#000;transform:scale(.4);transition:.3s var(--ease)}
.task.done .ck{background:#fff;border-color:#fff;box-shadow:0 0 16px rgba(255,255,255,.4)}.task.done .ck svg{opacity:1;transform:none}
.task.done .t{text-decoration:line-through;color:var(--mu)}
.task .em{font-size:20px;width:28px;height:28px;display:grid;place-items:center}
.task .t{font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.task .c{font-size:11.5px;color:var(--mu);margin-top:2px}
.task .tm{margin-left:auto;font-size:11.5px;font-weight:700;color:#e6e6e6;background:rgba(255,255,255,.07);padding:7px 10px;border-radius:11px;white-space:nowrap}
.task .xp{font-size:10.5px;font-weight:800;color:#000;background:#fff;padding:3px 8px;border-radius:99px;margin-top:6px;display:inline-block}
.task .sk{width:32px;height:32px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;color:var(--mu);font-size:14px;flex:none;background:rgba(255,255,255,.04)}
.task.skipped{opacity:.45}
.late-t{border-color:rgba(246,176,74,.35);background:linear-gradient(180deg,rgba(246,176,74,.08),rgba(255,255,255,.02))}
.late-t .tm{background:rgba(246,176,74,.12);color:var(--warn)}
.ftabs{display:flex;gap:8px;margin:6px 0 16px}
.ftab{flex:1;padding:13px 6px;border:1px solid var(--line);border-radius:15px;font-weight:800;font-size:13px;color:#ddd;background:rgba(255,255,255,.035);text-align:center;transition:.3s var(--ease)}
.ftab.on{background:linear-gradient(135deg,#fff,#e6e3dc);color:#000;border-color:#fff;box-shadow:0 8px 26px rgba(255,255,255,.18)}
.ftab b{margin-left:5px;opacity:.6}
.ring{--p:60;--sz:120px;width:var(--sz);height:var(--sz);border-radius:50%;background:conic-gradient(from 0deg,#fff calc(var(--p)*1%),rgba(255,255,255,.1) 0);display:grid;place-items:center;position:relative;flex:none;filter:drop-shadow(0 0 18px rgba(255,255,255,.18))}
.ring::before{content:"";position:absolute;inset:11px;background:#0a0a0a;border-radius:50%}
.card.light .ring{background:conic-gradient(#000 calc(var(--p)*1%),#cfccc4 0);filter:none}
.card.light .ring::before{background:#efede8}
.ring>div{position:relative;text-align:center}
.ring b{font-size:25px;font-weight:900;letter-spacing:-.04em;display:block}
.ring span{font-size:10.5px;color:var(--mu);font-weight:700}
.subj{display:flex;align-items:center;gap:13px;padding:14px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid var(--line);margin-bottom:9px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.ico{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#fff,#cfcfcf);color:#000;display:grid;place-items:center;font-weight:900;font-size:15px;flex:none}
.ico.d{background:rgba(255,255,255,.07);color:#fff;border:1px solid var(--line)}
.subj .bar{margin-top:9px}
.fc{perspective:1000px;height:220px;margin-bottom:12px}
.fc-in{position:relative;width:100%;height:100%;transition:transform .7s var(--ease);transform-style:preserve-3d;cursor:pointer}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;border-radius:28px;padding:24px;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:space-between}
.fc-f{background:linear-gradient(155deg,#fff,#e4e1da);color:#000;box-shadow:0 24px 60px rgba(255,255,255,.1)}
.fc-b{background:radial-gradient(120% 120% at 100% 0%,rgba(255,255,255,.14),#080808);border:1.5px solid rgba(255,255,255,.7);transform:rotateY(180deg)}
.fc-f h4{font-size:25px;letter-spacing:-.03em;line-height:1.15}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{padding:13px 4px;border-radius:15px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12px;font-weight:700;transition:.2s}
.rate button:active{background:#fff;color:#000;transform:scale(.95)}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:56px;padding:13px 0;text-align:center;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line);transition:.3s var(--ease)}
.day small{display:block;font-size:10.5px;color:var(--mu);font-weight:700;letter-spacing:.06em}
.day b{font-size:20px;display:block;margin-top:5px;letter-spacing:-.03em}
.day.on{background:#fff;color:#000;border-color:#fff;box-shadow:0 8px 26px rgba(255,255,255,.22)}.day.on small{color:#444}
.tl{position:relative;padding-left:24px;margin-top:12px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:linear-gradient(#fff3,#fff1)}
.ev{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:10px}
.ev::before{content:"";position:absolute;left:-24px;top:20px;width:12px;height:12px;border-radius:50%;background:#050505;border:2px solid #fff}
.ev.now{background:linear-gradient(155deg,#fff,#e4e1da);color:#000;border-color:#fff;box-shadow:0 18px 44px rgba(255,255,255,.12)}.ev.now::before{background:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.2)}
.ev .tm{font-size:11px;font-weight:800;color:var(--mu);letter-spacing:.08em}.ev.now .tm{color:#555}
.ev b{display:block;font-size:15.5px;margin-top:4px;letter-spacing:-.02em}
.timer{text-align:center;padding:30px 16px}
.timer .ring{margin:0 auto;--sz:240px}
.timer .ring::before{inset:13px}
.timer .ring b{font-size:58px;font-variant-numeric:tabular-nums;letter-spacing:-.05em}
.ctrl{display:flex;gap:12px;justify-content:center;margin-top:26px;position:relative;z-index:1}
.btn{padding:16px 28px;border-radius:18px;font-weight:800;background:#fff;color:#000;font-size:15px;box-shadow:0 10px 30px rgba(255,255,255,.18);transition:.2s var(--ease);cursor:pointer}
.btn:active{transform:scale(.96)}
.btn.g{background:rgba(255,255,255,.07);color:#fff;border:1px solid var(--line);box-shadow:none}
.modes{display:flex;gap:8px;justify-content:center;margin-bottom:22px}
.mode{padding:9px 15px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--mu);transition:.3s var(--ease)}
.mode.on{background:#fff;color:#000;border-color:#fff}
.chart{display:flex;align-items:flex-end;gap:10px;height:160px;margin-top:16px;padding-top:6px;background:repeating-linear-gradient(to top,transparent 0 39px,rgba(255,255,255,.06) 39px 40px)}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:7px;font-size:11px;color:var(--mu);font-weight:700}
.chart i{display:block;width:100%;background:linear-gradient(180deg,#3a3a3a,#1c1c1c);border-radius:10px 10px 5px 5px;animation:grow .9s var(--ease) both;transform-origin:bottom}
.chart div.hi i{background:linear-gradient(180deg,#fff,#a8a8a8);box-shadow:0 0 24px rgba(255,255,255,.35)}
.chart div.hi{color:#fff}
#chart{gap:5px}
#chart .perf-day{gap:5px;min-width:0}
#chart .perf-pair{height:100%;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
#chart .perf-pair i{width:42%;max-width:15px;min-height:2px;margin:0;border-radius:6px 6px 3px 3px;animation:grow .65s var(--ease) both}
#chart .perf-pair .current{background:linear-gradient(180deg,#fff,#a8a8a8);box-shadow:0 0 12px rgba(255,255,255,.2)}
#chart .perf-pair .previous{background:linear-gradient(180deg,#a78bdb,#624c91)}
#chart .perf-day.hi .perf-pair .current{box-shadow:0 0 18px rgba(255,255,255,.45)}
#chart .perf-day>span:first-child{font-size:9px;white-space:nowrap}
.perf-legend{display:flex;justify-content:center;gap:18px;margin-top:12px;color:var(--mu);font-size:10px;font-weight:700}
.perf-legend span{display:flex;align-items:center;gap:6px}
.perf-legend i{display:inline-block;width:8px;height:8px;border-radius:3px;background:#fff}
.perf-legend span+span i{background:#a78bdb}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.meal{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:22px;padding:15px;margin-bottom:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.meal-h{display:flex;align-items:center;gap:12px}
.meal ul{list-style:none;margin-top:12px;border-top:1px dashed var(--line2);padding-top:9px}
.meal li{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:#d8d8d8}
.meal li span{color:var(--mu)}
.macro{margin-bottom:14px}
.macro .row{margin-bottom:7px;font-size:12.5px;font-weight:700}
.water{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.cup{width:34px;height:46px;border-radius:7px 7px 12px 12px;border:2px solid #4a4a4a;position:relative;overflow:hidden;transition:.35s var(--ease)}
.cup.f{border-color:#fff;box-shadow:0 0 16px rgba(255,255,255,.3)}
.cup.f::after{content:"";position:absolute;left:0;right:0;bottom:0;top:24%;background:linear-gradient(180deg,#fff,#bdbdbd)}
.shop{display:flex;align-items:center;gap:13px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.shop .ck{width:23px;height:23px;border-radius:8px;border:2px solid #666;display:grid;place-items:center;flex:none;transition:.25s}
.shop .ck svg{width:12px;height:12px;stroke:#000;opacity:0}
.shop.done .ck{background:#fff;border-color:#fff}.shop.done .ck svg{opacity:1}
.shop.done .t{color:var(--mu);text-decoration:line-through}
.shop .pr{margin-left:auto;color:var(--mu);font-size:12.5px;font-weight:700}
.addrow{display:flex;gap:8px;margin-top:14px}
.addrow input{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:14px 16px;outline:none;transition:.25s}
.addrow input:focus{border-color:#fff;background:rgba(255,255,255,.08)}
svg.line{width:100%;height:auto;display:block}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.photos div{aspect-ratio:3/4;border-radius:18px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.03),rgba(255,255,255,.03) 8px,rgba(255,255,255,.07) 8px,rgba(255,255,255,.07) 16px);border:1px solid var(--line);display:flex;align-items:flex-end;padding:10px;font-size:11px;font-weight:700;color:var(--mu)}
.post{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.post p{margin:13px 0;font-size:14.5px;line-height:1.5;color:#ececec}
.post .acts{display:flex;gap:18px;color:var(--mu);font-size:13px;font-weight:700}
.post .acts button{display:flex;gap:6px;align-items:center;color:var(--mu)}
.post .acts button.liked{color:#fff}
.badge{display:inline-block;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:11px;padding:8px 11px;font-size:12px;font-weight:700}
.composer{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:22px;padding:10px}
.composer input{flex:1;background:none;border:0;outline:none;padding:6px}
.rk{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);margin-bottom:9px}
.rk .pos{width:24px;font-weight:900;color:var(--mu);text-align:center}
.rk.me{background:linear-gradient(135deg,#fff,#e4e1da);color:#000;border-color:#fff;box-shadow:0 14px 40px rgba(255,255,255,.14)}.rk.me .pos{color:#000}.rk.me .mu{color:#555}
.on-dot{width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid #0a0a0a;position:absolute;right:0;bottom:0;box-shadow:0 0 10px var(--ok)}
.fr{position:relative}
.hint{font-size:11px;color:var(--mu2);text-align:center;margin-top:18px}
.toast{position:absolute;left:50%;bottom:30px;transform:translate(-50%,20px);background:#fff;color:#000;padding:12px 20px;border-radius:99px;font-weight:800;font-size:13px;opacity:0;pointer-events:none;transition:.4s var(--ease);z-index:60;box-shadow:0 14px 40px rgba(255,255,255,.25)}

/* ---------- Performance & acessibilidade ---------- */

.content{overscroll-behavior:contain}

.card,.task,.stat,.meal,.ev,.subj,.post{contain:layout style}
button:focus-visible,input:focus-visible,[data-go]:focus-visible{outline:2px solid #fff;outline-offset:2px}

@media(max-width:560px){.sn-datebar{align-items:stretch;flex-direction:column}.sn-date-caption{text-align:left}.sn-confirm{align-items:stretch;flex-direction:column}.sn-confirm button{max-width:none;width:100%}.sn-hero{grid-template-columns:46px 1fr;gap:10px}.sn-hero .moon{width:46px;height:46px}.sn-ef{grid-column:2;border-left:0;border-top:1px solid var(--line);padding:9px 0 0}.sn3 b{font-size:20px}}

.d-head{background:rgba(255,255,255,.05);color:#fff;border:1px solid var(--line);margin:12px 14px 6px;padding:12px;gap:12px;align-items:center}

/* ---------- Campo de Batalha ---------- */
.cf-nav{display:flex;align-items:center;justify-content:space-between;text-align:center}
.cf-nav b{display:block;font-size:26px;font-weight:900;letter-spacing:-.04em}.cf-nav small{color:var(--mu);font-weight:700;font-size:12px}

.mc{--ac:#f0626a;display:grid;grid-template-columns:1fr 50px;border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:24px;background:rgba(255,255,255,.03);margin-bottom:12px;overflow:hidden}

.tree{position:relative;margin:16px 0 0;padding-left:42px}.tree::before{content:"";position:absolute;left:6px;top:46px;bottom:26px;width:2px;background:#ddd}

.rk .rkn{font-size:40px}.rkn .dg{position:relative;display:inline-block}.rkn .gh{position:absolute;left:0;top:0;font-style:normal;color:rgba(255,255,255,.06)}.rkn .dg>span{position:relative}

/* ---------- Rank: números animados ---------- */
.odo{--h:1.1em;display:inline-flex;vertical-align:top;font-variant-numeric:tabular-nums;filter:drop-shadow(0 0 10px rgba(255,255,255,.35));animation:numPulse 3.2s ease-in-out 1.8s infinite}
.od{display:inline-block;height:var(--h);overflow:hidden}
.oc{display:flex;flex-direction:column;transform:translateY(calc(var(--t)*var(--h)*-1));animation:odoRoll 1.5s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i)*.14s + .15s)}
.oc i{display:block;height:var(--h);line-height:var(--h);font-style:normal;background:linear-gradient(180deg,#fff 25%,#a9a9b2);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.os{display:inline-block;height:var(--h);line-height:var(--h);color:#8e8e95}
@keyframes odoRoll{from{transform:translateY(0)}}
@keyframes numPulse{0%,100%{filter:drop-shadow(0 0 8px rgba(255,255,255,.3))}50%{filter:drop-shadow(0 0 18px rgba(255,255,255,.75))}}
@keyframes sheen{0%,55%{transform:translateX(0) skewX(-18deg)}100%{transform:translateX(520%) skewX(-18deg)}}
@keyframes spinr{to{rotate:360deg}}
@keyframes breathe{0%,100%{opacity:.55;scale:.92}50%{opacity:1;scale:1.08}}
@keyframes twk{0%,100%{opacity:0;scale:.4}50%{opacity:1;scale:1}}
.rk .rkn{font-size:42px}
.rk .rkn .odo{margin-left:1px}
.gx-grid .sq.rk::after{display:block;content:"";position:absolute;top:0;bottom:0;left:-30%;right:auto;width:26%;border-radius:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),transparent);transform:skewX(-18deg);animation:sheen 5s ease-in-out infinite;pointer-events:none}
.gx-grid .sq.rk:nth-child(2)::after{animation-delay:.6s}.gx-grid .sq.rk:nth-child(3)::after{animation-delay:1.2s}.gx-grid .sq.rk:nth-child(4)::after{animation-delay:1.8s}
.dl.u{animation:dlGlow 2.8s ease-in-out infinite}
@keyframes dlGlow{0%,100%{box-shadow:0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 14px rgba(255,255,255,.35)}}
.top.shim{position:relative;overflow:hidden}
.top.shim::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:35%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);animation:sheen 3.2s ease-in-out infinite;display:none!important}
.chipn{display:flex!important;align-items:flex-start}.chipn .odo{--h:1.15em;animation-duration:2.6s}
.chip2:has(.chipn){animation:glowW 3s ease-in-out infinite}
/* hero do rank (Comunidade) */
.rhero{position:relative;isolation:isolate;overflow:hidden;border-radius:28px;padding:22px 16px 16px;margin:4px 0 16px;text-align:center;background:#0b0b0d}
.rhero::before{content:"";position:absolute;z-index:-2;left:50%;top:50%;width:230%;aspect-ratio:1;translate:-50% -50%;background:conic-gradient(from 0deg,transparent 0 68%,rgba(255,255,255,.95) 86%,transparent 100%);animation:spinr 5.5s linear infinite}
.rhero::after{content:"";position:absolute;inset:1.5px;border-radius:26.5px;z-index:-1;background:radial-gradient(120% 90% at 50% 0%,#202026,#0b0b0d 70%)}
.rhero>*{position:relative;z-index:1}
.rhero>.rh-glow{position:absolute;z-index:0;left:50%;top:84px;width:240px;height:150px;translate:-50% -50%;background:radial-gradient(closest-side,rgba(255,255,255,.26),transparent);filter:blur(6px);animation:breathe 3.6s ease-in-out infinite}
.rhero>.spk{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px rgba(255,255,255,.8);animation:twk 2.6s ease-in-out infinite}
.spk.s1{left:18%;top:28%}.spk.s2{left:82%;top:22%;animation-delay:.8s}.spk.s3{left:70%;top:52%;animation-delay:1.5s}.spk.s4{left:26%;top:58%;animation-delay:2.1s}
.rh-k{display:block;font-size:10px;letter-spacing:.2em;font-weight:800;color:#9b9ba3}
.rh-n{display:flex;justify-content:center;align-items:flex-start;margin:10px 0 6px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;font-size:100px;line-height:1.1;letter-spacing:-.02em}
.rh-n em{font-style:normal;font-size:46px;color:#6c6c73;margin:.2em 4px 0 0;line-height:1}
.rh-m{display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px;color:#8e8e95;font-weight:700}
.rh-st{display:grid;grid-template-columns:1.3fr 1fr 1fr;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.rh-st>div{padding:0 4px}.rh-st>div+div{border-left:1px solid var(--line)}
.rh-st small{display:block;font-size:9px;letter-spacing:.14em;color:#8e8e95;font-weight:800}
.rh-st b{display:flex;justify-content:center;align-items:flex-start;margin-top:6px;font-size:19px;letter-spacing:-.02em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.odo.sm{--h:1.2em;filter:drop-shadow(0 0 6px rgba(255,255,255,.3))}
.lb .rk{animation:sqIn .5s var(--ease) both;animation-delay:calc(var(--i)*.06s + .2s)}
.lb .rk.t3 .pos{color:#fff;text-shadow:0 0 12px rgba(255,255,255,.7)}
.lb .rk.me{position:relative;overflow:hidden;animation:sqIn .5s var(--ease) both,glowW 2.8s ease-in-out 1s infinite;animation-delay:calc(var(--i)*.06s + .2s),0s}
.lb .rk.me::after{content:"";position:absolute;top:0;bottom:0;left:-30%;width:22%;background:linear-gradient(90deg,transparent,rgba(0,0,0,.09),transparent);animation:sheen 4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.odo,.oc,.rhero::before,.rh-glow,.spk,.gx-grid .sq.rk::after,.top.shim::after,.dl.u,.chip2:has(.chipn),.lb .rk.me,.lb .rk.me::after{animation:none!important}.oc{transform:translateY(calc(var(--t)*var(--h)*-1))}}

/* ---------- Sono editável ---------- */
.snhint{font-size:11.5px;color:#8e8e95;margin:-6px 0 12px;font-weight:600}
.sn3>label{display:block;padding:4px 2px;border-radius:14px;cursor:pointer;transition:background .2s}.sn3>label:active{background:rgba(255,255,255,.06)}

.sn2 b{font-variant-numeric:tabular-nums}
.snt{font-style:normal;font-size:10.5px;color:#8e8e95;font-weight:700}
.swk>button{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;padding:4px 0;border-radius:12px;color:inherit}

.stp button{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:#fff;font-size:18px;font-weight:700;line-height:1;display:grid;place-items:center;position:relative;z-index:2}
.stp button:active{background:rgba(255,255,255,.2)}
#sonoBox.again .gx-grid .sq,#sonoBox.again .swk u,#sonoBox.again .tl u,#sonoBox.again .sn-hero,#sonoBox.again .card{animation:none}

.stb{display:block;height:8px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}

/* acabamento geral */
#gx>*{animation:rise .7s var(--ease) both}

.pb u{background:linear-gradient(90deg,rgba(255,255,255,.4),#fff)!important;box-shadow:0 0 10px rgba(255,255,255,.3)!important}

/* seletor de horário */

/* nível */
.lvl{position:relative;overflow:hidden;border-radius:28px;padding:18px 18px 16px;margin-bottom:12px;border:1px solid var(--line2);background:radial-gradient(110% 120% at 100% 0%,rgba(240,98,106,.22),transparent 55%),linear-gradient(160deg,#18181c,#09090b);box-shadow:0 18px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.09)}
.lvl::after{content:"";position:absolute;right:-50px;bottom:-60px;width:170px;height:170px;border-radius:50%;border:1px solid rgba(255,255,255,.07);box-shadow:0 0 0 22px rgba(255,255,255,.02),0 0 0 46px rgba(255,255,255,.012);pointer-events:none}
.lvl-top{display:flex;align-items:center;justify-content:space-between}.lvl-top small{font-size:10px;letter-spacing:.18em;font-weight:800;color:#8e8e95}
.lvl-main{display:flex;align-items:center;gap:18px;margin-top:14px;position:relative;z-index:1}
.lvl-ring{position:relative;width:126px;height:126px;flex:none}
.lvr{width:100%;height:100%;filter:drop-shadow(0 0 14px rgba(240,98,106,.45))}
.lvr circle{fill:none;stroke-width:8}.lvr .t{stroke:rgba(255,255,255,.08)}.lvr .v{stroke:url(#lvg);stroke-linecap:round;animation:rgIn 1.5s var(--ease) .3s both}
.lvl-n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lvl-n small{font-size:10px;letter-spacing:.28em;color:#8e8e95;font-weight:800;margin-bottom:2px}
.lvl-n .odo{font-size:44px;font-weight:800;letter-spacing:-.05em}
.lvl-xp{flex:1;min-width:0}.lvl-xp small{display:block;font-size:10px;letter-spacing:.18em;font-weight:800;color:#8e8e95}
.lvl-xp b{display:block;font-size:40px;font-weight:300;letter-spacing:-.05em;line-height:1.1;margin:5px 0 12px;background:linear-gradient(180deg,#fff,#a9a9b2);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(255,255,255,.22))}
.lvl-xp .bar{height:8px}.lvl-xp .bar i{background:linear-gradient(90deg,#f0626a,#ffb199);box-shadow:0 0 14px rgba(240,98,106,.55);animation:grow 1.2s var(--ease) .3s both}
.lvl-xp em{display:block;font-style:normal;font-size:12px;color:#a4a4ab;font-weight:700;margin-top:9px}
.lvl-q{position:relative;z-index:1;margin-top:16px;padding-top:13px;border-top:1px solid var(--line);font-size:14px;font-weight:700;letter-spacing:-.02em;color:#d6d6da}
/* stats */
.cs-st .stat{position:relative;overflow:hidden;padding:13px 12px 12px;border-radius:20px}
.cs-st .stat::before{content:"";position:absolute;right:-22px;top:-22px;width:80px;height:80px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--ac) 38%,transparent),transparent);pointer-events:none}
.cs-st .ico{position:relative;display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 30%,transparent)}
.cs-st .ico svg{width:16px;height:16px}
.cs-st .stat b{position:relative;font-size:28px;font-weight:800;margin-top:12px;line-height:1.1}
.cs-st .stat .odo{filter:drop-shadow(0 0 8px color-mix(in srgb,var(--ac) 45%,transparent));animation:none}
.cs-st .stat>span{position:relative;display:block;margin-top:3px}
/* semana */
.cs-wk .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px;justify-content:initial}
.cs-wk .wd{display:flex;flex-direction:column;align-items:center}
.cs-wk .wd i{width:100%;max-width:38px;aspect-ratio:1;height:auto;margin-top:8px;font-size:14px;font-weight:800}
.cs-wk .wd.ok i{background:linear-gradient(160deg,#fff,#cfcfd4);box-shadow:0 0 16px rgba(255,255,255,.3)}
.cs-wk .wd.today i{border-color:#f0626a;color:#f0626a;animation:todayP 2.4s ease-in-out infinite}
@keyframes todayP{0%,100%{box-shadow:0 0 0 0 rgba(240,98,106,.45)}50%{box-shadow:0 0 0 7px rgba(240,98,106,0)}}
.cs-wb{margin-top:16px;height:6px}.cs-wb i{background:linear-gradient(90deg,#f0626a,#ffb199);box-shadow:0 0 12px rgba(240,98,106,.5);animation:grow 1.1s var(--ease) .3s both}
.cs-wt{margin-top:10px;font-size:12px;color:#8e8e95;font-weight:600}.cs-wt b{color:#e8e8ea}
/* rotina */
.rt-sum{border-radius:22px;padding:16px;margin-bottom:6px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02))}
.rt-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.rt-top b{display:block;font-size:34px;font-weight:300;letter-spacing:-.05em;line-height:1}.rt-top small{display:block;font-size:11px;color:#8e8e95;font-weight:700;margin-top:5px}
.rt-xp{text-align:right}.rt-xp b{font-size:22px;font-weight:800;letter-spacing:-.03em;color:#f6b04a;text-shadow:0 0 18px rgba(246,176,74,.4)}
.rt-sum .bar{height:8px}.rt-sum .bar i{background:linear-gradient(90deg,#f0626a,#f6b04a);box-shadow:0 0 12px rgba(246,176,74,.45)}
.rt-hint{font-size:11.5px;color:#8e8e95;margin-top:11px;font-weight:600}.rt-hint b{color:#e8e8ea}
#const-0 .grp-h{background:none;color:#8e8e95;padding:0 4px;margin:22px 0 10px;font-size:10.5px;letter-spacing:.18em;gap:9px;border-radius:0}
#const-0 .grp-h::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 10px currentColor;color:#fff}
#const-0 .grp-h.k-prog::before{background:#5b8def;color:#5b8def}#const-0 .grp-h.k-late::before{background:#f6b04a;color:#f6b04a}#const-0 .grp-h.k-free::before{background:#8e8e95;color:#8e8e95;box-shadow:none}#const-0 .grp-h.k-done::before{background:#6ee7a0;color:#6ee7a0}
#const-0 .grp-h.late{background:none;color:#f6b04a}
#const-0 .grp-h .n{margin-left:auto;background:rgba(255,255,255,.07);color:#d6d6da;border:1px solid var(--line);font-size:10.5px}
.task .tr{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}.task .tr .tm{margin-left:0}
.task .xpc{font-style:normal;font-size:10.5px;font-weight:800;color:#f6b04a;letter-spacing:.02em}
.task.done .xpc{color:#6ee7a0}.task.done{border-color:rgba(110,231,160,.22);background:linear-gradient(180deg,rgba(110,231,160,.07),rgba(255,255,255,.02))}
.task.done .ck{animation:ckpop .5s var(--ease)}
@keyframes ckpop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:none}}
#const-0 .sub-in,#const-0 .bar i{transition:width .8s var(--ease)}
@media(prefers-reduced-motion:reduce){.flame i,.flame u,.cs-wk .wd.today i,#const-0 .alert .ai{animation:none!important}}

.stat .odo{display:inline-flex}.stat .od{display:inline-block}.stat .oc{display:flex}.stat .os{display:inline-block}
.stat .odo,.stat .od,.stat .oc,.stat .os{font-size:inherit;color:inherit;font-weight:inherit;letter-spacing:inherit;margin:0}
.stat .oc i{font-size:inherit}
.cs-streak small{white-space:nowrap;letter-spacing:.1em}
.cs-wk .wd.ok{padding:0;background:none;border-radius:0;font-size:11px;color:var(--mu);font-weight:700}

/* ---------- Visão geral: v9 (medidores, sono animado, missões) ---------- */
/* medidores circulares (Estudo / Concluídas) */
.gx-grid .sq.gg{padding:15px 12px 13px}
.gx-grid .sq.gg::before{display:block;content:"";position:absolute;right:-26px;top:-26px;width:100px;height:100px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--ac) 32%,transparent),transparent);pointer-events:none}
.gx-grid .sq.gg>span::before{background:var(--ac);box-shadow:0 0 8px var(--ac)}
.gg .rgw{width:78px;height:78px;margin:12px auto 2px;filter:drop-shadow(0 0 12px color-mix(in srgb,var(--ac) 40%,transparent));animation:ringGlow 3.4s ease-in-out 1.6s infinite}
.gg .rg circle{stroke-width:5}.gg .rg .v{stroke:var(--ac);animation:rgIn 1.4s var(--ease) .35s both}
.gg .rgw em{font-size:17px;font-weight:800;letter-spacing:-.03em;color:#fff;text-shadow:0 0 14px color-mix(in srgb,var(--ac) 60%,transparent)}
.gg>small{text-align:center;margin-top:8px}
@keyframes ringGlow{0%,100%{filter:drop-shadow(0 0 8px color-mix(in srgb,var(--ac) 30%,transparent))}50%{filter:drop-shadow(0 0 18px color-mix(in srgb,var(--ac) 70%,transparent))}}
.gx-grid .sq.gg::after{display:block;content:"";position:absolute;top:0;bottom:0;left:-30%;right:auto;width:26%;border-radius:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);transform:skewX(-18deg);animation:sheen 6s ease-in-out infinite;pointer-events:none}
.gx-grid .sq.gg:nth-child(3)::after{animation-delay:.8s}.gx-grid .sq.gg:nth-child(4)::after{animation-delay:1.6s}
.gx-grid .sq.cc .ccw{position:relative;display:flex;align-items:center;gap:14px;margin-top:8px}
.gx-grid .sq.cc .rgw{margin:4px 0 0;flex:none}
.cc .ccr{min-width:0}.cc .ccr small{margin:0 0 8px;text-align:left;font-size:12px}
/* missões em segmentos */
.gx-grid .sq.ms b{font-size:34px;font-weight:300}
.gx-grid .sq.ms b i{font-size:18px;font-weight:600;margin-left:2px}
.segs{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-top:14px}
.segs u{display:block;height:9px;border-radius:3px;background:rgba(255,255,255,.09);text-decoration:none}
.segs u.on{background:linear-gradient(180deg,#ffb199,#f0626a);box-shadow:0 0 8px rgba(240,98,106,.55);animation:segIn .5s var(--ease) both;animation-delay:calc(var(--i)*.05s + .3s)}
@keyframes segIn{from{transform:scaleY(.2);opacity:0}}
/* registro do sono */
.sn3>.tcell{padding:8px 4px 8px}
.tcell .tb{display:grid;place-items:center;width:42px;height:42px;margin:0 auto;border-radius:50%;font-style:normal;background:color-mix(in srgb,var(--ac) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 30%,transparent),0 0 20px color-mix(in srgb,var(--ac) 28%,transparent);animation:tbGlow 3.2s ease-in-out infinite}
.tcell:nth-child(2) .tb{animation-delay:.5s}.tcell:nth-child(3) .tb{animation-delay:1s}
@keyframes tbGlow{0%,100%{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 30%,transparent),0 0 12px color-mix(in srgb,var(--ac) 20%,transparent)}50%{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 50%,transparent),0 0 26px color-mix(in srgb,var(--ac) 50%,transparent)}}
.ti{width:22px;height:22px;stroke:var(--ac);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.ti.bd2{animation:bob 3s ease-in-out infinite}
.ti .z1{animation:zzf 2.6s ease-in-out infinite}.ti .z2{animation:zzf 2.6s ease-in-out 1.3s infinite}
@keyframes zzf{0%{opacity:0;transform:translate(-2px,3px)}30%{opacity:1}100%{opacity:0;transform:translate(3px,-5px)}}
.ti.sn .rays{transform-box:fill-box;transform-origin:center;animation:spinr 14s linear infinite}
.ti.sn .core{fill:color-mix(in srgb,var(--ac) 35%,transparent);animation:sunP 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sunP{50%{transform:scale(1.15)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.sn3>.tcell small{color:color-mix(in srgb,var(--ac) 45%,#9a9aa2);font-weight:700;margin-top:8px}
.sn3>.tcell b{text-shadow:0 0 20px color-mix(in srgb,var(--ac) 45%,transparent)}
.sn3>.tcell::after{width:22px;background:var(--ac);opacity:.7;box-shadow:0 0 10px var(--ac)}
.tl .a{background:rgba(139,140,255,.22)}
.tl .b{background:linear-gradient(90deg,#8b8cff,#5bb5ff 55%,#f6b04a);box-shadow:0 0 14px rgba(139,140,255,.45)}
/* tiles de estatística da noite */
.sn2{gap:10px}
.mt{display:flex;align-items:center;gap:11px;padding:11px;border-radius:16px;background:color-mix(in srgb,var(--ac) 8%,rgba(255,255,255,.025));border:1px solid color-mix(in srgb,var(--ac) 20%,transparent)}
.mt .mb{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:12px;font-style:normal;background:color-mix(in srgb,var(--ac) 18%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 28%,transparent)}
.mi{width:22px;height:22px;stroke:var(--ac);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.mi.hg{animation:flipH 5s ease-in-out infinite}
@keyframes flipH{0%,65%{transform:rotate(0)}85%,100%{transform:rotate(180deg)}}
.mi.bd{animation:bob 3s ease-in-out infinite}
.mi.mn .s1{animation:twk 2.4s ease-in-out infinite}.mi.mn .s2{animation:twk 2.4s ease-in-out 1.2s infinite}
.mi.mr{width:30px;height:30px}.mi.mr circle{stroke-width:4.5}.mi.mr .t{stroke:rgba(255,255,255,.1)}.mi.mr .v{stroke:var(--ac);filter:drop-shadow(0 0 4px var(--ac));animation:rgIn 1.3s var(--ease) .3s both}
.m-ef .mb{background:none;box-shadow:none}
.mt small{display:block;font-size:10.5px;color:#8e8e95;font-weight:600}
.mt b{display:block;font-size:17px;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}
#sonoBox.again .mi.mr .v{animation:none}
@media(prefers-reduced-motion:reduce){.tcell .tb,.ti,.ti .z1,.ti .z2,.ti.sn .rays,.ti.sn .core,.mi,.mi.mn .s1,.mi.mn .s2,.gg .rgw,.gx-grid .sq.gg::after{animation:none!important}}

/* ---------- Constância: Campo + Perfil (v9) ---------- */
#const-1 .cf-nav b{background:linear-gradient(180deg,#fff,#a9a9b2);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,255,255,.2))}
#const-1 .cf-d i{transition:.3s var(--ease)}
#const-1 .cf-d.ok i{background:linear-gradient(160deg,#fff,#cfcfd4);box-shadow:0 0 16px rgba(255,255,255,.3)}
#const-1 .cf-d.on i{border-color:#f0626a;color:#f0626a;animation:todayP 2.4s ease-in-out infinite}
#const-1 .cf-d.on{color:#fff}
.cf-note{display:flex;align-items:center;gap:12px;border-color:rgba(240,98,106,.3);background:linear-gradient(135deg,rgba(240,98,106,.16),rgba(255,255,255,.03));position:relative;overflow:hidden}
.cf-note::after{content:"";position:absolute;top:0;bottom:0;left:-30%;width:22%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);transform:skewX(-18deg);animation:sheen 5s ease-in-out infinite;pointer-events:none}
.cf-note .fl{font-size:22px;filter:drop-shadow(0 0 10px rgba(255,120,50,.6))}
.cf-note b{color:#fff}
.cf-gauge{position:relative;border:1px solid var(--line2);background:radial-gradient(110% 120% at 100% 0%,rgba(240,98,106,.2),transparent 55%),linear-gradient(160deg,#18181c,#09090b)}
.cf-gauge svg{filter:drop-shadow(0 0 12px rgba(240,98,106,.4))}
.cf-gauge #cfArc{stroke:url(#cfg)}
.cf-gauge .gv b{font-weight:300;font-size:50px;background:linear-gradient(180deg,#fff,#a9a9b2);-webkit-background-clip:text;background-clip:text;color:transparent}
.cf-c.on{background:#fff;color:#000;border-color:#fff;box-shadow:0 8px 24px rgba(255,255,255,.16)}
.cf-c.on b{opacity:.55}
.mc{background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 12%,rgba(255,255,255,.04)),rgba(255,255,255,.015));box-shadow:0 14px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);border-radius:26px}
.mc-top>b{font-weight:800;color:var(--ac);text-shadow:0 0 14px color-mix(in srgb,var(--ac) 55%,transparent)}
.mc-tags em{background:color-mix(in srgb,var(--ac) 14%,transparent)}
.ts{border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.03);transition:.3s var(--ease)}
.ts:active{transform:scale(.985)}
.ts.on{background:linear-gradient(135deg,#fff,#cfcfd4);box-shadow:0 0 18px rgba(255,255,255,.25)}
.fab{background:linear-gradient(135deg,#fff,#cfcfd4);box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 22px rgba(255,255,255,.2)}
#cfStats{margin:0 0 4px}
#cfStats .sq b i{font-size:15px}
/* Perfil */
#pf>*{animation:rise .6s var(--ease) both}
#pf>*:nth-child(2){animation-delay:.05s}#pf>*:nth-child(3){animation-delay:.1s}#pf>*:nth-child(4){animation-delay:.15s}#pf>*:nth-child(n+5){animation-delay:.2s}
.pf-hero{position:relative;isolation:isolate;overflow:hidden;border-radius:28px;padding:24px 16px 18px;text-align:center;margin-bottom:12px;background:#0b0b0d}
.pf-hero::before{content:"";position:absolute;z-index:-2;left:50%;top:50%;width:230%;aspect-ratio:1;translate:-50% -50%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(240,98,106,.95) 88%,transparent 100%);animation:spinr 6s linear infinite}
.pf-hero::after{content:"";position:absolute;inset:1.5px;border-radius:26.5px;z-index:-1;background:radial-gradient(120% 90% at 50% 0%,#24242b,#0b0b0d 70%)}
.pf-av{position:relative;width:92px;height:92px;margin:0 auto 14px}
.pf-av .rg{position:absolute;inset:0;filter:drop-shadow(0 0 12px rgba(240,98,106,.5))}
.pf-av .rg circle{fill:none;stroke:rgba(255,255,255,.09);stroke-width:3.2}.pf-av .rg .v{stroke:url(#lvg);stroke-linecap:round;animation:rgIn 1.4s var(--ease) .3s both}
.pf-av .avatar{position:absolute;inset:9px;width:auto;height:auto;font-size:26px}
.pf-hero h2{font-size:23px;font-weight:800;letter-spacing:-.035em}
.pf-hero p{font-size:12.5px;color:var(--mu);margin-top:4px;font-weight:600}
.pf-hero .row{justify-content:center;margin-top:14px;flex-wrap:wrap}
.pf-attr .sq b{font-size:24px}
.pf-ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ach{position:relative;overflow:hidden;text-align:center;padding:16px 6px 13px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));animation:sqIn .55s var(--ease) both;animation-delay:calc(var(--i)*.06s + .15s)}
.ach u{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 9px;border-radius:50%;text-decoration:none;font-size:22px;background:color-mix(in srgb,var(--ac,#fff) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac,#fff) 30%,transparent),0 0 20px color-mix(in srgb,var(--ac,#fff) 28%,transparent);animation:tbGlow 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*.3s)}
.ach span{display:block;font-size:11.5px;font-weight:700;color:#d6d6da}
.ach small{display:block;font-size:9.5px;letter-spacing:.1em;color:var(--mu);font-weight:800;margin-top:3px}
.ach.lock{opacity:.4}.ach.lock u{animation:none;box-shadow:inset 0 0 0 1px var(--line);background:rgba(255,255,255,.04)}
.pf-set{padding:4px 16px}
.pf-set .shop{cursor:default}.pf-set .shop:last-child{border:0}
.pf-set .pr{display:inline-flex;align-items:center;gap:7px;color:#e8e8ea}
.pf-set .pr::before{content:"";width:6px;height:6px;border-radius:50%;background:#4cd07d;box-shadow:0 0 8px #4cd07d}
.pf-set .pr.n::before{background:#8e8e95;box-shadow:none}
@media(prefers-reduced-motion:reduce){.cf-note::after,.pf-hero::before,.ach u,#const-1 .cf-d.on i{animation:none!important}}

/* ---------- Hidratação + Peso animados / cabeçalho do menu ---------- */
.hyw{display:flex;align-items:center;gap:16px;margin-top:12px}
.hyg{width:84px;flex:none;overflow:visible;animation:hyGlow 3.4s ease-in-out infinite}
@keyframes hyGlow{0%,100%{filter:drop-shadow(0 0 8px rgba(91,181,255,.22))}50%{filter:drop-shadow(0 0 20px rgba(91,181,255,.5))}}
.hyl{animation:hyFill 1.8s var(--ease) both}
@keyframes hyFill{from{transform:translateY(112px)}}
.hw1,.hw2{will-change:transform}
.hw1{animation:hyWave 3.4s linear infinite}
.hw2{animation:hyWave 5.4s linear infinite reverse}
@keyframes hyWave{from{transform:translateX(0)}to{transform:translateX(-40px)}}
.hb{fill:rgba(255,255,255,.6);animation:hyBub 4.2s ease-in infinite}
@keyframes hyBub{0%{transform:translateY(0);opacity:0}12%{opacity:.9}100%{transform:translateY(calc(var(--rise)*-1));opacity:0}}
.hyr{flex:1;min-width:0}
.hn{display:flex;align-items:flex-start;font-size:46px;font-weight:300;letter-spacing:-.06em;line-height:1.1;color:#f0f0f2}
.hn>i{font-style:normal;font-size:.36em;color:#8e8e95;font-weight:600;letter-spacing:0;margin:.45em 0 0 6px}
.hyr .dl{display:inline-block;margin-top:9px}
.hp{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:13px}
.hp u{display:block;height:14px;border-radius:5px 5px 8px 8px;background:rgba(255,255,255,.1);text-decoration:none}
.hp u.on{background:linear-gradient(180deg,#9fd8ff,#3b82d6);box-shadow:0 0 8px rgba(91,181,255,.5);animation:segIn .5s var(--ease) both;animation-delay:calc(var(--i)*.05s + .5s)}
.wtt{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:10px}
.wtc{display:grid;gap:6px;justify-items:end}
.wlc{width:100%;height:auto;display:block;overflow:visible;margin-top:12px}
.wl{fill:none;stroke:rgba(255,255,255,.8);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;animation:wlDraw 1.8s var(--ease) .2s both}
@keyframes wlDraw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.wp{fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:7 93;opacity:0;filter:drop-shadow(0 0 5px #fff);animation:wlRun 3.4s linear 2s infinite}
@keyframes wlRun{0%{stroke-dashoffset:7;opacity:1}100%{stroke-dashoffset:-93;opacity:1}}
.wa{animation:wlFade 1.1s ease .9s both}
@keyframes wlFade{from{opacity:0}}
.wg{stroke:rgba(255,255,255,.32);stroke-width:1;stroke-dasharray:3 4;animation:wgMove 2.2s linear infinite}
@keyframes wgMove{to{stroke-dashoffset:-14}}
.wgt{fill:#8e8e95;font-size:8px;font-weight:800;letter-spacing:.1em}
.wd{fill:#fff;opacity:.9;transform-box:fill-box;transform-origin:center;animation:wdIn .5s var(--ease) both;animation-delay:calc(var(--i)*.22s + .5s)}
@keyframes wdIn{from{opacity:0;transform:scale(.2)}}
.wc{fill:#fff;filter:drop-shadow(0 0 6px #fff)}
.wr{fill:none;stroke:rgba(255,255,255,.75);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:wrP 2.4s ease-out 2s infinite}
@keyframes wrP{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.4);opacity:0}}
.wtx{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#6c6c73;font-weight:800;margin-top:6px}

/* Peso: balança com ponteiro */
.wdl{width:128px;flex:none;overflow:visible;animation:wGlow 3.6s ease-in-out infinite}
@keyframes wGlow{0%,100%{filter:drop-shadow(0 0 6px rgba(255,255,255,.08))}50%{filter:drop-shadow(0 0 18px rgba(255,255,255,.28))}}
.wtk{stroke:rgba(255,255,255,.35);stroke-width:1;stroke-linecap:round;animation:wlFade .5s ease both;animation-delay:calc(var(--i)*.05s + .2s)}
.wtk.mj{stroke:rgba(255,255,255,.8);stroke-width:1.6}
.wtl{fill:#9a9aa2;font-size:7px;font-weight:800;animation:wlFade .6s ease .6s both}
.wla{stroke-dasharray:100;filter:drop-shadow(0 0 4px rgba(255,255,255,.6));animation:wlDraw 1.8s var(--ease) .5s both}
.wnd{transform:rotate(var(--a));transform-origin:60px 60px;animation:wnd 2.2s cubic-bezier(.34,1.56,.64,1) .3s both}
@keyframes wnd{from{transform:rotate(-135deg)}}
.wnw{transform-origin:60px 60px;animation:wnw 3.8s ease-in-out 2.8s infinite}
@keyframes wnw{0%,100%{transform:rotate(0)}30%{transform:rotate(1.5deg)}65%{transform:rotate(-1.2deg)}}
.wgd{fill:#6ee7a0;transform-box:fill-box;transform-origin:center;filter:drop-shadow(0 0 5px #6ee7a0);animation:wgp 2s ease-in-out infinite}
@keyframes wgp{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.45);opacity:1}}

html,body{width:100%!important;min-width:0!important;height:auto!important;min-height:100%!important;margin:0!important;overflow-x:hidden!important;overflow-y:auto!important;background:var(--bg,#080808)!important}
#app{display:block!important;width:100%!important;max-width:none!important;min-width:0!important;min-height:100vh!important;height:auto!important;margin:0!important;padding:0!important;overflow:visible!important;border-radius:0!important}
.drawer,.scrim,.top{display:none!important}
#main{display:block!important;width:100%!important;max-width:none!important;min-width:0!important;height:auto!important;min-height:100vh!important;margin:0!important;padding:0!important;overflow:visible!important}
#content{display:block!important;width:100%!important;max-width:none!important;min-width:0!important;height:auto!important;min-height:100vh!important;margin:0!important;padding:clamp(10px,1.4vw,20px)!important;overflow:visible!important}
.sub{display:none!important}

.tcell-wrap{display:grid;gap:6px;min-width:0}.sleep-ok{min-height:30px;border:1px solid rgba(255,255,255,.22);border-radius:10px;background:#fff;color:#050505;font-size:11px;font-weight:900;letter-spacing:.06em}.sleep-ok:active{transform:scale(.97)}.sn-week{margin-top:12px}.sn-week .snh{display:flex;justify-content:space-between;align-items:center;gap:8px}.sn-week .snh small{font-size:9px;color:var(--mu);font-weight:700}
