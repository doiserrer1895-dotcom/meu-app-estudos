<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diário de Estudos</title>
<style>
:root{--bg:#0a0a0a;--card:#121212;--bd:#303030;--tx:#fff;--mu:#a3a3a3;--ac:#f5f5f5;--actx:#111;--gr:#4ade80;--rd:#f87171;--in:#1c1c1c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f5f5;--card:#fff;--bd:#dedede;--tx:#111;--mu:#666;--ac:#111;--actx:#fff;--in:#f0f0f0;color-scheme:light}}
:root[data-theme="dark"]{--bg:#0a0a0a;--card:#121212;--bd:#303030;--tx:#fff;--mu:#a3a3a3;--ac:#f5f5f5;--actx:#111;--in:#1c1c1c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,"Aptos","Segoe UI Variable","Segoe UI",Roboto,Arial,sans-serif;font-size:15px;letter-spacing:-.012em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#app{max-width:520px;margin:0 auto;padding:14px 14px 110px}
.top{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:20px;margin:6px 0 12px}
.top button{background:none;border:0;color:var(--tx);font-size:26px;padding:4px 14px;cursor:pointer}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:9px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer}
.seg button.on{background:var(--ac);color:var(--actx)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px 6px;text-align:center}
.tile small{display:block;color:var(--mu);font-size:12px}.tile b{display:block;font-size:24px;margin:6px 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:18px;margin-bottom:14px}
.card h2{font-size:18px;font-weight:700;letter-spacing:-.025em;margin:0 0 12px;padding-bottom:12px;border-bottom:1px solid var(--bd)}
.card.al{border-color:var(--rd)}
svg{width:100%;height:auto;display:block}
.leg{display:flex;gap:16px;justify-content:center;color:var(--mu);font-size:13px;margin-top:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.donut{display:flex;align-items:center;gap:14px}.donut svg{width:130px;flex:none}
.lg{flex:1;font-size:13px}.lg div{display:flex;justify-content:space-between;gap:6px;padding:3px 0}
.lg label{display:block;color:var(--mu);margin:10px 0 4px}
.empty{color:var(--mu);text-align:center;padding:22px 0;font-size:14px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
.row:last-child{border:0}.row .g{flex:1;min-width:0}.row small{color:var(--mu);display:block}
.x{background:none;border:0;color:var(--mu);font-size:20px;cursor:pointer;padding:4px 8px}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--ac);background:none;color:var(--ac);cursor:pointer;flex:none;font-size:13px;padding:0}
.bar{height:8px;border-radius:8px;background:var(--in);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gr)}
.tag{font-size:12px;border-radius:99px;padding:3px 9px;background:var(--in);color:var(--mu);white-space:nowrap}
.tag.late{color:var(--rd)}.tag.now{color:var(--ac)}
.big{font-size:40px;font-weight:800;color:var(--ac)}
.add{display:flex;gap:8px}
input,select{width:100%;background:var(--in);border:1px solid var(--bd);color:var(--tx);border-radius:14px;padding:12px;font-size:16px;font-family:inherit}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px}
.btn{background:var(--ac);color:var(--actx);border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cs{display:flex;gap:8px;margin-top:8px}.cs button{flex:1;background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px;cursor:pointer}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd)}
#nav div{display:flex;width:100%;max-width:520px;gap:4px}
#nav button{flex:1;background:none;border:0;color:var(--mu);padding:8px 2px;border-radius:14px;font-size:12px;cursor:pointer}
#nav button span{display:block;font-size:20px}#nav button.on{background:var(--card);color:var(--tx)}
#nav button{font-size:10px;line-height:1.15;padding:7px 1px}#nav button span{font-size:20px;margin-bottom:2px}
.sub{color:var(--mu);font-size:13px;text-align:center;margin:-4px 0 12px}
.card.day.today{border-color:var(--gr)}.dh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}.dh span{color:var(--mu);font-size:13px}.dh small{margin-left:auto;color:var(--ac)}
.addb{width:100%;margin-top:8px;background:none;border:1px dashed var(--bd);color:var(--mu);border-radius:12px;padding:10px;font-size:14px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;font-size:14px;cursor:pointer}.chip.on{background:var(--ac);color:var(--actx);border-color:var(--ac);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);border:1px solid var(--bd);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;max-height:90%;overflow:auto}.sheet h2{margin:0 0 4px;font-size:19px}
.cs2{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:14px;padding:12px;font-weight:700;font-size:15px;cursor:pointer}
.clock{font-size:clamp(42px,12vw,64px);font-weight:750;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:-.045em;margin:14px 0;color:var(--tx)}
.two3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:left}
details.card summary{cursor:pointer;font-weight:700;font-size:16px}
.ic{display:block;width:26px;height:26px;margin:0 auto 3px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.seg.s4 button{font-size:12px;padding:9px 2px}
.stk{display:flex;height:14px;border-radius:8px;overflow:hidden;margin-bottom:8px}.stk i{display:block;height:100%}
.row.sb{padding-left:18px;background:var(--in);border-radius:10px;margin:2px 0;padding-right:10px;border:0}
.calh,.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.calh{color:var(--mu);font-size:11px;text-align:center;margin-bottom:6px}
.cal{aspect-ratio:1;border:1px solid var(--bd);background:var(--in);color:var(--mu);border-radius:10px;font-size:13px;cursor:pointer;padding:0}
.cal.on{background:var(--gr);color:#04121a;border-color:var(--gr);font-weight:700}.cal.now{outline:2px solid var(--ac)}.cal.sel{outline:2px solid var(--tx)}
.lt{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#04121a;flex:none}

.t3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.t3 .tile{padding:12px 6px}.t3 .tile b{font-size:17px;margin:6px 0}.t3 .tile small{font-size:11px}
.pb{display:inline-block;min-width:32px;text-align:center;border-radius:6px;padding:2px 4px;font-size:12px;font-weight:700;color:#04121a}
.pt{display:grid;grid-template-columns:minmax(0,1fr) 50px 30px 30px 34px 40px;gap:4px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd);font-size:12px}
.pt span:not(:first-child){text-align:center}.pt.ph{color:var(--mu);font-size:11px;font-weight:700}
.pt.tot{border:0;background:var(--in);border-radius:10px;padding:8px 6px;margin-top:8px;font-weight:700}
.str{display:flex;gap:3px;margin-top:10px}
.str i{flex:1;min-width:0;aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-style:normal;background:var(--in);color:var(--mu)}
.str i.ok{background:var(--gr);color:#04121a;font-weight:700}.str i.no{background:rgba(248,113,113,.22);color:var(--rd)}
.pl{border-left:4px solid var(--ac);background:var(--in);border-radius:10px;padding:8px 10px;margin:8px 0}
.tag.rv{color:var(--ac)}
.row .done{text-decoration:line-through;opacity:.5}
.rev-white{background:var(--in);color:var(--tx);border:1px solid var(--bd)}.rev-green{background:rgba(74,222,128,.18);color:var(--gr)}.rev-red{background:rgba(248,113,113,.18);color:var(--rd)}
.monthcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.mday{min-width:0;min-height:72px;border:1px solid var(--bd);border-radius:9px;background:var(--in);padding:4px;font-size:11px;overflow:hidden}.mday .num{font-weight:800;font-size:13px;margin-bottom:4px}.mday.today{outline:2px solid var(--ac)}.mday.selected{border:2px solid var(--tx)}.mday .study{display:block;background:var(--card);border-radius:5px;padding:3px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}.mday.emptyday{opacity:.3}.monthhead{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;color:var(--mu);font-size:11px;margin-bottom:5px}.monthstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.monthstats .tile{padding:10px 4px}.monthstats .tile b{font-size:20px}
.ldsearch{position:relative;margin-bottom:12px}.ldsearch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mu);pointer-events:none}.ldsearch input{padding-left:42px;border-radius:16px}
.fr{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.fc{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid var(--bd);color:var(--mu);border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer;font-family:inherit}.fc i{font-style:normal;background:var(--in);border-radius:99px;padding:1px 8px;font-size:12px}
.fc.on{background:rgba(124,92,255,.22);border-color:rgba(167,139,250,.7);color:var(--tx)}.fc.on i{background:rgba(167,139,250,.35)}.fc.fb{border-radius:14px}
.fs{width:auto;border-radius:14px;padding:9px 12px;font-size:14px;background:none;color:var(--mu)}
.ldc{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--bd);border-radius:20px;margin-bottom:12px;overflow:hidden}.ldc.prog{border-left-color:#a78bfa}.ldc.done{border-left-color:var(--gr)}
.ldh{display:flex;align-items:center;gap:12px;padding-left:14px;cursor:pointer;min-height:78px}.ldh .g{flex:1;min-width:0}
.ldh b{display:block;font-size:17px;text-transform:uppercase;font-weight:800;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ldh small{color:var(--mu);font-size:13px}.ldh .pct{color:var(--mu);font-size:14px;font-weight:600}
.ldh .go{align-self:stretch;width:58px;border:0;border-left:1px solid var(--bd);background:none;color:#a78bfa;font-size:22px;cursor:pointer;margin-left:4px}.ldh .go span{display:inline-block;transition:transform .2s}.ldh .go span.o{transform:rotate(90deg)}
.chev{width:18px;flex:none;color:var(--mu);transition:transform .2s}.chev.o{transform:rotate(180deg)}
.ldb{padding:4px 16px 16px;border-top:1px solid var(--bd)}


.bn{font-size:48px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}.bl{color:#4cc7ff;font-weight:600;margin-top:8px}.bi{width:56px;height:56px;border-radius:16px;border:1px solid var(--bd);background:var(--in);display:flex;align-items:center;justify-content:center;color:#4cc7ff;flex:none}.bi svg{width:28px;height:28px}.bf{border-top:1px solid var(--bd);margin-top:16px;padding-top:12px;color:var(--mu);font-size:13px}
.tq{display:grid;grid-template-columns:minmax(0,1fr) 48px 66px 52px;gap:4px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);font-size:13px}.tq span:not(:first-child){text-align:center}.tq span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tq.th{color:var(--mu);font-size:11px;font-weight:700}.tq.tt{border:0;background:var(--in);border-radius:10px;padding:9px 6px;margin-top:8px;font-weight:700}
#cloud-user{position:fixed;z-index:15;top:8px;right:8px;display:none;align-items:center;gap:8px;padding:7px 10px;background:var(--card);border:1px solid var(--bd);border-radius:999px;color:var(--tx);font-size:11px;max-width:calc(100vw - 16px)}
#cloud-user span{max-width:145px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cloud-status{font-size:10px;color:var(--gr);white-space:nowrap}
#cloud-user button{font-size:10px}
#cloud-user button:disabled{opacity:.5;cursor:wait}
@media(max-width:420px){#cloud-user{gap:4px;padding:6px 6px;flex-wrap:wrap;justify-content:center}#cloud-user span{max-width:90px}#cloud-status{max-width:78px;overflow:hidden;text-overflow:ellipsis}#cloud-user button{padding:5px 7px}}
#cloud-user button{border:0;border-radius:999px;padding:5px 9px;background:var(--in);color:var(--tx);font-weight:700;cursor:pointer}
#cloud-auth{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--tx);display:flex;align-items:center;justify-content:center;padding:20px;font-family:Inter,"Segoe UI",Arial,sans-serif}
#cloud-auth .panel{width:100%;max-width:390px;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:24px}
#cloud-auth h1{font-size:23px;margin:0 0 7px}
#cloud-auth p{color:var(--mu);font-size:14px;line-height:1.5;margin:0 0 18px}
#cloud-auth label{display:block;color:var(--mu);font-size:13px;margin:13px 0 5px}
#cloud-auth input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font-size:16px}
#cloud-auth .primary{width:100%;margin-top:17px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:var(--actx);font-weight:800;font-size:15px;cursor:pointer}
#cloud-auth .switch{width:100%;margin-top:12px;background:none;border:0;color:var(--tx);text-decoration:underline;cursor:pointer;padding:8px}
#cloud-auth .message{min-height:20px;margin-top:12px;color:var(--mu);font-size:13px;line-height:1.4}
#cloud-auth .message.error{color:var(--rd)}
#cloud-auth .message.ok{color:var(--gr)}
#cloud-auth button:disabled{opacity:.55;cursor:wait}

/* Seletor visual de disciplinas no desempenho */
.disc-filter{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.disc-chip{display:inline-flex;align-items:center;gap:7px;max-width:100%;border:1px solid var(--bd);border-radius:13px;padding:10px 12px;background:var(--in);color:var(--tx);font:600 13px inherit;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
.disc-chip:active{transform:scale(.97)}
.disc-chip .mark{width:9px;height:9px;border-radius:50%;flex:none}
.disc-chip.on{font-weight:800;box-shadow:inset 0 0 0 1px currentColor}
.disc-chip.all{border-style:dashed}
.disc-filter-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 8px;color:var(--mu);font-size:12px}
.disc-filter-head button{border:0;background:none;color:var(--ac);font:700 12px inherit;cursor:pointer;padding:5px}
/* Central de aplicativos */
#app.home-shell{max-width:760px;padding:clamp(18px,4vw,34px) 18px 40px}
.home-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:14px 0 28px}
.home-eyebrow{color:var(--mu);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
.home-greeting{font-size:clamp(27px,5vw,38px);font-weight:800;letter-spacing:-.05em;line-height:1.08;margin:0}
.home-welcome{color:var(--mu);font-size:14px;margin-top:9px;line-height:1.5}
.home-clock{flex:none;text-align:right;border:1px solid var(--bd);background:linear-gradient(145deg,var(--card),var(--in));border-radius:18px;padding:12px 15px;min-width:112px;box-shadow:0 8px 24px #00000016}
.home-clock small{display:block;color:var(--mu);font-size:10px;font-weight:700;letter-spacing:.12em;margin-bottom:5px}
.home-clock strong{display:block;font-size:clamp(24px,5vw,32px);font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.home-prompt{font-size:13px;color:var(--mu);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:0 0 12px}
.home-area{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:stretch;gap:0;min-height:160px;border:1px solid var(--bd);border-radius:22px;overflow:hidden;margin:0 0 14px;background:var(--card);box-shadow:0 10px 28px #00000012;transition:transform .18s,border-color .18s}
.home-area:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--area-accent) 55%,var(--bd))}
.home-art{position:relative;min-height:160px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(135deg,var(--area-bg),var(--area-accent-soft));color:var(--area-accent)}
.home-art:before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:var(--area-accent);opacity:.10;right:-48px;top:-60px}
.home-art:after{content:"";position:absolute;width:110px;height:110px;border-radius:28px;border:1px solid var(--area-accent);opacity:.17;transform:rotate(28deg);left:-24px;bottom:-38px}
.home-art .home-symbol{position:relative;z-index:1;font-size:54px;filter:drop-shadow(0 8px 14px #00000018)}
.home-info{padding:20px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:9px}
.home-info h2{font-size:22px;letter-spacing:-.04em;margin:0;font-weight:800}
.home-info p{font-size:13px;color:var(--mu);line-height:1.5;margin:0}
.home-access{margin-top:5px;border:0;border-radius:12px;background:var(--area-accent);color:var(--area-button-text,#07110b);font:700 13px inherit;padding:11px 15px;cursor:pointer;display:inline-flex;align-items:center;gap:10px;transition:filter .15s}
.home-access:hover{filter:brightness(1.08)}
.home-area.study{--area-accent:#8be0a6;--area-bg:#14251b;--area-accent-soft:#254a32;--area-button-text:#092012}
.home-area.nutrition{--area-accent:#9ac8ff;--area-bg:#142033;--area-accent-soft:#294d77;--area-button-text:#08192c}
.home-area.config{--area-accent:#d6b4ff;--area-bg:#241833;--area-accent-soft:#4b2d70;--area-button-text:#1b0c2a}
.home-footer{margin-top:18px;color:var(--mu);font-size:12px;text-align:center}
.home-back{border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:10px;padding:7px 10px;font:600 12px inherit;cursor:pointer;white-space:nowrap}
@media(max-width:520px){.home-head{align-items:flex-start;margin:8px 0 24px}.home-clock{min-width:94px;padding:10px 11px}.home-area{grid-template-columns: minmax(0,.85fr) minmax(0,1.15fr);min-height:142px}.home-art{min-height:142px}.home-art .home-symbol{font-size:42px}.home-info{padding:14px}.home-info h2{font-size:19px}.home-info p{font-size:12px}.home-access{padding:10px 11px;font-size:12px}}
@media(max-width:360px){.home-area{grid-template-columns:1fr}.home-art{min-height:105px}.home-art .home-symbol{font-size:38px}}

/* Configurações: ações da conta ficam organizadas dentro da aba, sem barra superior */
#cloud-user{display:none!important}
.settings-shell{padding-bottom:110px}
.settings-shell .top{margin-bottom:8px}
.settings-intro{color:var(--mu);font-size:13px;margin:0 0 16px}
.settings-card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0}
.settings-card h2{font-size:15px;margin:0 0 7px}
.settings-account{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-bottom:12px;font-size:12px}
.settings-account #cloud-email{color:var(--tx);font-weight:700;max-width:100%;overflow-wrap:anywhere}
.settings-account #cloud-status{color:var(--gr)}
#settings-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
#settings-actions button{min-width:0;width:100%;white-space:normal;text-align:center;padding:12px 9px;border:1px solid var(--bd);border-radius:13px;background:var(--in);color:var(--tx);font-weight:700;font-size:13px;cursor:pointer}
#settings-actions #cloud-logout{border-color:#f87171;color:#f87171}

<script>
const K='estudos-v1',$=s=>document.querySelector(s);
const COL=['#4cc7ff','#4ade80','#fbbf24','#f87171','#a78bfa','#fb923c','#2dd4bf','#f472b6','#94a3b8'];
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
let S={edital:[],entries:[],reviews:[],tasks:[],sched:[],goal:20,goalQ:120,subjectColors:{},exam:{name:'',date:''},rem:[],sim:[],revs:[],pomo:{f:25,b:5,l:15},timer:{mode:'c',subj:'',top:'',run:0,st:0,acc:0,ph:'f',n:0}};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
if(S.subjects){S.edital=S.subjects.map(n=>({id:uid(),name:n,topics:[]}));delete S.subjects}
function subjectKey(n){return String(n||'').trim().toLowerCase().replace('á','a')}
function ensureSubjectColors(){
 if(!S.subjectColors||typeof S.subjectColors!=='object'||Array.isArray(S.subjectColors))S.subjectColors={};
 const names=[...new Set([...(S.edital||[]).map(m=>m&&m.name),...(S.entries||[]).map(e=>e&&e.subj),...(S.sched||[]).map(e=>e&&e.subj),...(S.revs||[]).map(e=>e&&e.subj),...(S.sim||[]).map(e=>e&&e.subj),S.timer&&S.timer.subj].filter(Boolean))];
 const mathName=names.find(n=>subjectKey(n)==='matematica');
 const used=new Set([COL[0]]);
 let changed=false;
 if(mathName&&S.subjectColors[mathName]!==COL[0]){S.subjectColors[mathName]=COL[0];changed=true}
 names.forEach((n,i)=>{
  if(n===mathName)return;
  let color=S.subjectColors[n];
  if(!COL.includes(color)||used.has(color)){
   color=COL.find(c=>!used.has(c))||COL[i%COL.length];
   if(S.subjectColors[n]!==color){S.subjectColors[n]=color;changed=true}
  }
  used.add(color);
 });
 return changed;
}
function subjectColor(n){return S.subjectColors&&S.subjectColors[n]||COL[0]}

S.seeded=1;const save=()=>{try{const key=window.__activeUserId?K+':'+window.__activeUserId:K;localStorage.setItem(key,JSON.stringify(S))}catch(e){};if(window.__cloudSave)window.__cloudSave(S)};
let view='d',mode='m',ref=new Date(),open={},inStudies=false;
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const br=s=>s.split('-').reverse().join('/');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1=n=>(Math.round(n*10)/10).toString().replace('.',',');
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const dd=s=>Math.round((parse(s)-today())/864e5);
const net=e=>Math.max(0,e.h-(e.p||0)/60);
const agg=es=>es.reduce((t,e)=>({h:t.h+net(e),q:t.q+e.q,a:t.a+e.a}),{h:0,q:0,a:0});
const mon=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const tagH=n=>n<0?`<span class="tag late">atrasada ${-n}d</span>`:n===0?'<span class="tag now">hoje</span>':`<span class="tag">em ${n}d</span>`;

function period(){const y=ref.getFullYear(),m=ref.getMonth();
 if(mode==='w'){const d=mon(ref);d.setHours(0,0,0,0);const e=new Date(d);e.setDate(d.getDate()+6);e.setHours(23,59,59,999);return{a:d,b:e,n:7,names:['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'],idx:x=>(x.getDay()+6)%7,title:pad(d.getDate())+'/'+pad(d.getMonth()+1)+' – '+pad(e.getDate())+'/'+pad(e.getMonth()+1)}}
 if(mode==='m')return{a:new Date(y,m,1),b:new Date(y,m+1,0),n:5,names:['Sem 1','Sem 2','Sem 3','Sem 4','Sem 5'],idx:x=>Math.min(4,Math.floor((x.getDate()-1)/7)),title:MES[m]+' '+y};
 return{a:new Date(y,0,1),b:new Date(y,11,31),n:12,names:MES.map(s=>s.slice(0,3)),idx:x=>x.getMonth(),title:String(y)}}
function shift(k){if(mode==='w')ref.setDate(ref.getDate()+7*k);else if(mode==='m'){ref.setDate(1);ref.setMonth(ref.getMonth()+k)}else{ref.setDate(1);ref.setFullYear(ref.getFullYear()+k)}render()}
function setMode(m){mode=m;ref=new Date();render()}

function parkCloudControls(){const box=$('#cloud-user');['cloud-email','cloud-status','cloud-backup','cloud-save-snapshot','cloud-cloud-backup','cloud-restore','cloud-import-button','cloud-retry','cloud-logout','cloud-import-file'].forEach(id=>{const el=document.getElementById(id);if(el&&el.parentElement!==box)box.appendChild(el)})}
function settingsPanel(){return '<div class="top">Configurações <button class="home-back" onclick="backHome()">⌂ Central</button></div><p class="settings-intro">Gerencie sua conta e as cópias dos seus dados. Essas opções ficam aqui para liberar espaço na tela do celular.</p><section class="settings-card"><h2>Conta e sincronização</h2><div class="settings-account"><span id="settings-email-slot"></span><span id="settings-status-slot"></span></div><div id="settings-actions"></div></section>'}
function go(v){if(v!=='settings')parkCloudControls();view=v;scrollTo(0,0);render()}


function grid(W,H,L,T,Bt,mx,fmt){let s='';for(let i=0;i<=3;i++){const y=T+(H-Bt-T)*i/3;s+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--bd)" stroke-dasharray="3 4"/><text x="${L-6}" y="${y+4}" text-anchor="end" fill="var(--mu)" font-size="10">${fmt(mx*(1-i/3))}</text>`}return s}
function bars(B,P){const W=340,H=190,L=30,Bt=24,T=10,mx=Math.max(1,...B.map(b=>b.q)),cw=(W-L)/P.n,bw=Math.min(14,cw/2.6),ch=H-Bt-T;let s=grid(W,H,L,T,Bt,mx,v=>Math.round(v));
 B.forEach((b,i)=>{const cx=L+cw*i+cw/2,ha=ch*b.a/mx,he=ch*(b.q-b.a)/mx;s+=`<rect x="${cx-bw-1}" y="${H-Bt-ha}" width="${bw}" height="${ha}" rx="4" fill="var(--gr)"/><rect x="${cx+1}" y="${H-Bt-he}" width="${bw}" height="${he}" rx="4" fill="var(--rd)"/><text x="${cx}" y="${H-7}" text-anchor="middle" fill="var(--mu)" font-size="10">${P.names[i]}</text>`});
 return`<svg viewBox="0 0 ${W} ${H}">${s}</svg>`}
function combo(B,P){const W=340,H=200,L=32,R=34,Bt=24,T=10,ch=H-Bt-T,mx=Math.max(1,...B.map(b=>b.q)),cw=(W-L-R)/P.n,bw=Math.min(22,cw*.6);let s='';
 for(let i=0;i<=3;i++){const y=T+ch*i/3;s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--bd)" stroke-dasharray="3 4"/><text x="${L-5}" y="${y+4}" text-anchor="end" fill="var(--mu)" font-size="10">${Math.round(mx*(1-i/3))}</text><text x="${W-R+5}" y="${y+4}" fill="var(--mu)" font-size="10">${Math.round(100*(1-i/3))}%</text>`}
 const pts=[];
 B.forEach((b,i)=>{const cx=L+cw*i+cw/2,h=ch*b.q/mx;s+=`<rect x="${cx-bw/2}" y="${H-Bt-h}" width="${bw}" height="${h}" rx="4" fill="var(--gr)"/><text x="${cx}" y="${H-7}" text-anchor="middle" fill="var(--mu)" font-size="10">${P.names[i]}</text>`;if(b.q)pts.push([cx,T+ch*(1-b.a/b.q)])});
 if(pts.length>1){let d='M'+pts[0].join(' ');for(let i=1;i<pts.length;i++){const[a,b]=pts[i-1],[x,y]=pts[i],m=(a+x)/2;d+=` C${m} ${b},${m} ${y},${x} ${y}`}s+=`<path d="${d}" fill="none" stroke="#a78bfa" stroke-width="2.5"/>`}
 pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#a78bfa"/>`);
 return`<svg viewBox="0 0 ${W} ${H}">${s}</svg>`}
function line(B,P){const W=340,H=180,L=30,Bt=24,T=10,w=W-L-10;let c=0;const cum=B.map(b=>c+=b.h),mx=Math.max(1,c),pts=cum.map((v,i)=>[L+w*i/(P.n-1),T+(H-Bt-T)*(1-v/mx)]);
 let d='M'+pts[0].join(' ');for(let i=1;i<pts.length;i++){const[a,b]=pts[i-1],[x,y]=pts[i],m=(a+x)/2;d+=` C${m} ${b},${m} ${y},${x} ${y}`}
 let s=grid(W,H,L,T,Bt,mx,f1)+`<path d="${d}" fill="none" stroke="var(--tx)" stroke-width="2.5" opacity=".85"/>`;
 pts.forEach((p,i)=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="var(--tx)"/><text x="${p[0]}" y="${H-7}" text-anchor="middle" fill="var(--mu)" font-size="10">${P.names[i]}</text>`);
 return`<svg viewBox="0 0 ${W} ${H}">${s}</svg>`}
function donut(es){const m={};es.forEach(e=>m[e.subj]=(m[e.subj]||0)+e.q);const L=Object.entries(m).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),t=L.reduce((s,x)=>s+x[1],0);
 if(!t)return'<div class="empty">Sem questões registradas</div>';const C=2*Math.PI*48;let off=0,s='';
 L.forEach((x,i)=>{const l=C*x[1]/t;s+=`<circle cx="70" cy="70" r="48" fill="none" stroke="${subjectColor(x[0])}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=l});
 return`<div class="donut"><svg viewBox="0 0 140 140">${s}</svg><div class="lg">${L.map((x,i)=>`<div><span><span class="dot" style="background:${subjectColor(x[0])}"></span>${esc(x[0])}</span><b>${x[1]}</b></div>`).join('')}</div></div>`}
function ring(v,g){const C=2*Math.PI*52,p=Math.min(1,v/g);
 return`<div class="donut"><svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="52" fill="none" stroke="var(--in)" stroke-width="16"/><circle cx="70" cy="70" r="52" fill="none" stroke="var(--gr)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 70 70)"/><text x="70" y="76" text-anchor="middle" fill="var(--tx)" font-size="22" font-weight="700">${Math.round(p*100)}%</text></svg><div class="lg"><b>${f1(v)}h de ${f1(g)}h</b> líquidas na semana<label>Meta semanal (h)</label><input type="number" value="${g}" min="1" onchange="S.goal=+this.value||20;save();render()"></div></div>`}
function radar(es){const m={};es.forEach(e=>{const o=m[e.subj]||(m[e.subj]={q:0,a:0});o.q+=e.q;o.a+=e.a});
 const L=Object.entries(m).filter(x=>x[1].q>0).slice(0,8);if(L.length<3)return'<div class="empty">Registre questões em 3 matérias ou mais</div>';
 const cx=150,cy=125,R=85,n=L.length,pt=(i,r)=>[cx+r*Math.sin(2*Math.PI*i/n),cy-r*Math.cos(2*Math.PI*i/n)];
 let s=[.33,.66,1].map(k=>`<polygon points="${L.map((_,i)=>pt(i,R*k).join(',')).join(' ')}" fill="none" stroke="var(--bd)"/>`).join('');
 s+=L.map((x,i)=>{const[a,b]=pt(i,R+16);return`<text x="${a}" y="${b+3}" text-anchor="middle" fill="var(--mu)" font-size="9">${esc(x[0].slice(0,11))}</text>`}).join('');
 s+=`<polygon points="${L.map((x,i)=>pt(i,R*x[1].a/x[1].q).join(',')).join(' ')}" fill="var(--ac)" fill-opacity=".25" stroke="var(--ac)" stroke-width="2"/>`;
 return`<svg viewBox="0 0 300 250">${s}</svg>`}
function heat(){const t=today(),s=mon(t);s.setDate(s.getDate()-77);const m={};S.entries.forEach(e=>m[e.date]=(m[e.date]||0)+net(e));let o='';
 for(let w=0;w<12;w++)for(let d=0;d<7;d++){const x=new Date(s);x.setDate(s.getDate()+w*7+d);if(x>t)continue;const h=m[iso(x)]||0;o+=`<rect x="${w*24}" y="${d*24}" width="20" height="20" rx="5" fill="${h?'var(--ac)':'var(--in)'}" opacity="${h?Math.min(1,.3+h/5):1}"/>`}
 return`<svg viewBox="0 0 284 164">${o}</svg><div class="leg">Últimas 12 semanas · mais forte = mais horas</div>`}
function perf(es){const m={};es.forEach(e=>{const o=m[e.subj]||(m[e.subj]={h:0,q:0,a:0});o.h+=net(e);o.q+=e.q;o.a+=e.a});
 const L=Object.entries(m).sort((a,b)=>b[1].q-a[1].q);if(!L.length)return'<div class="empty">Registre um estudo no Cronômetro</div>';
 return L.map(([n,o])=>{const p=o.q?Math.round(o.a/o.q*100):0;return`<div class="row"><div class="g"><b>${esc(n)}</b><small>${o.a}/${o.q} questões · ${f1(o.h)}h</small><div class="bar"><i style="width:${p}%"></i></div></div><b>${p}%</b></div>`}).join('')}

const DN=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'],DF=['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado','Domingo'];

let pend={};
const fmtM=m=>m<60?m+'min':f1(m/60)+'h';
const opts=(l,sel)=>l.map(x=>`<option${x===sel?' selected':''}>${esc(x)}</option>`).join('');
function selS(id,fn,sel){return`<select id="${id}" onchange="${fn}">${opts(S.edital.map(m=>m.name),sel)}</select>`}
function fillTop(sid,tid,sel){const m=S.edital.find(x=>x.name===$('#'+sid).value),t=$('#'+tid);t.innerHTML='<option value="">Sem conteúdo específico</option>'+(m?opts(m.topics,sel):'')}
function byS(es){const m={};es.forEach(e=>m[e.subj]=(m[e.subj]||0)+net(e));return Object.entries(m).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1])}
function breakdown(es){const m={};es.forEach(e=>{const k=e.top||'Geral';m[k]=(m[k]||0)+net(e)});const L=Object.entries(m).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),t=L.reduce((s,x)=>s+x[1],0);
 return L.map(([k,h])=>{const p=t?Math.round(h/t*100):0;return`<div class="row"><div class="g"><b>${esc(k)}</b><small>${f1(h)}h · ${p}% da matéria</small><div class="bar"><i style="width:${p}%"></i></div></div></div>`}).join('')||'<div class="empty">Sem horas registradas</div>'}
function addEntry(h,q,a){const T=S.timer;S.entries.push({id:uid(),date:iso(new Date()),subj:T.subj,top:T.top,h,p:0,q:q||0,a:a||0});mkRev(T.subj,T.top,iso(new Date()))}

/* ---------- PLANO DE ESTUDOS / LDI CONFIGURÁVEL ---------- */
function topicDone(m,t){return (m.doneTopics||[]).includes(t)}
function subjectDone(m){return m.topics.length>0&&m.topics.every(t=>topicDone(m,t))}
function toggleTopic(id,encoded){const t=decodeURIComponent(encoded),m=S.edital.find(x=>x.id===id);if(!m)return;m.doneTopics=m.doneTopics||[];const i=m.doneTopics.indexOf(t);if(i>=0)m.doneTopics.splice(i,1);else m.doneTopics.push(t);save();render()}
let ldi={q:'',st:'all',df:'all'};
const DIFFS=['Fácil','Média','Difícil'],ST_TX={done:'Pronta',prog:'Em andamento',new:'Não iniciada'};
function mStat(m){const n=m.topics.length,d=(m.doneTopics||[]).filter(t=>m.topics.includes(t)).length;return{n,d,pc:n?Math.round(d/n*100):0,st:n&&d===n?'done':d>0?'prog':'new'}}
function ldiFiltered(){const q=ldi.q.trim().toLowerCase();return S.edital.filter(m=>{const s=mStat(m);if(ldi.st!=='all'&&s.st!==ldi.st)return false;if(ldi.df!=='all'&&(m.diff||'')!==ldi.df)return false;if(q&&!m.name.toLowerCase().includes(q)&&!m.topics.some(t=>t.toLowerCase().includes(q)))return false;return true})}
function ldiCard(m){const s=mStat(m),o=open[m.id],dy=m.days||[],es=S.entries.filter(e=>e.subj===m.name);
 const head=`<div class="ldh" onclick="tgO('${m.id}')"><span class="chev ${o?'o':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span><div class="g"><b><i class="dot" style="background:${subjectColor(m.name)}"></i>${esc(m.name)}</b><small>${s.d}/${s.n} tópicos · ${ST_TX[s.st]}${m.diff?' · '+m.diff:''}</small></div><span class="pct">${s.pc}%</span><button class="go" onclick="event.stopPropagation();tgO('${m.id}')"><span class="${o?'o':''}">↗</span></button></div>`;
 if(!o)return `<div class="ldc ${s.st}">${head}</div>`;
 const body=`<div class="ldb"><label>Dificuldade</label><div class="chips">${DIFFS.map(d=>`<button class="chip ${m.diff===d?'on':''}" onclick="tgDiff('${m.id}','${d}')">${d}</button>`).join('')}</div>
 <label>Dias da semana</label><div class="chips">${DN.map((n,i)=>`<button class="chip ${dy.includes(i)?'on':''}" onclick="tgD('${m.id}',${i})">${n}</button>`).join('')}</div>
 <label>Meta semanal (horas)</label><input type="number" min="0" step="0.5" value="${m.goal||''}" placeholder="Defina sua meta" onchange="setGoal('${m.id}',this.value)">
 <label>Conteúdos — marque quando concluir</label>`+
 (m.topics.length?m.topics.map((t,i)=>{const A=agg(es.filter(e=>e.top===t)),ok=topicDone(m,t);return `<div class="row"><button class="ck" style="${ok?'background:var(--gr);border-color:var(--gr);color:#04121a':''}" onclick="toggleTopic('${m.id}','${encodeURIComponent(t).replace(/'/g,'%27')}')">${ok?'✓':''}</button><div class="g"><b class="${ok?'done':''}">${esc(t)}</b>${A.h>0?`<small>${f1(A.h)}h estudadas</small>`:''}</div><button class="x" onclick="delT('${m.id}',${i})">×</button></div>`}).join(''):'<div class="empty" style="padding:12px 0">Nenhum conteúdo ainda</div>')+
 `<div class="add" style="margin-top:10px"><input id="t_${m.id}" placeholder="Novo conteúdo (use ; para vários)" onkeydown="if(event.key==='Enter')addT('${m.id}')"><button class="btn" onclick="addT('${m.id}')">Add</button></div>
 <div style="margin-top:14px;text-align:right">${pend[m.id]? `<button class="btn" style="background:var(--rd);color:#fff;padding:8px 12px" onclick="delM('${m.id}')">Confirmar exclusão</button> <button class="x" onclick="pend={};render()">Cancelar</button>`:`<button class="x" style="font-size:14px" onclick="pend={'${m.id}':1};render()">Apagar disciplina</button>`}</div></div>`;
 return `<div class="ldc ${s.st}">${head}${body}</div>`}
function ldiList(){const L=ldiFiltered();return L.length?L.map(ldiCard).join(''):`<div class="empty">${S.edital.length?'Nenhuma disciplina encontrada':'Adicione sua primeira disciplina abaixo'}</div>`}
function ldiRefresh(){const el=$('#ldiList');if(el)el.innerHTML=ldiList()}
function tgO(id){open[id]=!open[id];render()}
function ldiAll(){const L=ldiFiltered(),a=L.length&&L.every(m=>open[m.id]);L.forEach(m=>open[m.id]=!a);render()}
function tgDiff(id,d){const m=S.edital.find(x=>x.id===id);if(!m)return;m.diff=m.diff===d?'':d;save();render()}
function vP(){const C={all:S.edital.length,prog:0,done:0,new:0};S.edital.forEach(m=>C[mStat(m).st]++);
 const L=ldiFiltered(),a=L.length&&L.every(m=>open[m.id]);
 return `<div class="top">LDI</div><div class="sub">Edital e conteúdo programático</div>
 <div class="ldsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="ldq" placeholder="Buscar matéria ou tópico..." value="${esc(ldi.q)}" oninput="ldi.q=this.value;ldiRefresh()"></div>
 <div class="fr">${[['all','Todas'],['prog','Em andamento'],['done','Prontas'],['new','Não iniciadas']].map(([k,n])=>`<button class="fc ${ldi.st===k?'on':''}" onclick="ldi.st='${k}';render()">${n}<i>${C[k]}</i></button>`).join('')}</div>
 <div class="fr"><select class="fs" onchange="ldi.df=this.value;render()"><option value="all">Toda dificuldade</option>${DIFFS.map(d=>`<option value="${d}"${ldi.df===d?' selected':''}>${d}</option>`).join('')}</select><button class="fc fb" onclick="ldiAll()">${a?'Recolher tudo':'Expandir tudo'}</button></div>
 <div id="ldiList" style="margin-top:14px">${ldiList()}</div>
 <div class="card"><h2>Nova disciplina</h2><div class="add"><input id="nm" placeholder="Digite uma disciplina" onkeydown="if(event.key==='Enter')addM()"><button class="btn" onclick="addM()">Add</button></div></div>`}
function addM(){const v=$('#nm').value.trim();if(v&&!S.edital.some(m=>m.name.toLowerCase()===v.toLowerCase())){const id=uid();S.edital.push({id,name:v,topics:[],days:[]});open[id]=true;save();render()}}
function addT(id){const m=S.edital.find(x=>x.id===id),input=$('#t_'+id);if(!m||!input)return;const L=input.value.split(/[;\n]/).map(x=>x.trim()).filter(Boolean);let c=0;L.forEach(v=>{if(!m.topics.includes(v)){m.topics.push(v);c++}});if(c){save();render()}}
function delM(id){S.edital=S.edital.filter(x=>x.id!==id);S.sched=S.sched.filter(x=>S.edital.some(m=>m.name===x.subj));pend={};save();render()}
function delT(id,i){const m=S.edital.find(x=>x.id===id);if(!m)return;const t=m.topics.splice(i,1)[0];m.doneTopics=(m.doneTopics||[]).filter(x=>x!==t);save();render()}
function tgD(id,i){const m=S.edital.find(x=>x.id===id);if(!m)return;const d=m.days||(m.days=[]),k=d.indexOf(i);k<0?d.push(i):d.splice(k,1);d.sort();save();render()}
function setGoal(id,v){const m=S.edital.find(x=>x.id===id);if(!m)return;m.goal=Math.max(0,parseFloat(String(v).replace(',','.'))||0);save();render()}

/* ---------- CRONOGRAMA SEMANAL ---------- */
let wo=0,sheet=null,dur=60;
function wkDays(){const s=mon(today());s.setDate(s.getDate()+7*wo);return Array.from({length:7},(_,i)=>{const d=new Date(s);d.setDate(s.getDate()+i);return d})}
function vS(){const D=wkDays(),t=iso(today());
 return`<div class="top"><button onclick="wo--;render()">‹</button>Agenda<button onclick="wo++;render()">›</button></div><div class="sub">Organize as matérias e a sua semana</div>`+
 D.map((d,i)=>{const k=iso(d),L=S.sched.filter(x=>x.date===k),tot=L.reduce((s,x)=>s+x.min,0);
 return`<div class="card day ${k===t?'today':''}"><div class="dh"><b>${DN[i]}</b><span>${pad(d.getDate())}/${pad(d.getMonth()+1)}</span><small>${tot?fmtM(tot):''}</small></div>`+
 L.map(x=>`<div class="row" style="${x.done?'opacity:.45':''}"><button class="ck" onclick="tgS('${x.id}')">${x.done?'✓':''}</button><div class="g"><b>${esc(x.subj)}</b><small>${x.top?esc(x.top)+' · ':''}${fmtM(x.min)}</small></div><button class="x" onclick="delS('${x.id}')">×</button></div>`).join('')+
 `<button class="addb" onclick="openSh('${k}')">+ Adicionar</button></div>`}).join('')+
 `<button class="btn" style="width:100%" onclick="autoFill()">Preencher semana com meu plano</button>`+
 (sheet?`<div class="ov" onclick="if(event.target===this){sheet=null;render()}"><div class="sheet"><h2>Nova Tarefa — ${DF[(parse(sheet).getDay()+6)%7]}</h2><small style="color:var(--mu)">Adicione uma tarefa de estudo ao seu cronograma</small>
 <label>Matéria</label>${selS('ss',"fillTop('ss','st')")}<label>Conteúdo</label><select id="st"></select><label>Duração estimada</label>
 <div class="chips">${[15,30,45,60,90,120,180].map(n=>`<button class="chip ${n===dur?'on':''}" onclick="pickD(${n},this)">${fmtM(n)}</button>`).join('')}</div>
 <div class="two" style="margin-top:16px"><button class="cs2" onclick="sheet=null;render()">Cancelar</button><button class="btn" onclick="addS()">Adicionar Tarefa</button></div></div></div>`:'')}
function openSh(k){sheet=k;render()}
function pickD(n,b){dur=n;b.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));b.classList.add('on')}
function addS(){if(!S.edital.length)return;S.sched.push({id:uid(),date:sheet,subj:$('#ss').value,top:$('#st').value,min:dur,done:0});sheet=null;save();render()}
function tgS(id){const r=S.sched.find(x=>x.id===id);r.done=r.done?0:1;save();render()}
function delS(id){S.sched=S.sched.filter(x=>x.id!==id);save();render()}
function autoFill(){wkDays().forEach((d,i)=>{const k=iso(d);S.edital.forEach(m=>{if((m.days||[]).includes(i)&&!S.sched.some(x=>x.date===k&&x.subj===m.name)){const mn=m.goal?Math.max(15,Math.round(m.goal*60/m.days.length/15)*15):60;S.sched.push({id:uid(),date:k,subj:m.name,top:'',min:mn,done:0})}})});save();render()}

/* ---------- CRONÔMETRO ---------- */
let fin=null;
const PH={f:'Foco',b:'Pausa curta',l:'Pausa longa'};
const el=()=>S.timer.acc+(S.timer.run?Date.now()-S.timer.st:0);
const plen=()=>S.pomo[S.timer.ph]*6e4;
const clk=ms=>{ms=Math.max(0,Math.floor(ms));const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);return pad(h)+':'+pad(m)+':'+pad(s)};
const shown=()=>S.timer.mode==='p'?clk(Math.max(0,plen()-el())):clk(el());
function tick(){const T=S.timer,c=$('#clk'),ht=$('#home-time');if(ht)ht.textContent=homeClock();if(T.run&&T.mode==='p'&&el()>=plen()){endPhase();return}if(c)c.textContent=shown()}
function endPhase(){const T=S.timer;if(T.ph==='f'){addEntry(plen()/36e5);T.n++;T.ph=T.n%4===0?'l':'b'}else T.ph='f';T.acc=0;T.run=0;save();try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}render()}
function tgT(){const T=S.timer;if(T.run){T.acc+=Date.now()-T.st;T.run=0}else{T.st=Date.now();T.run=1}save();render()}
function tmode(m){const T=S.timer;if(T.run)return;T.mode=m;T.acc=0;T.ph='f';save();render()}
function resetT(){const T=S.timer;T.acc=0;T.run=0;fin=null;save();render()}
function finish(){const T=S.timer;if(T.run){T.acc+=Date.now()-T.st;T.run=0}save();if(T.mode==='p'&&T.ph!=='f'||T.acc<6e4)return resetT();fin=T.acc;render()}
function saveFin(){const q=Math.max(0,Math.floor(+$('#fq').value||0)),a=Math.min(q,Math.max(0,Math.floor(+$('#fa').value||0)));addEntry(fin/36e5,q,a);resetT()}
function vC(){const T=S.timer,es=S.entries.filter(e=>e.subj===T.subj),tot=agg(es).h,hoje=agg(es.filter(e=>e.date===iso(new Date()))).h;
 return`<div class="top">Foco</div><div class="seg"><button class="${T.mode==='c'?'on':''}" onclick="tmode('c')">Cronômetro</button><button class="${T.mode==='p'?'on':''}" onclick="tmode('p')">Pomodoro</button></div>
 <div class="card" style="text-align:center"><div class="two" style="text-align:left"><div><label>Matéria</label>${selS('ts',"S.timer.subj=this.value;S.timer.top='';save();fillTop('ts','tt2')",T.subj).replace('<select','<select '+(T.run?'disabled':''))}</div><div><label>Conteúdo</label><select id="tt2" ${T.run?'disabled':''} onchange="S.timer.top=this.value;save()"></select></div></div>
 ${T.mode==='p'?`<div style="margin-top:16px"><span class="tag ${T.ph==='f'?'now':''}">${PH[T.ph]} · ciclo ${T.n%4+1}/4</span></div>`:''}
 <div class="clock" id="clk">${shown()}</div>
 ${fin!==null?`<div style="text-align:left"><b>Sessão: ${f1(fin/36e5)}h</b><div class="two"><div><label>Questões feitas</label><input id="fq" type="number" min="0" inputmode="numeric"></div><div><label>Acertos</label><input id="fa" type="number" min="0" inputmode="numeric"></div></div><div class="two" style="margin-top:14px"><button class="cs2" onclick="resetT()">Descartar</button><button class="btn" onclick="saveFin()">Salvar sessão</button></div></div>`:
 `<div class="two"><button class="btn" onclick="tgT()">${T.run?'Pausar':el()?'Continuar':'Iniciar'}</button><button class="cs2" onclick="${T.mode==='p'&&!el()?'S.timer.ph=\'f\';save();render()':'finish()'}">${el()||T.run?'Finalizar':'Reiniciar'}</button></div>`}
 ${T.mode==='p'&&!T.run&&!el()?`<div class="two3"><div><label>Foco (min)</label><input type="number" min="1" value="${S.pomo.f}" onchange="S.pomo.f=+this.value||25;save();render()"></div><div><label>Pausa</label><input type="number" min="1" value="${S.pomo.b}" onchange="S.pomo.b=+this.value||5;save();render()"></div><div><label>Longa</label><input type="number" min="1" value="${S.pomo.l}" onchange="S.pomo.l=+this.value||15;save();render()"></div></div>`:''}</div>
 <div class="card"><h2><i class="dot" style="background:${subjectColor(T.subj)}"></i>Tempo em ${esc(T.subj||'—')}</h2><div class="tiles"><div class="tile"><small>Hoje</small><b>${f1(hoje)}h</b></div><div class="tile"><small>Total</small><b>${f1(tot)}h</b></div></div>${breakdown(es)}</div>`}
function saveE(){const v=i=>$('#'+i).value,n=i=>Math.max(0,parseFloat(v(i).replace(',','.'))||0),er=m=>$('#err').textContent=m;
 const h=n('h'),q=Math.floor(n('q')),a=Math.floor(n('a')),p=n('p');
 if(!S.edital.length)return er('Cadastre uma disciplina no Plano de Estudos.');if(!v('d'))return er('Escolha a data.');
 if(a>q)return er('Acertos não podem passar de questões feitas.');if(!h&&!q)return er('Informe horas ou questões.');
 S.entries.push({id:uid(),date:v('d'),subj:v('s'),top:v('tp'),h,p,q,a});mkRev(v('s'),v('tp'),v('d'));save();render()}

const sumP=(a,b)=>agg(S.entries.filter(e=>{const d=parse(e.date);return d>=a&&d<=b}));
/* ---------- VISÃO GERAL ---------- */
let editEx=0;
const fHM=h=>{const m=Math.round(h*60);return Math.floor(m/60)+'h'+pad(m%60)+'min'};
const fHs=h=>{const m=Math.round(h*60);return Math.floor(m/60)+'h'+pad(m%60)};
const pc=p=>p>=80?'var(--gr)':p>=60?'#fbbf24':'var(--rd)';
const pb=(a,q)=>q?`<span class="pb" style="background:${pc(Math.round(a/q*100))}">${Math.round(a/q*100)}</span>`:'<span class="pb" style="background:var(--in);color:var(--mu)">–</span>';
const RI=[1,7,15,30],TG=['Inscrições','Provas','Pagamentos','Outros'];
const sCol=n=>subjectColor(n);
function mkRev(subj,top,date){if(!top||S.revs.some(r=>r.subj===subj&&r.top===top))return;const d=parse(date);d.setDate(d.getDate()+RI[0]);S.revs.push({id:uid(),subj,top,due:iso(d),step:0,interval:1})}
function addReview(){const subj=$('#rsub').value,top=$('#rtop').value||'',days=+$('#rint').value;if(!subj)return;const d=today();d.setDate(d.getDate()+days);S.revs.push({id:uid(),subj,top,due:iso(d),step:RI.indexOf(days),interval:days,manual:1});save();render()}
function doRev(id){const r=S.revs.find(x=>x.id===id);if(!r)return;const days=+(r.interval||RI[r.step]||1),d=today();d.setDate(d.getDate()+days);r.due=iso(d);save();render()}
function revBadge(due){const n=dd(due),c=n<=1?'rev-red':n<=7?'rev-green':'rev-white';return`<span class="tag ${c}">${n<0?'atrasada '+(-n)+'d':n===0?'hoje':n===1?'amanhã':'em '+n+' dias'}</span>`}
function delRev(id){S.revs=S.revs.filter(x=>x.id!==id);save();render()}
function setEx(){const n=$('#en').value.trim(),d=$('#ed').value;if(!d)return;S.exam={name:n||'Prova',date:d};editEx=0;save();render()}
function addR(){const t=$('#rtx').value.trim();if(!t)return;S.rem.push({id:uid(),text:t,tag:$('#rtg').value,date:$('#rdt').value,done:0});save();render()}
function tgR(id){const r=S.rem.find(x=>x.id===id);r.done=r.done?0:1;save();render()}
function delR(id){S.rem=S.rem.filter(x=>x.id!==id);save();render()}
function saveSim(){const n=i=>Math.max(0,parseFloat($('#'+i).value.replace(',','.'))||0),er=m=>$('#err2').textContent=m,h=n('sh'),q=Math.floor(n('sq')),a=Math.floor(n('sa'));
 if(!$('#sd').value)return er('Escolha a data.');if(a>q)return er('Acertos não podem passar de questões feitas.');if(!h&&!q)return er('Informe horas ou questões.');
 S.sim.push({id:uid(),date:$('#sd').value,h,p:0,q,a});save();render()}
function delSim(id){S.sim=S.sim.filter(x=>x.id!==id);save();render()}
function studied(){const s=new Set();S.entries.forEach(e=>{if(net(e)>0||e.q>0)s.add(e.date)});S.sim.forEach(e=>s.add(e.date));return s}
function streak(){const st=studied(),L=[...st].sort();let rec=0,run=0,prev=null;
 L.forEach(k=>{const d=parse(k);run=prev&&Math.round((d-prev)/864e5)===1?run+1:1;prev=d;if(run>rec)rec=run});
 let c=0,d=today();if(!st.has(iso(d)))d.setDate(d.getDate()-1);while(st.has(iso(d))){c++;d.setDate(d.getDate()-1)}
 return{c,rec:Math.max(rec,c),st}}
function strip(st){const t=today(),first=[...st].sort()[0]||'9999',o=[];
 for(let i=20;i>=0;i--){const d=new Date(t);d.setDate(t.getDate()-i);const k=iso(d);o.push(st.has(k)?'<i class="ok">✓</i>':(k===iso(t)||k<first)?'<i>•</i>':'<i class="no">✕</i>')}
 return`<div class="str">${o.join('')}</div>`}
function exCard(){const E=S.exam;
 if(!E.date||editEx)return`<div class="card"><h2>Minha prova</h2><label>Nome da prova</label><input id="en" value="${esc(E.name||'')}" placeholder="ex.: Polícia Federal"><label>Data da prova</label><input type="date" id="ed" value="${E.date||''}"><div class="two" style="margin-top:14px">${E.date?'<button class="cs2" onclick="editEx=0;render()">Cancelar</button>':'<span></span>'}<button class="btn" onclick="setEx()">Salvar prova</button></div></div>`;
 const n=dd(E.date);
 return`<div class="card"><div class="row" style="border:0;padding:0"><div class="g"><small>PROVA</small><b style="font-size:18px">${esc(E.name)}</b><small>${br(E.date)}</small></div><div style="text-align:center"><small>${n<0?'Prova realizada':n===0?'É hoje!':'Faltam'}</small><div class="big">${n<0?'—':n}</div><small>${n>0?(n===1?'dia para a prova':'dias para a prova'):''}</small></div><button class="x" onclick="editEx=1;render()">✎</button></div></div>`}
const mb=(l,v,g,c)=>{const p=g?Math.min(100,Math.round(v/g*100)):0;return`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${l}</span><b>${p}%</b></div><div class="bar" style="height:12px"><i style="width:${p}%;background:${c}"></i></div></div>`};
function pr(n,h,a,q,c){return`<div class="pt"><span><i class="dot" style="background:${c}"></i>${esc(n)}</span><span>${h?fHs(h):'–'}</span><span style="color:var(--gr)">${a}</span><span style="color:var(--rd)">${q-a}</span><span>${q}</span><span>${pb(a,q)}</span></div>`}
function painel(){const rows=S.edital.map((m,i)=>{const A=agg(S.entries.filter(e=>e.subj===m.name));return pr(m.name,A.h,A.a,A.q,subjectColor(m.name))}).join(''),

 const W=340,H=310,Lm=34,Rm=10,Tm=10,Bm=34,ym=Math.max(100,Math.ceil(Math.max(...L.map(x=>x[1].q))/10)*10),X=p=>Lm+(W-Lm-Rm)*p/100,Y=q=>Tm+(H-Tm-Bm)*(1-q/ym);

 [[.25,Tm+14,'Q2 · muitas questões,','desempenho baixo'],[.75,Tm+14,'Q3 · muitas questões,','desempenho promissor'],[.25,H-Bm-20,'Q1 · poucas questões,','desempenho baixo'],[.75,H-Bm-20,'Q4 · poucas questões,','desempenho bom']].forEach(z=>s+=`<text text-anchor="middle" fill="var(--mu)" opacity=".7" font-size="8.5"><tspan x="${X(z[0]*100)}" y="${z[1]}">${z[2]}</tspan><tspan x="${X(z[0]*100)}" dy="11">${z[3]}</tspan></text>`);
 L.forEach(([n,o],i)=>{const r=Math.max(11,Math.min(28,9+Math.sqrt(o.h)*5)),cx=Math.min(W-Rm-r,Math.max(Lm+r,X(o.a/o.q*100))),cy=Math.min(H-Bm-r,Math.max(Tm+r,Y(o.q)));s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${subjectColor(n)}" fill-opacity=".85" stroke="var(--bg)" stroke-width="2"/><text x="${cx}" y="${cy+4}" text-anchor="middle" fill="#04121a" font-size="12" font-weight="700">${String.fromCharCode(65+i)}</text>`});

let queuedState=null,saving=false;
async function flushCloudSave(){
 if(!ready||!activeUid||saving||!queuedState)return;
 saving=true;const owner=activeUid;
 while(queuedState&&ready&&activeUid===owner){
  const snapshot=queuedState;queuedState=null;
  try{
   const {error}=await client.from('estudos').upsert({id:owner,dados:snapshot,atualizado_em:new Date().toISOString()},{onConflict:'id'});
   if(error)throw error;
   try{localStorage.removeItem(K+':pending:'+owner)}catch(e){}
   if(ready&&activeUid===owner)setCloudStatus(queuedState?'Salvando...':'Sincronizado');
  }catch(e){
   if(ready&&activeUid===owner){
    if(!queuedState)queuedState=snapshot;
    try{localStorage.setItem(K+':pending:'+owner,JSON.stringify({state:queuedState,updatedAt:new Date().toISOString()}))}catch(storageError){console.error('Não foi possível guardar a cópia pendente local:',storageError)}
    setCloudStatus('Falha ao sincronizar',true);console.error('Falha ao sincronizar estudos:',e)
   }
   break;
  }
 }
 saving=false;
 if(queuedState&&ready){
  clearTimeout(saveTimer);saveTimer=setTimeout(flushCloudSave,300);
 }
}
window.__cloudSave=function(state){
 if(!ready||!activeUid)return;
 try{localStorage.setItem(K+':'+activeUid,JSON.stringify(state))}catch(e){setCloudStatus('Armazenamento local cheio',true)}
 queuedState=JSON.parse(JSON.stringify(state));
 setCloudStatus('Salvando...');
 clearTimeout(saveTimer);saveTimer=setTimeout(flushCloudSave,800);
};
document.getElementById('cloud-retry').addEventListener('click',()=>{
 if(!queuedState)return;
 setCloudStatus('Tentando sincronizar...');
 clearTimeout(saveTimer);saveTimer=setTimeout(flushCloudSave,50);
});
init();
})();
