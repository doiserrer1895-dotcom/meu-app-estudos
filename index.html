/* === Layout integrado: painel pessoal e identidade visual === */
.welcomePanel{display:block;background:#fff;color:#111;border:1px solid #dedede;border-radius:14px;padding:9px;margin:0 0 13px;box-shadow:0 3px 12px #00000012}
.welcomeGreeting{background:#111;color:#fff;border-radius:10px;padding:11px}
.welcomeGreeting h2{font-size:15px;line-height:1.25;letter-spacing:-.035em;margin:0;color:#fff}
.welcomeNameLine{display:flex;align-items:center;gap:6px}
.welcomeEdit{margin-left:auto;border:0!important;border-radius:8px;background:#fff!important;color:#111!important;padding:4px 7px;font-size:12px;cursor:pointer}
.welcomeClock{display:flex;align-items:baseline;flex-wrap:wrap;gap:5px 8px;margin-top:7px}
.welcomeClock strong{font-size:22px;line-height:1;letter-spacing:-.06em;color:#fff}
.welcomeClock span{font-size:9px;line-height:1.35;color:#dedede}
.weatherCard{border:1px solid #e5e5e5;border-radius:10px;padding:9px;margin-top:8px;background:#fff;color:#111}
.weatherHead{display:flex;justify-content:space-between;align-items:center;gap:5px}

.weatherHead strong{display:block;font-size:12px;margin-top:3px;color:#111}
.weatherHead>span{font-size:23px}
.weatherNow{display:flex;align-items:center;gap:9px;margin:7px 0}
.weatherNow strong{font-size:28px;line-height:1;color:#111}

:root[data-theme="dark"] .welcomeEdit{background:#222!important;color:#fff!important;border:1px solid #444!important}

:root[data-theme="dark"] .welcomeGreeting h2,
:root[data-theme="dark"] .welcomeClock strong,
:root[data-theme="dark"] .welcomeClock span{color:#fff!important}

:root[data-theme="dark"] .weatherHead strong,
:root[data-theme="dark"] .weatherNow strong,

.welcomeGreeting h2,.welcomeClock strong{color:var(--ink)!important}

/* Painel de visões gerais na aba Início: preserva as páginas originais em iframes interativos. */
.dashboardHome{display:none;padding:16px 20px 30px;max-width:100%;margin:0 auto;width:100%;overflow:visible}
.dashboardHome.visible{display:flex;flex-direction:column;align-items:stretch;gap:14px}
.dashboardPlaceholder{width:100%;min-height:calc(100dvh - 100px);display:grid;place-items:center;text-align:center;padding:24px;font-size:16px;font-weight:700;color:var(--muted)}
.dashboardSection{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin:0;overflow:hidden;box-shadow:0 3px 14px #0000000b;flex:0 0 auto;width:100%;min-width:0;display:flex;flex-direction:column}
.dashboardSectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 15px;border-bottom:1px solid var(--line);min-height:40px}
.dashboardSectionHead h2{font-size:14px;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.02em}

.dashboardSection.study .dashboardSectionHead{border-left:4px solid #60a5fa}

.dashboardFrame{display:block;width:100%;height:240px;min-height:0;border:0;background:transparent;overflow:hidden;flex:0 0 auto}

/* Tela de entrada CAVERNA — animação inspirada no arquivo enviado */
#caverna-loader{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;overflow:hidden;background:radial-gradient(120% 90% at 50% 38%,#1a1a1d 0%,#111113 38%,#08080a 78%);color:#ecece8;opacity:1;visibility:visible;transition:opacity .35s ease,visibility .35s ease;font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
#caverna-loader.done{opacity:0;visibility:hidden;pointer-events:none}
/* Evita mostrar a tela antiga do app antes da animação inicial. */
#caverna-loader:not(.done) ~ .layout{visibility:hidden!important}
#caverna-loader.done ~ .layout{visibility:visible!important}
#caverna-loader *{box-sizing:border-box}
#caverna-loader .cav-fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#caverna-loader .cav-fx:before{content:"";position:absolute;width:70vmax;height:70vmax;left:-10vmax;top:-30vmax;background:radial-gradient(circle,rgba(157,183,204,.08),transparent 60%);animation:cav-drift 22s ease-in-out infinite alternate}
@keyframes cav-drift{to{transform:translate(30vmax,14vmax)}}
#caverna-loader .cav-fx i{position:absolute;bottom:-10px;left:var(--x);width:var(--z);height:var(--z);border-radius:50%;background:#9db7cc;opacity:0;box-shadow:0 0 8px #9db7cc;animation:cav-up var(--d) linear var(--l) infinite}
@keyframes cav-up{0%{transform:translate(0,0);opacity:0}12%{opacity:.7}85%{opacity:.35}100%{transform:translate(var(--dx),-105vh);opacity:0}}
#caverna-loader .cav-ridge{position:absolute;left:0;bottom:0;width:100%;height:30vh;display:block}
#caverna-loader .cav-main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:26px;padding:24px}
#caverna-loader .cav-logo{position:relative;isolation:isolate;width:min(78vw,380px);aspect-ratio:1;animation:cav-in 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes cav-in{from{opacity:0;transform:scale(.94)}}
#caverna-loader .cav-logo:before{content:"";position:absolute;inset:4%;border-radius:50%;background:radial-gradient(circle at 50% 40%,#1e1e22 0%,#111113 58%,#08080a 100%);box-shadow:inset 0 0 0 1px #2b2b30,inset 0 -30px 60px rgba(0,0,0,.6),0 30px 80px rgba(0,0,0,.7)}
#caverna-loader .cav-halo{position:absolute;inset:-14%;z-index:-1;border-radius:50%;background:radial-gradient(circle,rgba(157,183,204,.17),transparent 62%);animation:cav-pulse 4.5s ease-in-out infinite}
@keyframes cav-pulse{50%{transform:scale(1.07);opacity:.55}}
#caverna-loader .cav-ring{position:absolute;inset:0;width:100%;height:100%}
#caverna-loader .cav-spin{transform-origin:200px 200px;animation:cav-spin 60s linear infinite}
#caverna-loader .cav-spin-fast{transform-origin:200px 200px;animation:cav-spin 7s linear infinite}
@keyframes cav-spin{to{transform:rotate(360deg)}}
#caverna-loader .cav-mark{position:absolute;left:19%;right:19%;top:50%;width:62%;height:auto;aspect-ratio:560/538;object-fit:contain;transform:translateY(-50%);animation:cav-float 5s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(157,183,204,.25))}
@keyframes cav-float{50%{transform:translateY(calc(-50% - 7px))}}
#caverna-loader .cav-mark-glow{animation:cav-glow 2.6s ease-in-out infinite}
@keyframes cav-glow{50%{filter:drop-shadow(0 0 30px rgba(157,183,204,.6))}}
#caverna-loader .cav-txt{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
#caverna-loader .cav-txt h1{margin:0;color:#ecece8;font-size:clamp(24px,5vw,30px);font-weight:600;letter-spacing:.02em}
#caverna-loader .cav-txt h1 b{font-weight:inherit;animation:cav-blink 1.5s ease-in-out infinite}
#caverna-loader .cav-txt h1 b:nth-of-type(2){animation-delay:.2s}
#caverna-loader .cav-txt h1 b:nth-of-type(3){animation-delay:.4s}
@keyframes cav-blink{0%,100%{opacity:.2}50%{opacity:1}}
#caverna-loader .cav-bar{width:min(48vw,190px);height:2px;background:#2b2b30;overflow:hidden}
#caverna-loader .cav-bar i{display:block;width:45%;height:100%;background:linear-gradient(90deg,transparent,#9db7cc,#fff,#9db7cc,transparent);animation:cav-slide 2.6s cubic-bezier(.5,0,.2,1) infinite}
@keyframes cav-slide{0%{transform:translateX(-100%)}80%,100%{transform:translateX(230%)}}
@media(prefers-reduced-motion:reduce){#caverna-loader .cav-spin,#caverna-loader .cav-spin-fast,#caverna-loader .cav-txt h1 b,#caverna-loader .cav-halo,#caverna-loader .cav-fx:before,#caverna-loader .cav-logo,#caverna-loader .cav-mark,#caverna-loader .cav-mark-glow,#caverna-loader .cav-bar i{animation:none}#caverna-loader .cav-fx i{display:none}}
</style></head>

<script>
const names={'home':'Início / Painel geral','study-d':'Estudos / Visão geral','study-p':'Estudos / Agenda / LDI','study-s':'Estudos / Questões','study-c':'Estudos / Foco','study-f':'Estudos / Desempenho','nutrition':'Nutrição / Início','nutrition-diet':'Nutrição / Dieta','nutrition-market':'Nutrição / Mercado','nutrition-body':'Nutrição / Físico','constancy':'Constância pessoal / Visão geral','constancy-field':'Constância pessoal / Campo','constancy-profile':'Constância pessoal / Perfil','community':'Comunidade / Ranking','community-friends':'Comunidade / Amigos','settings':'Configurações'};

function updateWelcome(){
 const now=new Date(),h=now.getHours(),part=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
 const frames=['studyframe','appframe'].map(id=>document.getElementById(id));let name='Raphael';
 for(const f of frames){try{const appName=f&&f.contentWindow&&f.contentWindow.__displayName;if(appName&&String(appName).trim()){name=String(appName).trim();break}}catch(e){}}
 const p=document.getElementById('welcomePart'),n=document.getElementById('welcomeName'),clock=document.getElementById('liveClock'),date=document.getElementById('liveDate');
 if(String(name).trim().toLowerCase()==='rafael')name='Raphael';if(p)p.textContent=part;if(n)n.textContent=name;if(clock)clock.textContent=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});if(date)date.textContent=now.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
}
function editNameFromApp(){for(const id of ['studyframe','appframe']){try{const fn=document.getElementById(id).contentWindow.__editDisplayName;if(typeof fn==='function'){fn();return}}catch(e){}}route('settings')}
function drawer(open){document.getElementById('sidebar').classList.toggle('show',open);document.getElementById('shade').classList.toggle('show',open)}
function toggleGroup(id){const g=document.getElementById(id);g.classList.toggle('expanded');g.querySelector('.navitem').classList.toggle('open',g.classList.contains('expanded'))}

<script>
(function(){
  const overlay=document.getElementById('caverna-loader');
  if(!overlay)return;
  const fx=document.getElementById('caverna-loader-fx');
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduced&&fx&&!fx.children.length){
    for(let k=0;k<30;k++){const d=document.createElement('i'),z=1+Math.random()*2.5;d.style.cssText='--z:'+z+'px;--x:'+Math.random()*100+'%;--d:'+(9+Math.random()*10)+'s;--l:-'+Math.random()*14+'s;--dx:'+(Math.random()*80-40)+'px';fx.appendChild(d);}
    const logo=overlay.querySelector('.cav-logo');
    overlay.addEventListener('pointermove',e=>{const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;logo.style.transform='perspective(900px) rotateY('+x*10+'deg) rotateX('+(-y*10)+'deg)';});
  }
  let finishTimer=null,wasHidden=false,lastShown=0;
  function playLoader(){
    const now=Date.now();
    if(now-lastShown<700)return;
    lastShown=now;
    clearTimeout(finishTimer);
    overlay.classList.remove('done');
    overlay.querySelectorAll('.cav-logo,.cav-spin,.cav-spin-fast,.cav-mark,.cav-mark-glow,.cav-halo,.cav-bar i').forEach(el=>{
      el.style.animation='none';
      void el.offsetWidth;
      el.style.removeProperty('animation');
    });
    void overlay.offsetWidth;
    finishTimer=setTimeout(()=>overlay.classList.add('done'),2000);
  }
  // Primeira abertura e cada retorno ao app no celular: repete a mesma animação.
  finishTimer=setTimeout(()=>overlay.classList.add('done'),2000);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){wasHidden=true;return;}
    if(wasHidden){wasHidden=false;playLoader();}
  });
  window.addEventListener('pageshow',event=>{
    if(event.persisted)playLoader();
  });
})();
</script>
