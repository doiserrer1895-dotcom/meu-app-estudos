<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu App — Evolução</title>
<style>
:root{--bg:#f4f5f4;--paper:#fff;--ink:#111412;--muted:#777e79;--line:#e4e7e4;--soft:#f0f2f0;--accent:#111}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.layout{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr)}
.sidebar{background:#101211;color:#f7f8f7;height:100vh;position:sticky;top:0;overflow:auto;padding:19px 13px 22px;display:flex;flex-direction:column}
.brand{padding:6px 10px 21px;border-bottom:1px solid #2b302d;margin-bottom:15px;font-size:18px;font-weight:850;letter-spacing:-.05em}.brand small{display:block;font-size:10px;color:#9da59f;font-weight:500;letter-spacing:.08em;margin-top:4px}
.navlabel{font-size:9px;letter-spacing:.14em;color:#78817a;padding:11px 11px 6px;font-weight:800}
.navitem{width:100%;display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#c5cbc6;border-radius:11px;padding:10px 11px;text-align:left;font:600 12px system-ui;cursor:pointer;margin:1px 0}
.navitem .ico{width:18px;text-align:center;font-size:15px}.navitem.active,.navitem.open{background:#f1f3f1;color:#101211}.navitem:hover{background:#292e2b;color:white}.navitem.active:hover{background:#f1f3f1;color:#101211}
.subitems{padding:2px 0 7px 29px;display:none}.group.expanded .subitems{display:block}
.subitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;color:#aab2ac;padding:8px 9px;border-radius:8px;font-size:11px;cursor:pointer}.subitem .tool-ico{width:17px;min-width:17px;text-align:center;font-size:14px}.subitem.active{color:#fff;background:#292e2b;font-weight:750}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}.topbar{height:66px;flex:none;background:rgba(255,255,255,.9);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:3;backdrop-filter:blur(12px)}
.lefttop{display:flex;align-items:center;gap:13px}.hamb{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-size:18px;cursor:pointer}.crumb{font-size:12px;color:var(--muted)}.crumb b{color:var(--ink)}
.top-actions{display:flex;align-items:center;gap:9px}.themeToggle{border:1px solid var(--line);background:#fff;color:#111;border-radius:10px;padding:8px 11px;font-size:16px;cursor:pointer}
.content{flex:1;min-height:0}.appframe{display:block;width:100%;height:calc(100vh - 66px);min-height:600px;border:0;background:transparent}
.shade{display:none}
@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{position:fixed;z-index:10;left:0;top:0;width:270px;transform:translateX(-102%);transition:transform .22s;height:100dvh;overflow-y:auto;overscroll-behavior:contain;padding-bottom:16px}.sidebar.show{transform:translateX(0)}.hamb{display:block}.topbar{padding:0 15px}.shade.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:9}.appframe{height:calc(100dvh - 66px);min-height:500px}}
:root[data-theme="dark"]{--bg:#080808;--paper:#111;--ink:#fff;--muted:#aaa;--line:#303030;--soft:#1b1b1b;--accent:#fff}
:root[data-theme="dark"] .topbar{background:rgba(8,8,8,.94);border-color:var(--line)}
:root[data-theme="dark"] .themeToggle,:root[data-theme="dark"] .hamb{background:#171717;color:#fff;border-color:#333}
:root[data-theme="light"] .sidebar{background:linear-gradient(180deg,#101010,#050505);color:#fff}
:root[data-theme="light"] .topbar{background:rgba(255,255,255,.9);border-color:#ddd}
</style></head>
<body><div class="shade" id="shade" onclick="drawer(false)"></div>
<div class="layout"><aside class="sidebar" id="sidebar">
<div class="brand">MEU APP <small>ESTUDOS · EVOLUÇÃO</small></div>
<div class="navlabel">ÁREAS DO APP</div>
<div class="group expanded" id="g-study"><button class="navitem open" onclick="toggleGroup('g-study')"> <span class="ico">▤</span> Estudos <span style="margin-left:auto">⌄</span></button><div class="subitems">
<button class="subitem active" data-page="study-d" onclick="route('study-d',this)"><span class="tool-ico" data-icon="d">▦</span>Visão geral</button>
<button class="subitem" data-page="study-p" onclick="route('study-p',this)"><span class="tool-ico" data-icon="p">◈</span>Agenda / LDI</button>
<button class="subitem" data-page="study-s" onclick="route('study-s',this)"><span class="tool-ico" data-icon="s">▣</span>Banco de questões</button>
<button class="subitem" data-page="study-c" onclick="route('study-c',this)"><span class="tool-ico" data-icon="c">◷</span>Foco</button>
<button class="subitem" data-page="study-f" onclick="route('study-f',this)"><span class="tool-ico" data-icon="f">▥</span>Desempenho</button></div></div>
<div class="group" id="g-nutri"><button class="navitem" onclick="toggleGroup('g-nutri')"><span class="ico">♡</span> Nutrição <span style="margin-left:auto">⌄</span></button><div class="subitems"><button class="subitem" data-page="nutrition" onclick="route('nutrition',this)"><span class="tool-ico">⌂</span>Início / Dieta</button><button class="subitem" data-page="nutrition-market" onclick="route('nutrition-market',this)"><span class="tool-ico">▤</span>Mercado</button><button class="subitem" data-page="nutrition-evolution" onclick="route('nutrition-evolution',this)"><span class="tool-ico">▥</span>Evolução</button></div></div>
<div class="group" id="g-const"><button class="navitem" onclick="toggleGroup('g-const')"><span class="ico">◷</span> Constância pessoal <span style="margin-left:auto">⌄</span></button><div class="subitems"><button class="subitem" data-page="constancy" onclick="route('constancy',this)"><span class="tool-ico">⌂</span>Início</button><button class="subitem" data-page="constancy-field" onclick="route('constancy-field',this)"><span class="tool-ico">✦</span>Campo</button><button class="subitem" data-page="constancy-profile" onclick="route('constancy-profile',this)"><span class="tool-ico">♙</span>Perfil</button></div></div>
<div class="group" id="g-community"><button class="navitem" onclick="toggleGroup('g-community')"><span class="ico">◎</span> Comunidade <span style="margin-left:auto">⌄</span></button><div class="subitems"><button class="subitem" data-page="community" onclick="route('community',this)"><span class="tool-ico">♧</span>Ranking</button><button class="subitem" data-page="community-friends" onclick="route('community-friends',this)"><span class="tool-ico">♙</span>Amigos</button></div></div>
<div class="navlabel">SUA CONTA</div><button class="navitem" data-page="settings" onclick="route('settings',this)"><span class="ico">⚙</span> Configurações</button>
</aside><main class="main"><header class="topbar"><div class="lefttop"><button class="hamb" onclick="drawer(true)" aria-label="Abrir menu">☰</button><div class="crumb" id="crumb"><b>Estudos / Visão geral</b></div></div><div class="top-actions"><button class="themeToggle" id="themeToggle" onclick="toggleTheme()" title="Alternar tema">☾</button></div></header><div class="content"><iframe class="appframe" id="appframe" title="Área do aplicativo" src="estudos-area.html?embedded=1&amp;page=d"></iframe></div></main></div>
<script>
const names={'study-d':'Estudos / Visão geral','study-p':'Estudos / Agenda / LDI','study-s':'Estudos / Banco de questões','study-c':'Estudos / Foco','study-f':'Estudos / Desempenho','nutrition':'Nutrição / Início','nutrition-market':'Nutrição / Mercado','nutrition-evolution':'Nutrição / Evolução','constancy':'Constância pessoal / Início','constancy-field':'Constância pessoal / Campo','constancy-profile':'Constância pessoal / Perfil','community':'Comunidade / Ranking','community-friends':'Comunidade / Amigos','settings':'Configurações'};
function drawer(open){document.getElementById('sidebar').classList.toggle('show',open);document.getElementById('shade').classList.toggle('show',open)}
function toggleGroup(id){const g=document.getElementById(id);g.classList.toggle('expanded');g.querySelector('.navitem').classList.toggle('open',g.classList.contains('expanded'))}
let active='study-d';
function activateAreaTab(id){const f=document.getElementById('appframe');try{const w=f.contentWindow,d=f.contentDocument;if(id.startsWith('constancy')){const v=id==='constancy'?'i':id==='constancy-field'?'c':'j';if(typeof w.go==='function')w.go(v);return}if(id.startsWith('community')){const t=id==='community'?'rank':'amigos';const b=d.querySelector('[data-t="'+t+'"]');if(b)b.click();return}if(id.startsWith('nutrition')){const label=id==='nutrition-market'?'Mercado':id==='nutrition-evolution'?'Evolução':'Início';const els=[...d.querySelectorAll('button,[role="tab"],a')];const b=els.find(x=>x.textContent.trim().toLowerCase()===label.toLowerCase()||x.textContent.trim().toLowerCase().includes(label.toLowerCase()));if(b)b.click();}}catch(e){}}
function route(id,el){active=id;document.getElementById('crumb').innerHTML='<b>'+names[id]+'</b>';document.querySelectorAll('.subitem').forEach(x=>x.classList.toggle('active',x.dataset.page===id));document.querySelectorAll('.navitem[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===id));let group={'study-d':'g-study','study-p':'g-study','study-s':'g-study','study-c':'g-study','study-f':'g-study','nutrition':'g-nutri','nutrition-market':'g-nutri','nutrition-evolution':'g-nutri','constancy':'g-const','constancy-field':'g-const','constancy-profile':'g-const','community':'g-community','community-friends':'g-community'}[id];if(group){document.getElementById(group).classList.add('expanded');document.getElementById(group).querySelector('.navitem').classList.add('open')}
const frame=document.getElementById('appframe');if(id.startsWith('study-')){let page=id.slice(6);if(!frame.src.includes('estudos-area.html?embedded=1'))frame.src='estudos-area.html?embedded=1&page='+page;else{try{frame.contentWindow.go(page)}catch(e){frame.src='estudos-area.html?embedded=1&page='+page}}}else if(id==='settings'){frame.src='estudos-area.html?embedded=1&page=settings'}else{let src=id.startsWith('nutrition')?'nutricao.html':id.startsWith('constancy')?'constancia.html':'comunidade.html';if(!frame.src.includes(src)){frame.onload=()=>{frame.onload=null;activateAreaTab(id)};frame.src=src}else activateAreaTab(id)}
drawer(false)}
function toggleTheme(){let next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);localStorage.setItem('previewTheme',next);document.getElementById('themeToggle').textContent=next==='dark'?'☀':'☾'}
(function(){let t=localStorage.getItem('previewTheme')||'light';document.documentElement.setAttribute('data-theme',t);document.getElementById('themeToggle').textContent=t==='dark'?'☀':'☾';})();
window.addEventListener('load',()=>{const f=document.getElementById('appframe');f.addEventListener('load',()=>{try{const d=f.contentDocument;if(!d)return;let s=d.getElementById('central-shell-integration');if(!s){s=d.createElement('style');s.id='central-shell-integration';d.head.appendChild(s)}s.textContent='html,body{background:#050505!important;color:#f5f5f5!important;color-scheme:dark!important}#nav{display:none!important}#app{padding-bottom:24px!important} .fab{bottom:24px!important}';if(f.src.includes('estudos-area.html?embedded=1')){const spans=d.querySelectorAll('#nav button span');const keys=['d','p','s','c','f'];spans.forEach((sp,i)=>{let target=document.querySelector('[data-icon="'+keys[i]+'"]');if(target&&sp.innerHTML.trim())target.innerHTML=sp.innerHTML})}}catch(e){}})});
</script></body></html>
