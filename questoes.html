<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Banco de Questões · EEAR</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0a0a0a;color:#fff;font:14px/1.5 system-ui,Arial,sans-serif}
#status{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:24px;color:#fff;background:#0a0a0a;z-index:2}
#status strong{font-size:17px;margin-bottom:8px}#status small{color:#aaa}
#bar{height:6px;background:#282828;border-radius:99px;overflow:hidden;margin:16px auto;width:min(320px,80vw)}
#bar i{display:block;height:100%;width:0;background:#4ade80;transition:width .2s}
#retry{display:none;margin:14px auto 0;padding:10px 18px;border:1px solid #555;border-radius:10px;background:#171717;color:#fff;font-weight:700}
body{position:relative;overflow:hidden}
#bank{display:none;position:absolute;inset:0;width:100%;height:100%;min-height:0;border:0;background:#fff}#clear-linked-filter{position:fixed;z-index:5;top:10px;right:10px;padding:8px 11px;border:1px solid #555;border-radius:10px;background:#171717;color:#fff;font-size:12px;font-weight:700}


html,body,#status{background:radial-gradient(60% 50% at 50% 0%,#161616,#020202) fixed;color:#fafafa;font-family:Inter,-apple-system,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#bar{background:rgba(255,255,255,.10);border-radius:99px}
#retry{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);border-radius:13px}

</style>
</head>
<body>
<div id="status"><strong>Preparando o banco completo de questões…</strong><span id="detail">Aguarde enquanto os arquivos são carregados.</span><div id="bar"><i id="progress"></i></div><small>O download inicial pode demorar por causa das imagens originais.</small><button id="retry" type="button">Tentar novamente</button></div>
<button id="clear-linked-filter" type="button">Limpar filtro da agenda</button><iframe id="bank" title="Banco completo de questões EEAR"></iframe>
<script>
(function(){
  "use strict";
  const TOTAL=9;
  const status=document.getElementById("status");
  const detail=document.getElementById("detail");
  const progress=document.getElementById("progress");
  const retry=document.getElementById("retry");
  const bank=document.getElementById("bank");
  let activeTheme=(function(){try{return localStorage.getItem("app-theme-evolucao")==="light"?"light":"dark"}catch(e){return "dark"}})();
  function hideInnerThemeControls(doc){
    if(!doc)return;
    const iconOnly=/^(☾|☽|🌙|☀|☀️|🌞)$/;
    doc.querySelectorAll("button,[role='button']").forEach(function(el){
      const label=[el.textContent,el.getAttribute("aria-label"),el.getAttribute("title"),el.getAttribute("data-theme")].filter(Boolean).join(" ").trim();
      if(/^(tema claro|tema escuro|alternar tema|mudar tema|modo claro|modo escuro|theme|dark mode|light mode)$/i.test(label)||iconOnly.test(label)){
        el.style.setProperty("display","none","important");el.setAttribute("aria-hidden","true");
      }
    });
  }
  function applyQuestionTheme(theme){
    activeTheme=theme==="light"?"light":"dark";
    document.documentElement.setAttribute("data-theme",activeTheme);
    let outer=document.getElementById("eear-outer-theme");
    if(!outer){outer=document.createElement("style");outer.id="eear-outer-theme";document.head.appendChild(outer);}
    outer.textContent=activeTheme==="light"
      ? "html,body,#status{background:#f5f5f5!important;color:#111!important}#status small{color:#555!important}#retry{background:#fff!important;color:#111!important;border-color:#ccc!important}#bar{background:#ddd!important}"
      : "html,body,#status{background:radial-gradient(60% 50% at 50% 0%,#161616,#020202) fixed!important;color:#fafafa!important}#status small{color:#aaa!important}#retry{background:rgba(255,255,255,.07)!important;color:#fff!important;border-color:rgba(255,255,255,.14)!important}#bar{background:rgba(255,255,255,.10)!important}";
    try{
      const doc=bank.contentDocument;if(!doc||!doc.head)return;
      let style=doc.getElementById("eear-bank-theme");
      if(!style){style=doc.createElement("style");style.id="eear-bank-theme";doc.head.appendChild(style);}
      style.textContent=activeTheme==="light" ? `
        :root{color-scheme:light!important}
        html,body{background:#f5f5f5!important;color:#111!important}
        .card[data-id]{background:#fff!important;color:#111!important;border-color:#d5d5d5!important;box-shadow:0 5px 18px rgba(0,0,0,.07)!important}
        .card[data-id] p,.card[data-id] .question-text,.card[data-id] .enunciado{color:#111!important}
        .card[data-id] .alt[data-a]{background:#f1f1f1!important;color:#111!important;border-color:#d0d0d0!important}
        .card[data-id] img,.card[data-id] svg,.card[data-id] canvas{filter:none!important}
      ` : `
        :root{color-scheme:dark!important}
        html,body{background:#080808!important;color:#f5f5f5!important}
        .card[data-id]{background:#141414!important;color:#f5f5f5!important;border-color:#383838!important;box-shadow:0 8px 24px rgba(0,0,0,.22)!important}
        .card[data-id] p,.card[data-id] .question-text,.card[data-id] .enunciado{color:#f5f5f5!important}
        .card[data-id] .alt[data-a]{background:#202020!important;color:#f5f5f5!important;border-color:#484848!important}
        .card[data-id] img,.card[data-id] svg,.card[data-id] canvas{filter:none!important}
      `;
      hideInnerThemeControls(doc);
    }catch(e){}
  }
  window.addEventListener("message",function(event){if(event.data&&event.data.type==="app-theme-change")applyQuestionTheme(event.data.theme);});
  window.addEventListener("message",function(event){if(event.source===window.parent&&event.data&&event.data.type==="app-question-filter"&&bank.contentWindow)bank.contentWindow.postMessage(event.data,"*")});
  document.getElementById("clear-linked-filter").addEventListener("click",function(){if(bank.contentWindow)bank.contentWindow.postMessage({type:"app-question-filter",filter:{}},"*")});
  window.addEventListener("message",function(event){
    if(event.source===bank.contentWindow&&event.data&&event.data.type&&
       (event.data.type==="eear-question-attempt"||event.data.type==="eear-question-taxonomy"||event.data.type==="eear-question-taxonomy-full")){
      window.parent.postMessage(event.data,"*");
    }
  });
  function openBankCache(){return new Promise(function(resolve){if(!window.indexedDB)return resolve(null);const request=indexedDB.open("meu-app-estudos-question-bank",1);request.onupgradeneeded=function(){if(!request.result.objectStoreNames.contains("cache"))request.result.createObjectStore("cache")};request.onsuccess=function(){resolve(request.result)};request.onerror=function(){resolve(null)}})}
  function bankCacheKey(){return new URL("__eear_question_bank_cache_v1.html",location.href).href}
  async function readCachedBank(){try{if(window.caches){const cache=await caches.open("eear-question-bank-cache-v1"),response=await cache.match(bankCacheKey());if(response){const blob=await response.blob();if(blob.size>=1000000)return blob}}}catch(e){}const db=await openBankCache();if(!db)return null;return new Promise(function(resolve){try{const request=db.transaction("cache","readonly").objectStore("cache").get("bank-html-v1");request.onsuccess=function(){const blob=request.result instanceof Blob&&request.result.size>=1000000?request.result:null;resolve(blob)};request.onerror=function(){resolve(null)}}catch(e){resolve(null)}finally{db.close()}})}
  async function writeCachedBank(blob){try{if(window.caches){const cache=await caches.open("eear-question-bank-cache-v1");await cache.put(bankCacheKey(),new Response(blob,{headers:{"Content-Type":"text/html;charset=utf-8"}}))}}catch(e){console.warn("Cache API não conseguiu guardar o banco:",e)}const db=await openBankCache();if(!db)return;await new Promise(function(resolve){try{const tx=db.transaction("cache","readwrite");tx.objectStore("cache").put(blob,"bank-html-v1");tx.oncomplete=resolve;tx.onerror=resolve;tx.onabort=resolve}catch(e){resolve()}});db.close()}
  async function start(){
    retry.style.display="none";
    bank.style.display="none";
    status.style.display="grid";
    detail.textContent="Verificando banco salvo neste dispositivo…";
    let writer=null;
    try{
      let blob=await readCachedBank();
      if(!blob){
        detail.textContent="Primeiro carregamento: preparando banco de questões…";
        if(typeof DecompressionStream==="undefined")throw new Error("Este navegador não oferece suporte à descompactação necessária. Atualize o Chrome ou Edge.");
        const ds=new DecompressionStream("gzip");
        writer=ds.writable.getWriter();
        const blobPromise=new Response(ds.readable).blob();
        const BATCH=3;
        for(let start=1;start<=TOTAL;start+=BATCH){
          const end=Math.min(start+BATCH-1,TOTAL);
          detail.textContent="Carregando arquivos "+start+"–"+end+" de "+TOTAL+" em paralelo…";
          const files=await Promise.all(Array.from({length:end-start+1},async function(_,offset){
            const i=start+offset,name="questoes-banco-"+String(i).padStart(2,"0")+".gz";
            const response=await fetch("banco-questoes/"+name);
            if(!response.ok)throw new Error("Não foi possível carregar "+name+" (HTTP "+response.status+").");
            return new Uint8Array(await response.arrayBuffer());
          }));
          for(let offset=0;offset<files.length;offset++){
            await writer.write(files[offset]);
            const done=start+offset;
            progress.style.width=(done/TOTAL*100)+"%";
          }
        }
        await writer.close();
        blob=await blobPromise;
        if(blob.size<1000000)throw new Error("O banco descompactado parece incompleto.");
        detail.textContent="Salvando banco para abrir mais rápido nas próximas vezes…";
        await writeCachedBank(blob);
      }
      progress.style.width="100%";
      bank.onload=async function(){
        status.style.display="none";
        bank.style.display="block";
        try{

          const targetDoc=bank.contentDocument;
          const bridgeScript=targetDoc.createElement("script");
          bridgeScript.textContent="("+function(){
            "use strict";
            function emit(source,id,subject,topic,picked,correct){
              if(!id||!subject||!picked||typeof correct!=="boolean")return;
              const now=new Date();
              const date=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
              const eventId=source+":"+id+":"+Date.now()+":"+Math.random().toString(36).slice(2);
              window.parent.postMessage({type:"eear-question-attempt",attempt:{
                source:source,questionId:String(id),eventId:eventId,subject:String(subject),
                topic:String(topic||"Geral"),picked:String(picked),correct:correct,date:date
              }},"*");
            }
            const rawBank=(typeof B!=="undefined"&&B)||window.__eearBridgeQ||{};
            const taxonomy={},hierarchy={};
            Object.keys(rawBank).forEach(function(id){const q=rawBank[id];if(!q||typeof q!=="object")return;const rawD=String(q.d||q.discipline||q.subject||"").trim();if(!rawD)return;const dn=rawD.normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").toLowerCase().replace(/[ ]+/g," ").trim();const d=/^fisica(?:[ ]*[123])?$/.test(dn)?"Física":/^matematica(?:[ ]*[123])?$/.test(dn)?"Matemática":/^ingles(?:[ ]*[123])?$/.test(dn)?"Inglês":rawD;const m=String(q.m||q.matter||q.area||"Geral").trim()||"Geral",c=String(q.s||q.content||q.topic||"Geral").trim()||"Geral",u=String(q.u||q.subtopic||q.detail||"Geral").trim()||"Geral",t=String(q.u||q.s||q.m||q.topic||"Geral").trim()||"Geral";if(!taxonomy[d])taxonomy[d]=[];if(!taxonomy[d].includes(t))taxonomy[d].push(t);if(!hierarchy[d])hierarchy[d]={};if(!hierarchy[d][m])hierarchy[d][m]={};if(!hierarchy[d][m][c])hierarchy[d][m][c]=[];if(!hierarchy[d][m][c].includes(u))hierarchy[d][m][c].push(u)});
            function sortTree(o){Object.keys(o).forEach(k=>Array.isArray(o[k])?o[k].sort((a,b)=>a.localeCompare(b,"pt-BR")):sortTree(o[k]))}
            Object.keys(taxonomy).forEach(n=>taxonomy[n].sort((a,b)=>a.localeCompare(b,"pt-BR")));sortTree(hierarchy);
            window.parent.postMessage({type:"eear-question-taxonomy",taxonomy:taxonomy},"*");window.parent.postMessage({type:"eear-question-taxonomy-full",hierarchy:hierarchy},"*");
            function applyLinkedFilter(f){document.querySelectorAll(".card[data-id]").forEach(card=>{const q=rawBank[card.dataset.id]||(window.__eearBridgeQ&&window.__eearBridgeQ[card.dataset.id])||{},norm=v=>String(v||"").normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").trim().toLowerCase(),ns=v=>{const x=norm(v);return x.replace(/^(fisica|matematica|ingles)\\s*[123]$/,"$1")},fields=[ns(q.d||q.discipline||q.subject),norm(q.m||q.matter||q.area),norm(q.s||q.content||q.topic),norm(q.u||q.subtopic||q.detail)],wanted=[ns(f.subject),norm(f.matter),norm(f.content),norm(f.specific)];card.style.display=wanted.every((v,i)=>!v||fields[i]===v)?"":"none"})}
            window.addEventListener("message",ev=>{if(ev.data&&ev.data.type==="app-question-filter"){window.__appQuestionFilter=ev.data.filter||{};applyLinkedFilter(window.__appQuestionFilter)}});
            try{new MutationObserver(()=>{if(window.__appQuestionFilter)applyLinkedFilter(window.__appQuestionFilter)}).observe(document.body,{childList:true,subtree:true})}catch(e){}
            document.addEventListener("click",function(event){
              const bankAnswer=event.target.closest&&event.target.closest(".alt[data-a]");
              if(bankAnswer){
                const card=bankAnswer.closest(".card");
                if(!card)return;
                const id=card.dataset.id,q=window.__eearBridgeQ&&window.__eearBridgeQ[id];
                const question=(typeof B!=="undefined"&&B[id])||q;
                const picked=(typeof ans!=="undefined"&&ans[id])||bankAnswer.dataset.a;
                if(!question||question.open||!question.r||question.r==="ANULADA")return;
                const accepted=question.legacy_d==="Física 2"?[question.r,question.r2].filter(Boolean):[question.r];
                emit("banco",id,question.d,question.u||question.s||question.m,picked,accepted.includes(picked));
                return;
              }
              const examAnswer=event.target.closest&&event.target.closest("[data-exam-answer]");
              if(examAnswer){
                const card=examAnswer.closest("[data-exam-q]");
                if(!card||typeof provaState==="undefined"||typeof PROVAS_DATA==="undefined")return;
                const number=Number(card.dataset.examQ),exam=PROVAS_DATA[provaState.exam];
                const question=exam&&exam.questions.find(item=>Number(item.n)===number);
                const picked=provaState.answers[provaState.exam+"_"+number];
                if(!question||!picked||question.a==="ANULADA")return;
                emit("prova",provaState.exam+"_q"+number,question.s,exam.title,picked,picked===question.a);
                return;
              }
              const simAnswer=event.target.closest&&event.target.closest("[data-sim-answer]");
              if(simAnswer){
                const card=simAnswer.closest("[data-sim-q]");
                if(!card||typeof simState==="undefined"||typeof SIMULADOS_DATA==="undefined")return;
                const parts=card.dataset.simQ.split("_"),subject=parts[0],number=Number(parts[1]);
                const questions=SIMULADOS_DATA[simState.exam]&&SIMULADOS_DATA[simState.exam][subject];
                const question=questions&&questions.find(item=>Number(item.n)===number);
                const picked=simState.answers[simState.exam+"_"+subject+"_"+number];
                if(!question||!picked)return;
                const year=simState.exam==="s1"?"2021.1":"2021.2";
                emit("simulado",simState.exam+"_"+subject+"_q"+number,subject,"Simulado "+year,picked,picked===question.a);
              }
            },false);
          }.toString()+")();";

          targetDoc.body.appendChild(bridgeScript);

          // Ajustes visuais exclusivos do Banco de Questões: largura mais confortável,
          // maior área vertical para leitura e paleta estritamente neutra.
          const bankVisualStyle = targetDoc.createElement("style");
          bankVisualStyle.id = "eear-bank-visual-adjustments";
          bankVisualStyle.textContent = `
            :root { color-scheme: dark; }
            html, body {
              background: #080808 !important;
              color: #f5f5f5 !important;
              accent-color: #f5f5f5 !important;
            }
            body {
              background-image: none !important;
            }
            .card[data-id] {
              width: 100% !important;
              max-width: none !important;
              min-height: 190px !important;
              height: auto !important;
              margin: 0 0 24px !important;
              padding: 30px !important;
              box-sizing: border-box !important;
              background: #141414 !important;
              color: #f5f5f5 !important;
              border: 1px solid #383838 !important;
              border-radius: 14px !important;
              box-shadow: 0 8px 24px rgba(0,0,0,.22) !important;
            }
            .card[data-id] p,
            .card[data-id] .question-text,
            .card[data-id] .enunciado {
              color: #f5f5f5 !important;
              font-size: 16px !important;
              line-height: 1.7 !important;
            }
            .card[data-id] .alt[data-a] {
              display: block !important;
              width: 100% !important;
              min-height: 48px !important;
              height: auto !important;
              margin: 10px 0 !important;
              padding: 12px 16px !important;
              box-sizing: border-box !important;
              color: #f5f5f5 !important;
              background: #202020 !important;
              border: 1px solid #484848 !important;
              border-radius: 10px !important;
              line-height: 1.55 !important;
              text-align: left !important;
            }
            .card[data-id] img,
            .card[data-id] svg,
            .card[data-id] canvas {
              max-width: 100% !important;
              max-height: 420px !important;
              object-fit: contain !important;
            }
            .card[data-id] * {
              --primary: #f5f5f5 !important;
              --accent: #f5f5f5 !important;
              --brand: #f5f5f5 !important;
            }
            @media (min-width: 1100px) {
              .card[data-id] { padding: 30px !important; }
              .card[data-id] p,
              .card[data-id] .question-text,
              .card[data-id] .enunciado { font-size: 17px !important; }
            }
            @media (max-width: 700px) {
              .card[data-id] {
                width: 100% !important;
                max-width: none !important;
                min-height: 0 !important;
                padding: 18px !important;
                margin-bottom: 16px !important;
              }
            }
          `;
          targetDoc.head.appendChild(bankVisualStyle);
          applyQuestionTheme(activeTheme);
          const importedQuestionsScript=targetDoc.createElement("script");
          importedQuestionsScript.textContent="(function(){\n\"use strict\";\nconst QUESTIONS=[{\"id\":\"pt-import-001\",\"level\":1,\"category\":\"Acentuação gráfica\",\"topic\":\"Acentuação gráfica\",\"stem\":\"De acordo com as regras de acentuação, assinale a alternativa em que as palavras receberam\\nacento gráfico por serem classificadas, respectivamente, como: oxítonas, paroxítonas e\\nproparoxítonas.\",\"options\":[{\"letter\":\"A\",\"text\":\"açaí, arquétipo, táctil\"},{\"letter\":\"B\",\"text\":\"mocotó, bíceps, exército\"},{\"letter\":\"C\",\"text\":\"café, alcoólatra, escritório\"},{\"letter\":\"D\",\"text\":\"trânsito, baía, ômega\"},{\"letter\":\"E\",\"text\":\"dúvida, rubrica, órfã\"}],\"answer\":\"B\",\"matter\":\"Ortografia\",\"content\":\"Acentuação gráfica\",\"specific\":\"Acentuação gráfica\",\"n\":1},{\"id\":\"pt-import-002\",\"level\":1,\"category\":\"Acentuação gráfica\",\"topic\":\"Acentuação gráfica\",\"stem\":\"Assinale a alternativa em que os vocábulos obedecem às mesmas regras de acentuação\\ngráfica das palavras “temática” e “saúde”, respectivamente.\",\"options\":[{\"letter\":\"A\",\"text\":\"hífen, ótimo.\"},{\"letter\":\"B\",\"text\":\"parabéns, mágico.\"},{\"letter\":\"C\",\"text\":\"médico, conteúdo.\"},{\"letter\":\"D\",\"text\":\"robótica, café.\"},{\"letter\":\"E\",\"text\":\"revólver, faísca.\"}],\"answer\":\"C\",\"matter\":\"Ortografia\",\"content\":\"Acentuação gráfica\",\"specific\":\"Acentuação gráfica\",\"n\":2},{\"id\":\"pt-import-003\",\"level\":1,\"category\":\"Acentuação gráfica\",\"topic\":\"Acentuação gráfica\",\"stem\":\"Marque a alternativa que classifica as palavras abaixo quanto à acentuação,\\nrespectivamente:\\nTábua / Céu / Tórax\",\"options\":[{\"letter\":\"A\",\"text\":\"Paroxítona / Paroxítona / Paroxítona.\"},{\"letter\":\"B\",\"text\":\"Oxítona / Monossílabo átono / Paroxítona.\"},{\"letter\":\"C\",\"text\":\"Paroxítona / Monossílabo tônico / Paroxítona.\"},{\"letter\":\"D\",\"text\":\"Monossílabo átono / Paroxítona / Oxítona.\"},{\"letter\":\"E\",\"text\":\"Proparoxítona / Paroxítona / Oxítona.\"}],\"answer\":\"C\",\"matter\":\"Ortografia\",\"content\":\"Acentuação gráfica\",\"specific\":\"Acentuação gráfica\",\"n\":3},{\"id\":\"pt-import-004\",\"level\":1,\"category\":\"Ortografia\",\"topic\":\"Acordo ortográfico\",\"stem\":\"Segundo o acordo ortográfico de 2009/2010, quanto à acentuação, marque a alternativa\\nem que a palavra em\",\"options\":[{\"letter\":\"A\",\"text\":\"Quanto à limpeza, eu sou paranóica.\"},{\"letter\":\"B\",\"text\":\"Sempre precisamos de novas ideias.\"},{\"letter\":\"C\",\"text\":\"Nesta cidade, todos os hoteis são bons.\"},{\"letter\":\"D\",\"text\":\"Os docentes não vêem com bons olhos a nova proposta de calendário escolar.\"},{\"letter\":\"E\",\"text\":\"Meu esposo sempre pára o carro para atender ao celular.\"}],\"answer\":\"B\",\"matter\":\"Ortografia\",\"content\":\"Ortografia\",\"specific\":\"Acordo ortográfico\",\"n\":4},{\"id\":\"pt-import-005\",\"level\":1,\"category\":\"Ortografia\",\"topic\":\"Acentuação e grafia\",\"stem\":\"Assinale a alternativa em que as regras de acentuação, nos conjuntos de palavras, foram\\nempregadas de acordo com a norma padrão:\",\"options\":[{\"letter\":\"A\",\"text\":\"taínha, juiz e juízes\"},{\"letter\":\"B\",\"text\":\"panacéia, apto, décadas\"},{\"letter\":\"C\",\"text\":\"taxímetro, pangeia, baú.\"},{\"letter\":\"D\",\"text\":\"imã, apto, bíceps\"},{\"letter\":\"E\",\"text\":\"herói, jaú, geléia.\"}],\"answer\":\"C\",\"matter\":\"Ortografia\",\"content\":\"Ortografia\",\"specific\":\"Acentuação e grafia\",\"n\":5},{\"id\":\"pt-import-006\",\"level\":1,\"category\":\"Acentuação gráfica\",\"topic\":\"Acentuação gráfica\",\"stem\":\"Assinale a alternativa em que todas as palavras são consideradas paroxítonas na escrita:\",\"options\":[{\"letter\":\"A\",\"text\":\"publica – astronauta – viajaram – história.\"},{\"letter\":\"B\",\"text\":\"Paris – Brasil – Londres – Munique.\"},{\"letter\":\"C\",\"text\":\"Brasília – Amazônia – Califórnia – Júpiter.\"},{\"letter\":\"D\",\"text\":\"universidade – significado – Singapura – país.\"},{\"letter\":\"E\",\"text\":\"rubrica – satélites – fenômeno – planetário.\"}],\"answer\":\"A\",\"matter\":\"Ortografia\",\"content\":\"Acentuação gráfica\",\"specific\":\"Acentuação gráfica\",\"n\":6},{\"id\":\"pt-import-007\",\"level\":1,\"category\":\"Fonética e Fonologia\",\"topic\":\"Encontros consonantais\",\"stem\":\"Assinale a alternativa em que todas as palavras possuam encontros consonantais:\",\"options\":[{\"letter\":\"A\",\"text\":\"samba, clima, apto.\"},{\"letter\":\"B\",\"text\":\"mnemônico, obturar, subdelegado.\"},{\"letter\":\"C\",\"text\":\"sucção, istmo, chave\"},{\"letter\":\"D\",\"text\":\"exceção, mundo, sonda.\"},{\"letter\":\"E\",\"text\":\"jejum, aquilo, chave.\"}],\"answer\":\"B\",\"matter\":\"Fonética e fonologia\",\"content\":\"Fonética e fonologia\",\"specific\":\"Fonema\",\"n\":7},{\"id\":\"pt-import-008\",\"level\":1,\"category\":\"Ortografia\",\"topic\":\"Acentuação e grafia\",\"stem\":\"Assinale a alternativa em que as regras de acentuação, nos conjuntos de palavras, foram\\nempregadas de acordo com a norma padrão:\",\"options\":[{\"letter\":\"A\",\"text\":\"lmã, apto, bíceps.\"},{\"letter\":\"B\",\"text\":\"panacéia, ápto, décadas.\"},{\"letter\":\"C\",\"text\":\"herói, jaú, geléia.\"},{\"letter\":\"D\",\"text\":\"taxímetro, pangeia, baú.\"},{\"letter\":\"E\",\"text\":\"taínha, juiz, juizes.\"}],\"answer\":\"D\",\"matter\":\"Ortografia\",\"content\":\"Ortografia\",\"specific\":\"Acentuação e grafia\",\"n\":8},{\"id\":\"pt-import-009\",\"level\":1,\"category\":\"Acentuação gráfica\",\"topic\":\"Acentuação gráfica\",\"stem\":\"Assinale a alternativa em que todos os vocábulos são acentuados pela mesma regra.\",\"options\":[{\"letter\":\"A\",\"text\":\"plástico, últimos, mamíferos, único.\"},{\"letter\":\"B\",\"text\":\"contrário, hipóteses, sensíveis, hotéis.\"},{\"letter\":\"C\",\"text\":\"indústria, países, além, já.\"},{\"letter\":\"D\",\"text\":\"reutilizáveis, através, início, resíduos.\"},{\"letter\":\"E\",\"text\":\"próprio, sanitários, lá, descartável.\"}],\"answer\":\"A\",\"matter\":\"Ortografia\",\"content\":\"Acentuação gráfica\",\"specific\":\"Acentuação gráfica\",\"n\":9},{\"id\":\"pt-import-010\",\"level\":1,\"category\":\"Acentuação gráfica\",\"topic\":\"Acentuação gráfica\",\"stem\":\"Assinale a alternativa em que todos os vocábulos do enunciado são acentuados pela mesma\\nregra.\",\"options\":[{\"letter\":\"A\",\"text\":\"Uma sólida política de saneamento tem que levar em conta os problemas econômicos da população.\"},{\"letter\":\"B\",\"text\":\"Há um sistema acessível, mas também regulatório.\"},{\"letter\":\"C\",\"text\":\"Pressente-se um crônico sentimento de impotência, resíduo da própria história.\"},{\"letter\":\"D\",\"text\":\"Os termos de privacidade do sistema construído pelos estagiários são inaceitáveis.\"},{\"letter\":\"E\",\"text\":\"As audiências públicas são realizadas em caráter extraordinário.\"}],\"answer\":\"A\",\"matter\":\"Ortografia\",\"content\":\"Acentuação gráfica\",\"specific\":\"Acentuação gráfica\",\"n\":10},{\"id\":\"pt-import-011\",\"level\":1,\"category\":\"Acentuação gráfica\",\"topic\":\"Acentuação gráfica\",\"stem\":\"Assinale a alternativa cujo vocábulo só pode ser empregado com acento gráfico.\",\"options\":[{\"letter\":\"A\",\"text\":\"Diálogo\"},{\"letter\":\"B\",\"text\":\"Até\"},{\"letter\":\"C\",\"text\":\"Análogo\"},{\"letter\":\"D\",\"text\":\"É\"},{\"letter\":\"E\",\"text\":\"Música\"}],\"answer\":\"C\",\"matter\":\"Ortografia\",\"content\":\"Acentuação gráfica\",\"specific\":\"Acentuação gráfica\",\"n\":11},{\"id\":\"pt-import-012\",\"level\":1,\"category\":\"Acentuação gráfica\",\"topic\":\"Acentuação gráfica\",\"stem\":\"De acordo com as regras ortográficas, é correto afirmar que:\",\"options\":[{\"letter\":\"A\",\"text\":\"“límpido” e “lírio” são acentuados por seguirem a mesma regra de acentuação.\"},{\"letter\":\"B\",\"text\":\"“urubu” e “caju” não são acentuados por serem vocábulos paroxítonos.\"},{\"letter\":\"C\",\"text\":\"“Piauí” e “teiú” são acentuadas por estarem sozinhas, em posição tônica final de sílaba.\"},{\"letter\":\"D\",\"text\":\"“ninguém” e “álbum” são acentuados por serem vocábulos oxítonos terminados em - m.\"},{\"letter\":\"E\",\"text\":\"“ruim” e “feiura” não são acentuados pelo mesmo motivo.\"}],\"answer\":\"C\",\"matter\":\"Ortografia\",\"content\":\"Acentuação gráfica\",\"specific\":\"Acentuação gráfica\",\"n\":12},{\"id\":\"pt-import-013\",\"level\":1,\"category\":\"Ortografia\",\"topic\":\"Acentuação e grafia\",\"stem\":\"Assinale a alternativa em que todas as palavras devem ser acentuadas.\",\"options\":[{\"letter\":\"A\",\"text\":\"caroço - miudo - feiura\"},{\"letter\":\"B\",\"text\":\"caju - poti - guarani\"},{\"letter\":\"C\",\"text\":\"textil - moinho - aguentar\"},{\"letter\":\"D\",\"text\":\"teiu - Grajau -virus\"},{\"letter\":\"E\",\"text\":\"aldeia - taoismo - ruim\"}],\"answer\":\"D\",\"matter\":\"Ortografia\",\"content\":\"Ortografia\",\"specific\":\"Acentuação e grafia\",\"n\":13},{\"id\":\"pt-import-014\",\"level\":1,\"category\":\"Acentuação gráfica\",\"topic\":\"Acentuação gráfica\",\"stem\":\"Com relação às palavras abaixo, podemos afirmar que, de acordo com os padrões normativos:\\ncaráter – Júpiter – júnior\",\"options\":[{\"letter\":\"A\",\"text\":\"são todas proparoxítonas.\"},{\"letter\":\"B\",\"text\":\"todas mudam de significado ao passar para o plural.\"},{\"letter\":\"C\",\"text\":\"todas apresentam metafonia.\"},{\"letter\":\"D\",\"text\":\"todas mudam de sílaba tônica no plural.\"},{\"letter\":\"E\",\"text\":\"nenhuma possui marca de número.\"}],\"answer\":\"D\",\"matter\":\"Ortografia\",\"content\":\"Acentuação gráfica\",\"specific\":\"Acentuação gráfica\",\"n\":14},{\"id\":\"pt-import-015\",\"level\":1,\"category\":\"Ortografia\",\"topic\":\"Acentuação e grafia\",\"stem\":\"Assinale a alternativa em que todas as palavras foram acentuadas adequadamente.\",\"options\":[{\"letter\":\"A\",\"text\":\"O cajú já era alimento básico das populações autoctônes antes do descobrimento do Brasil e da chegada dos portugueses.\"},{\"letter\":\"B\",\"text\":\"O taoísmo é uma doutrina mística e filosófica formulada no século VI a.C. por Lao Tse.\"},{\"letter\":\"C\",\"text\":\"O júri condenou o réu a oito anos de prisão pelo homicidio do casal.\"},{\"letter\":\"D\",\"text\":\"A palavra bem-te-vi possui três hifens.\"},{\"letter\":\"E\",\"text\":\"Aquí no trabalho, sua austeridáde é percebida na rigidez de opiniões e habitos.\"}],\"answer\":\"D\",\"matter\":\"Ortografia\",\"content\":\"Ortografia\",\"specific\":\"Acentuação e grafia\",\"n\":15},{\"id\":\"pt-import-016\",\"level\":1,\"category\":\"Acentuação gráfica\",\"topic\":\"Acentuação gráfica\",\"stem\":\"Assinale a alternativa correta.\",\"options\":[{\"letter\":\"A\",\"text\":\"As palavras “papéis” e “herói” são acentuadas por serem oxítonas com hiato.\"},{\"letter\":\"B\",\"text\":\"As palavras “faísca” e “caído” são acentuadas por representarem a segunda vogal tônica de um hiato.\"},{\"letter\":\"C\",\"text\":\"As palavras “lírio” e “régua” são acentuadas porque terminam com ditongo oral tônico.\"},{\"letter\":\"D\",\"text\":\"As palavras “bíceps” e “fórceps” são acentuadas por serem proparoxítonas.\"},{\"letter\":\"E\",\"text\":\"As palavras “Piauí” e “teiú” são acentuadas por serem oxítonas com ditongos abertos.\"}],\"answer\":\"B\",\"matter\":\"Ortografia\",\"content\":\"Acentuação gráfica\",\"specific\":\"Acentuação gráfica\",\"n\":16},{\"id\":\"pt-import-017\",\"level\":1,\"category\":\"Acentuação gráfica\",\"topic\":\"Acentuação gráfica\",\"stem\":\"Assinale a alternativa em que as palavras são acentuadas por serem oxítonas com ditongos\\nabertos.\",\"options\":[{\"letter\":\"A\",\"text\":\"órgão – órfão\"},{\"letter\":\"B\",\"text\":\"anéis – heróis\"},{\"letter\":\"C\",\"text\":\"Piauí – teiú\"},{\"letter\":\"D\",\"text\":\"papéis – tuiuiú\"},{\"letter\":\"E\",\"text\":\"pontapés – carijós\"}],\"answer\":\"B\",\"matter\":\"Ortografia\",\"content\":\"Acentuação gráfica\",\"specific\":\"Acentuação gráfica\",\"n\":17},{\"id\":\"pt-import-018\",\"level\":1,\"category\":\"Acentuação gráfica\",\"topic\":\"Acentuação gráfica\",\"stem\":\"Leia o trecho abaixo.\\n“[...] o conhecimento do real, a ordenação das ideias, o domínio do gênero textual, a\\nintenção comunicativa...” (6º§)\\nAssinale a opção em que a palavra proposta deve ser acentuada por não seguir a\\nmesma regra de acentuação do termo em destaque no trecho.\",\"options\":[{\"letter\":\"A\",\"text\":\"Aldeia.\"},{\"letter\":\"B\",\"text\":\"Cheia.\"},{\"letter\":\"C\",\"text\":\"Conteiner\"},{\"letter\":\"D\",\"text\":\"Epopeico.\"},{\"letter\":\"E\",\"text\":\"Boleia.\"}],\"answer\":\"C\",\"matter\":\"Ortografia\",\"content\":\"Acentuação gráfica\",\"specific\":\"Acentuação gráfica\",\"n\":18},{\"id\":\"pt-import-019\",\"level\":1,\"category\":\"Ortografia\",\"topic\":\"Uso do hífen\",\"stem\":\"Leia o trecho a seguir.\\n“[...] um leque de marfim semiaberto comprimia-lhe os lábios rebeldes que queriam\\nexpandir-se num riso franco [...] (1º§)\\nDe acordo com as normas ortográficas vigentes, a palavra destacada foi corretamente\\nescrita. Marque a opção em que um dos vocábulos, ao contrário do trecho acima, está\\nescrito de forma INORRETA.\",\"options\":[{\"letter\":\"A\",\"text\":\"Contrassenha; autoescola.\"},{\"letter\":\"B\",\"text\":\"Ab-rupto; ab-rogar.\"},{\"letter\":\"C\",\"text\":\"Panmágico; micro-ondas.\"},{\"letter\":\"D\",\"text\":\"Vaga-lume; finca-pé.\"},{\"letter\":\"E\",\"text\":\"Cobra-d’água; feijão-verde.\"}],\"answer\":\"C\",\"matter\":\"Ortografia\",\"content\":\"Ortografia\",\"specific\":\"Uso do hífen\",\"n\":19},{\"id\":\"pt-import-020\",\"level\":1,\"category\":\"Ortografia\",\"topic\":\"Ortografia\",\"stem\":\"Observe o trecho a seguir.\\n \\n“Talvez aí, nessa hora, surja um voyeurismo que surpreenda o escritor, lá onde ele não se\\nadivinhava, quando pode se desconhecer em suas palavras, estas que saem de seu pobre\\nteatro do quotidiano e o espreitam, no chão mesmo da poesia, na sua letra, ao pé da letra.\\\"\\n(7º§)\\nO termo sublinhado possui uma variante ortográfica, que substitui o qu- inicial por um c-,\\npodendo, portanto, ser também escrito como \\\"cotidiano\\\", sem implicar qualquer mudança do\\nseu sentido original. Assinale a opção em que o termo apresentado também apresenta essa\\npropriedade.\",\"options\":[{\"letter\":\"A\",\"text\":\"Quartel.\"},{\"letter\":\"B\",\"text\":\"Quadrilha.\"},{\"letter\":\"C\",\"text\":\"Quadragésimo.\"},{\"letter\":\"D\",\"text\":\"Quatorze.\"},{\"letter\":\"E\",\"text\":\"Quaresma.\"}],\"answer\":\"D\",\"matter\":\"Ortografia\",\"content\":\"Ortografia\",\"specific\":\"Ortografia\",\"n\":20},{\"id\":\"pt-import-021\",\"level\":2,\"category\":\"Acentuação gráfica\",\"topic\":\"Acentuação e prosódia\",\"stem\":\"Assinale a opção em que os vocábulos são acentuados seguindo a mesma regra, de acordo\\ncom a gramática normativa.\",\"options\":[{\"letter\":\"A\",\"text\":\"éden – pólen – vinténs\"},{\"letter\":\"B\",\"text\":\"abará – Grajaú – carijó\"},{\"letter\":\"C\",\"text\":\"açúcar – éter – revólver\"},{\"letter\":\"D\",\"text\":\"amável – ágil – límpido\"},{\"letter\":\"E\",\"text\":\"também – médium – vírus\"}],\"answer\":\"C\",\"matter\":\"Ortografia\",\"content\":\"Acentuação gráfica\",\"specific\":\"Acentuação e prosódia\",\"n\":21},{\"id\":\"pt-import-022\",\"level\":2,\"category\":\"Acentuação gráfica\",\"topic\":\"Acentuação e prosódia\",\"stem\":\"Em qual dos trios de palavras abaixo, a acentuação se justifica pelas mesmas regras?\",\"options\":[{\"letter\":\"A\",\"text\":\"baú – cajá – avô\"},{\"letter\":\"B\",\"text\":\"cipó – órfão – jiló\"},{\"letter\":\"C\",\"text\":\"júri – cáqui – beribéri\"},{\"letter\":\"D\",\"text\":\"caráter – amável – saída\"},{\"letter\":\"E\",\"text\":\"cálido – fórceps – álbum\"}],\"answer\":\"C\",\"matter\":\"Ortografia\",\"content\":\"Acentuação gráfica\",\"specific\":\"Acentuação e prosódia\",\"n\":22},{\"id\":\"pt-import-023\",\"level\":2,\"category\":\"Acentuação gráfica\",\"topic\":\"Acentuação e prosódia\",\"stem\":\"Assinale a alternativa em que os vocábulos são acentuados seguindo a mesma regra, de\\nacordo com a gramática normativa.\",\"options\":[{\"letter\":\"A\",\"text\":\"cajá – ímãs – avó\"},{\"letter\":\"B\",\"text\":\"viúva – útil – júri\"},{\"letter\":\"C\",\"text\":\"vênus – você – Irecê\"},{\"letter\":\"D\",\"text\":\"saúde – viúva – Grajaú\"},{\"letter\":\"E\",\"text\":\"cátedra – cálido – fórceps\"}],\"answer\":\"D\",\"matter\":\"Ortografia\",\"content\":\"Acentuação gráfica\",\"specific\":\"Acentuação e prosódia\",\"n\":23},{\"id\":\"pt-import-024\",\"level\":2,\"category\":\"Fonética e Fonologia\",\"topic\":\"Ortoépia e prosódia\",\"stem\":\"Quanto à acentuação, analise as afirmativas abaixo e, a seguir, assinale a alternativa\\ncorreta.\\nI. são, sem, sob e com são monossílabos tônicos.\\nII. leucemia, pudico, inaudito, ibero e palato são vocábulos paroxítonos.\\nIII. ambrosia, hieróglifo, ortoepia e réptil são vocábulos que apresentam oscilação de\\npronúncia.\\nIV. Todas as palavras monossilábicas são oxítonas.\",\"options\":[{\"letter\":\"A\",\"text\":\"Somente I e II estão corretas.\"},{\"letter\":\"B\",\"text\":\"Somente I e IV estão corretas.\"},{\"letter\":\"C\",\"text\":\"Somente II e III estão corretas.\"},{\"letter\":\"D\",\"text\":\"Somente II e IV estão corretas.\"},{\"letter\":\"E\",\"text\":\"Somente III e IV estão corretas.\"}],\"answer\":\"C\",\"matter\":\"Fonética e fonologia\",\"content\":\"Fonética e fonologia\",\"specific\":\"Sílaba tônica\",\"n\":24},{\"id\":\"pt-import-025\",\"level\":2,\"category\":\"Acentuação gráfica\",\"topic\":\"Acentuação e prosódia\",\"stem\":\"Quanto à acentuação, assinale a alternativa correta.\",\"options\":[{\"letter\":\"A\",\"text\":\"\\\"Dom\\\", \\\"mas\\\", \\\"são\\\" são monossílabos tônicos.\"},{\"letter\":\"B\",\"text\":\"\\\"Ureter\\\", \\\"ruim\\\", \\\"sutil\\\" são palavras oxítonas.\"},{\"letter\":\"C\",\"text\":\"\\\"Vem\\\", \\\"muito\\\", \\\"boi\\\" apresentam ditongos orais.\"},{\"letter\":\"D\",\"text\":\"\\\"Ibero\\\", \\\"palato\\\", \\\"Gibraltar\\\" são palavras paroxítonas.\"},{\"letter\":\"E\",\"text\":\"\\\"Ciclope\\\", “policromo”, \\\"avaro\\\" são palavras proparoxítonas.\"}],\"answer\":\"B\",\"matter\":\"Ortografia\",\"content\":\"Acentuação gráfica\",\"specific\":\"Acentuação e prosódia\",\"n\":25},{\"id\":\"pt-import-026\",\"level\":2,\"category\":\"Fonética e Fonologia\",\"topic\":\"Prosódia\",\"stem\":\"As silabadas, ou erros de prosódia, são frequentes no uso da língua. Assinale a\\nalternativa onde não ocorre nenhuma silabada:\",\"options\":[{\"letter\":\"A\",\"text\":\"Eis aí um protótipo de rúbrica de um homem vaidoso.\"},{\"letter\":\"B\",\"text\":\"Para mim a humanidade está dividida em duas metades: a dos filântropos e a dos misântropos.\"},{\"letter\":\"C\",\"text\":\"Os arquétipos de iberos são mais pudicos que se pensa.\"},{\"letter\":\"D\",\"text\":\"Nesse ínterim chegou o médico com a contagem de leucócitos e o resultado da cultura de levêdos.\"},{\"letter\":\"E\",\"text\":\"Ávaro de informações, segui todas as pegadas do éfebo.\"}],\"answer\":\"C\",\"matter\":\"Fonética e fonologia\",\"content\":\"Fonética e fonologia\",\"specific\":\"Sílaba tônica\",\"n\":26},{\"id\":\"pt-import-027\",\"level\":2,\"category\":\"Fonética e Fonologia\",\"topic\":\"Tonicidade\",\"stem\":\"Assinale a alternativa em que todas as palavras são paroxítonas (foram omitidos os\\nacentos):\",\"options\":[{\"letter\":\"A\",\"text\":\"rubrica - avaro - pegada - acrobata\"},{\"letter\":\"B\",\"text\":\"mister - filantropo - misantropo - condor\"},{\"letter\":\"C\",\"text\":\"pegaso - prototipo - arquetipo - rubrica\"},{\"letter\":\"D\",\"text\":\"necromancia - quiromancia - ibero - nobel\"},{\"letter\" letter\":\"A\",\"text\":\"continue\"},{\"letter\":\"B\",\"text\":\"invólucro\"},{\"letter\":\"C\",\"text\":\"cadeado\"},{\"letter\":\"D\",\"text\":\"retribuí\"},{\"letter\":\"E\",\"text\":\"mercearia\"}],\"answer\":\"E\",\"matter\":\"Fonética e fonologia\",\"content\":\"Fonética e fonologia\",\"specific\":\"Separação silábica\",\"n\":48},{\"id\":\"pt-import-049\",\"level\":3,\"category\":\"Acentuação gráfica\",\"topic\":\"Acentuação gráfica\",\"stem\":\"Marque a alternativa cuja regra de\\nacentuação é a mesma da palavra países. (Obs.: algumas palavras tiveram seu acento retirado\\npropositadamente.)\",\"options\":[{\"letter\":\"A\",\"text\":\"ruim.\"},{\"letter\":\"B\",\"text\":\"raiz.\"},{\"letter\":\"C\",\"text\":\"juiz.\"},{\"letter\":\"D\",\"text\":\"index.\"},{\"letter\":\"E\",\"text\":\"juizas.\"}],\"answer\":\"E\",\"matter\":\"Ortografia\",\"content\":\"Acentuação gráfica\",\"specific\":\"Acentuação gráfica\",\"n\":49},{\"id\":\"pt-import-050\",\"level\":3,\"category\":\"Ortografia\",\"topic\":\"Grafia e emprego de palavras\",\"stem\":\"Dentre as palavras sugeridas nos\\nparênteses, escolha a que mais se adapta ao contexto e assinale a opção correta.\\n1) Concorri àquela vaga de emprego pela ________ do cargo. (descrição/discrição)\\n2) Uma boa leitura _______ com vantagem a companhia de pessoas frívolas.\\n(despensa/dispensa)\\n3) As portas pareciam ________ o som. (absolver/absorver)\\n \\n4) Aquele aluno não demonstrou _______ crítico em suas respostas. (censo/senso)\",\"options\":[{\"letter\":\"A\",\"text\":\"discrição – despensa – absorver – senso\"},{\"letter\":\"B\",\"text\":\"descrição – dispensa – absolver – censo\"},{\"letter\":\"C\",\"text\":\"descrição – despensa – absorver – senso\"},{\"letter\":\"D\",\"text\":\"discrição – despensa – absolver – censo\"},{\"letter\":\"E\",\"text\":\"descrição – dispensa – absorver – senso\"}],\"answer\":\"E\",\"matter\":\"Ortografia\",\"content\":\"Ortografia\",\"specific\":\"Grafia e emprego de palavras\",\"n\":50},{\"id\":\"pt-import-051\",\"level\":3,\"category\":\"Fonética e Fonologia\",\"topic\":\"Encontros vocálicos\",\"stem\":\"Assinale a única afirmativa incorreta no\\nvocábulo:\",\"options\":[{\"letter\":\"A\",\"text\":\"na palavra série há um ditongo oral crescente.\"},{\"letter\":\"B\",\"text\":\"na palavra muito há um ditongo nasal decrescente.\"},{\"letter\":\"C\",\"text\":\"na palavra gaiola há um tritongo.\"},{\"letter\":\"D\",\"text\":\"na palavra homem há um ditongo nasal decrescente.\"},{\"letter\":\"E\",\"text\":\"na palavra duelo há um hiato.\"}],\"answer\":\"C\",\"matter\":\"Fonética e fonologia\",\"content\":\"Fonética e fonologia\",\"specific\":\"Fonema\",\"n\":51},{\"id\":\"pt-import-052\",\"level\":3,\"category\":\"Fonética e Fonologia\",\"topic\":\"Dígrafos\",\"stem\":\"Assinale a alternativa em que se\\napresenta uma palavra com um dígrafo consonantal.\",\"options\":[{\"letter\":\"A\",\"text\":\"transpor.\"},{\"letter\":\"B\",\"text\":\"ptialina.\"},{\"letter\":\"C\",\"text\":\"Uruguai.\"},{\"letter\":\"D\",\"text\":\"Querer.\"},{\"letter\":\"E\",\"text\":\"Sequestro.\"}],\"answer\":\"D\",\"matter\":\"Fonética e fonologia\",\"content\":\"Fonética e fonologia\",\"specific\":\"Fonema\",\"n\":52},{\"id\":\"pt-import-053\",\"level\":3,\"category\":\"Fonética e Fonologia\",\"topic\":\"Classificação da sílaba tônica\",\"stem\":\"Assinale a opção em que o vocábulo\\ndifere dos demais pela classificação da sílaba tônica.\",\"options\":[{\"letter\":\"A\",\"text\":\"Funil.\"},{\"letter\":\"B\",\"text\":\"Nobel.\"},{\"letter\":\"C\",\"text\":\"Gibraltar.\"},{\"letter\":\"D\",\"text\":\"Ureter.\"},{\"letter\":\"E\",\"text\":\"Pudico.\"}],\"answer\":\"E\",\"matter\":\"Fonética e fonologia\",\"content\":\"Fonética e fonologia\",\"specific\":\"Sílaba tônica\",\"n\":53},{\"id\":\"pt-import-054\",\"level\":3,\"category\":\"Acentuação gráfica\",\"topic\":\"Acentuação gráfica\",\"stem\":\"Assinale a opção na qual a palavra foi\\nacentuada pela mesma regra da destacada em “Em vez de argumentar para a razão do telespectador,\\nela apela para as sensações, para as revelações mágicas mais impossíveis.”\",\"options\":[{\"letter\":\"A\",\"text\":\"fenômeno.\"},{\"letter\":\"B\",\"text\":\"órgão.\"},{\"letter\":\"C\",\"text\":\"construí-los.\"},{\"letter\":\"D\",\"text\":\"até.\"},{\"letter\":\"E\",\"text\":\"mágica.\"}],\"answer\":\"B\",\"matter\":\"Ortografia\",\"content\":\"Acentuação gráfica\",\"specific\":\"Acentuação gráfica\",\"n\":54},{\"id\":\"pt-import-055\",\"level\":3,\"category\":\"Fonética e Fonologia\",\"topic\":\"Mudança da sílaba tônica no plural\",\"stem\":\"Algumas palavras, em função da flexão\\npara o plural, têm a sua sílaba tônica deslocada. Ao colocarmos os vocábulos a seguir no plural, qual\\ndeles seria um exemplo desse fenômeno?\",\"options\":[{\"letter\":\"A\",\"text\":\"esforço.\"},{\"letter\":\"B\",\"text\":\"refrão.\"},{\"letter\":\"C\",\"text\":\"réptil.\"},{\"letter\":\"D\",\"text\":\"sênior.\"},{\"letter\":\"E\",\"text\":\"funil.\"}],\"answer\":\"D\",\"matter\":\"Fonética e fonologia\",\"content\":\"Fonética e fonologia\",\"specific\":\"Sílaba tônica\",\"n\":55},{\"id\":\"pt-import-056\",\"level\":3,\"category\":\"Acentuação gráfica\",\"topic\":\"Acentuação gráfica\",\"stem\":\"Segundo o Acordo\\nOrtográfico vigente, mantém-se a acentuação gráfica do ditongo aberto em alguns casos, como em\\n“herói”. O mesmo ocorre em:\\nObs.: em algumas palavras, o acento foi retirado.\",\"options\":[{\"letter\":\"A\",\"text\":\"abençoo.\"},{\"letter\":\"B\",\"text\":\"heroico.\"},{\"letter\":\"C\",\"text\":\"fieis.\"},{\"letter\":\"D\",\"text\":\"epopeia.\"},{\"letter\":\"E\",\"text\":\"joia.\"}],\"answer\":\"C\",\"matter\":\"Ortografia\",\"content\":\"Acentuação gráfica\",\"specific\":\"Acentuação gráfica\",\"n\":56},{\"id\":\"pt-import-057\",\"level\":3,\"category\":\"Fonética e Fonologia\",\"topic\":\"Classificação da sílaba tônica\",\"stem\":\"Considerando-se a\\nacentuação da sílaba tônica, os vocábulos ibero, rubrica, e interim podem ser classificados, correta\\ne respectivamente, como:\\nObs.: Os acentos podem ter sido omitidos, nas palavras.\",\"options\":[{\"letter\":\"A\",\"text\":\"Oxítona, proparoxítona e proparoxítona.\"},{\"letter\":\"B\",\"text\":\"Paroxítona, proparoxítona e proparoxítona.\"},{\"letter\":\"C\",\"text\":\"Paroxítona, paroxítona e proparoxítona.\"},{\"letter\":\"D\",\"text\":\"Oxítona, proparoxítona e paroxítona.\"},{\"letter\":\"E\",\"text\":\"Oxítona, paroxítona e proparoxítona.\"}],\"answer\":\"C\",\"matter\":\"Fonética e fonologia\",\"content\":\"Fonética e fonologia\",\"specific\":\"Sílaba tônica\",\"n\":57},{\"id\":\"pt-import-058\",\"level\":3,\"category\":\"Ortografia\",\"topic\":\"Uso do hífen\",\"stem\":\"Segundo a convenção ortográfica\\natual, não se emprega o hífen em autoescola. Aponte a alternativa em que a palavra esteja\\ncorretamente grafada, com ou sem hífen.\",\"options\":[{\"letter\":\"A\",\"text\":\"auto-retrato\"},{\"letter\":\"B\",\"text\":\"infrahepático\"},{\"letter\":\"C\",\"text\":\"intra-venoso\"},{\"letter\":\"D\",\"text\":\"proto-evangelho\"},{\"letter\":\"E\",\"text\":\"subchefe\"}],\"answer\":\"E\",\"matter\":\"Ortografia\",\"content\":\"Ortografia\",\"specific\":\"Uso do hífen\",\"n\":58},{\"id\":\"pt-import-059\",\"level\":3,\"category\":\"Acentuação gráfica\",\"topic\":\"Acentuação gráfica\",\"stem\":\"Assinale a alternativa em que os\\nvocábulos estejam acentuados pela mesma razão.\",\"options\":[{\"letter\":\"A\",\"text\":\"também, álbum\"},{\"letter\":\"B\",\"text\":\"matemática, táxi\"},{\"letter\":\"C\",\"text\":\"parabéns, hífen\"},{\"letter\":\"D\",\"text\":\"júri, raízes\"},{\"letter\":\"E\",\"text\":\"troféu, remói\"}],\"answer\":\"E\",\"matter\":\"Ortografia\",\"content\":\"Acentuação gráfica\",\"specific\":\"Acentuação gráfica\",\"n\":59},{\"id\":\"pt-import-060\",\"level\":3,\"category\":\"Acentuação gráfica\",\"topic\":\"Acentuação gráfica\",\"stem\":\"Assinale a opção em que todos os\\nvocábulos set.id=q.id;card.dataset.subject=\"Português\";\n const meta=document.createElement(\"div\");meta.className=\"meta\";\n [\"Questão \"+q.n,\"Nível \"+q.level,q.matter,q.content,q.specific].forEach(v=>{const tag=document.createElement(\"span\");tag.className=\"tag\";tag.textContent=v;meta.appendChild(tag)});\n const stem=document.createElement(\"p\");stem.className=\"stem\";stem.textContent=q.stem;\n const choices=document.createElement(\"div\");choices.className=\"choices\";\n q.options.forEach(o=>{const btn=document.createElement(\"button\");btn.type=\"button\";btn.className=\"alt\";btn.dataset.a=o.letter;btn.textContent=o.letter+\") \"+o.text;btn.addEventListener(\"click\",()=>{\n   if(card.dataset.answered===\"1\")return;\n   card.dataset.answered=\"1\";\n   choices.querySelectorAll(\"button\").forEach(x=>{x.disabled=true;if(x.dataset.a===q.answer)x.classList.add(\"correct\");else if(x===btn)x.classList.add(\"wrong\")});\n   const feedback=document.createElement(\"p\");feedback.className=\"answerline\";feedback.textContent=\"R: \"+q.answer;card.appendChild(feedback);\n });choices.appendChild(btn)});\n card.append(meta,stem,choices);fragment.appendChild(card);\n});\nif(first&&first.parentNode)host.insertBefore(fragment,first);else host.appendChild(fragment);\nfunction applyImportedFilter(f){\n const content=norm(f.content)===\"fonemas e encontros\"?\"\":norm(f.content);\n const wanted=[norm(f.subject),norm(f.matter),content,norm(f.specific)];\n QUESTIONS.forEach(q=>{\n  const card=document.querySelector('.card[data-id=\"'+q.id+'\"]');\n  if(!card)return;\n  const fields=[\"portugues\",norm(q.matter),norm(q.content),norm(q.specific)];\n  card.style.display=wanted.every((v,i)=>!v||fields[i]===v)?\"\":\"none\";\n });\n const visible=[...document.querySelectorAll(\".card[data-id]\")].filter(card=>getComputedStyle(card).display!==\"none\").length;\n document.querySelectorAll(\"body *\").forEach(el=>{if(el.children.length===0){const t=(el.textContent||\"\").trim();if(/^\
