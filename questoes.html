<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Banco de Questões · EEAR</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0a0a0a;color:#fff;font:14px/1.5 system-ui,Arial,sans-serif}
#status{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:24px;color:#fff;background:#0a0a0a;z-index:2}
#status strong{font-size:17px;margin-bottom:8px}#status small{color:#aaa}
#bar{height:6px;background:#282828;border-radius:99px;overflow:hidden;margin:16px auto;width:min(320px,80vw)}
#bar i{display:block;height:100%;width:0;background:#4ade80;transition:width .2s}
#retry{display:none;margin:14px auto 0;padding:10px 18px;border:1px solid #555;border-radius:10px;background:#171717;color:#fff;font-weight:700}
body{position:relative;overflow:hidden}
#bank{display:none;position:absolute;inset:0;width:100%;height:100%;min-height:0;border:0;background:#fff}


html,body,#status{background:radial-gradient(60% 50% at 50% 0%,#161616,#020202) fixed;color:#fafafa;font-family:Inter,-apple-system,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#bar{background:rgba(255,255,255,.10);border-radius:99px}
#retry{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);border-radius:13px}

</style>
</head>
<body>
<div id="status"><strong>Preparando o banco completo de questões…</strong><span id="detail">Aguarde enquanto os arquivos são carregados.</span><div id="bar"><i id="progress"></i></div><small>O download inicial pode demorar por causa das imagens originais.</small><button id="retry" type="button">Tentar novamente</button></div>
<iframe id="bank" title="Banco completo de questões EEAR"></iframe>
<script>
(function(){
  "use strict";
  const TOTAL=9;
  const status=document.getElementById("status");
  const detail=document.getElementById("detail");
  const progress=document.getElementById("progress");
  const retry=document.getElementById("retry");
  const bank=document.getElementById("bank");
  let activeTheme=(function(){try{return localStorage.getItem("app-theme-evolucao")==="light"?"light":"dark"}catch(e){return "dark"}})();
  function hideInnerThemeControls(doc){
    if(!doc)return;
    const iconOnly=/^(☾|☽|🌙|☀|☀️|🌞)$/;
    doc.querySelectorAll("button,[role='button']").forEach(function(el){
      const label=[el.textContent,el.getAttribute("aria-label"),el.getAttribute("title"),el.getAttribute("data-theme")].filter(Boolean).join(" ").trim();
      if(/^(tema claro|tema escuro|alternar tema|mudar tema|modo claro|modo escuro|theme|dark mode|light mode)$/i.test(label)||iconOnly.test(label)){
        el.style.setProperty("display","none","important");el.setAttribute("aria-hidden","true");
      }
    });
  }
  function applyQuestionTheme(theme){
    activeTheme=theme==="light"?"light":"dark";
    document.documentElement.setAttribute("data-theme",activeTheme);
    let outer=document.getElementById("eear-outer-theme");
    if(!outer){outer=document.createElement("style");outer.id="eear-outer-theme";document.head.appendChild(outer);}
    outer.textContent=activeTheme==="light"
      ? "html,body,#status{background:#f5f5f5!important;color:#111!important}#status small{color:#555!important}#retry{background:#fff!important;color:#111!important;border-color:#ccc!important}#bar{background:#ddd!important}"
      : "html,body,#status{background:radial-gradient(60% 50% at 50% 0%,#161616,#020202) fixed!important;color:#fafafa!important}#status small{color:#aaa!important}#retry{background:rgba(255,255,255,.07)!important;color:#fff!important;border-color:rgba(255,255,255,.14)!important}#bar{background:rgba(255,255,255,.10)!important}";
    try{
      const doc=bank.contentDocument;if(!doc||!doc.head)return;
      let style=doc.getElementById("eear-bank-theme");
      if(!style){style=doc.createElement("style");style.id="eear-bank-theme";doc.head.appendChild(style);}
      style.textContent=activeTheme==="light" ? `
        :root{color-scheme:light!important}
        html,body{background:#f5f5f5!important;color:#111!important}
        .card[data-id]{background:#fff!important;color:#111!important;border-color:#d5d5d5!important;box-shadow:0 5px 18px rgba(0,0,0,.07)!important}
        .card[data-id] p,.card[data-id] .question-text,.card[data-id] .enunciado{color:#111!important}
        .card[data-id] .alt[data-a]{background:#f1f1f1!important;color:#111!important;border-color:#d0d0d0!important}
        .card[data-id] img,.card[data-id] svg,.card[data-id] canvas{filter:none!important}
      ` : `
        :root{color-scheme:dark!important}
        html,body{background:#080808!important;color:#f5f5f5!important}
        .card[data-id]{background:#141414!important;color:#f5f5f5!important;border-color:#383838!important;box-shadow:0 8px 24px rgba(0,0,0,.22)!important}
        .card[data-id] p,.card[data-id] .question-text,.card[data-id] .enunciado{color:#f5f5f5!important}
        .card[data-id] .alt[data-a]{background:#202020!important;color:#f5f5f5!important;border-color:#484848!important}
        .card[data-id] img,.card[data-id] svg,.card[data-id] canvas{filter:none!important}
      `;
      hideInnerThemeControls(doc);
    }catch(e){}
  }
  window.addEventListener("message",function(event){if(event.data&&event.data.type==="app-theme-change")applyQuestionTheme(event.data.theme);});
  window.addEventListener("message",function(event){if(event.source===window.parent&&event.data&&event.data.type==="app-question-filter"&&bank.contentWindow)bank.contentWindow.postMessage(event.data,"*")});
  window.addEventListener("message",function(event){
    if(event.source===bank.contentWindow&&event.data&&event.data.type&&
       (event.data.type==="eear-question-attempt"||event.data.type==="eear-question-taxonomy"||event.data.type==="eear-question-taxonomy-full")){
      window.parent.postMessage(event.data,"*");
    }
  });
  function openBankCache(){return new Promise(function(resolve){if(!window.indexedDB)return resolve(null);const request=indexedDB.open("meu-app-estudos-question-bank",1);request.onupgradeneeded=function(){if(!request.result.objectStoreNames.contains("cache"))request.result.createObjectStore("cache")};request.onsuccess=function(){resolve(request.result)};request.onerror=function(){resolve(null)}})}
  function bankCacheKey(){return new URL("__eear_question_bank_cache_v1.html",location.href).href}
  async function readCachedBank(){try{if(window.caches){const cache=await caches.open("eear-question-bank-cache-v1"),response=await cache.match(bankCacheKey());if(response){const blob=await response.blob();if(blob.size>=1000000)return blob}}}catch(e){}const db=await openBankCache();if(!db)return null;return new Promise(function(resolve){try{const request=db.transaction("cache","readonly").objectStore("cache").get("bank-html-v1");request.onsuccess=function(){const blob=request.result instanceof Blob&&request.result.size>=1000000?request.result:null;resolve(blob)};request.onerror=function(){resolve(null)}}catch(e){resolve(null)}finally{db.close()}})}
  async function writeCachedBank(blob){try{if(window.caches){const cache=await caches.open("eear-question-bank-cache-v1");await cache.put(bankCacheKey(),new Response(blob,{headers:{"Content-Type":"text/html;charset=utf-8"}}))}}catch(e){console.warn("Cache API não conseguiu guardar o banco:",e)}const db=await openBankCache();if(!db)return;await new Promise(function(resolve){try{const tx=db.transaction("cache","readwrite");tx.objectStore("cache").put(blob,"bank-html-v1");tx.oncomplete=resolve;tx.onerror=resolve;tx.onabort=resolve}catch(e){resolve()}});db.close()}
  async function start(){
    retry.style.display="none";
    bank.style.display="none";
    status.style.display="grid";
    detail.textContent="Verificando banco salvo neste dispositivo…";
    let writer=null;
    try{
      let blob=await readCachedBank();
      if(!blob){
        detail.textContent="Primeiro carregamento: preparando banco de questões…";
        if(typeof DecompressionStream==="undefined")throw new Error("Este navegador não oferece suporte à descompactação necessária. Atualize o Chrome ou Edge.");
        const ds=new DecompressionStream("gzip");
        writer=ds.writable.getWriter();
        const blobPromise=new Response(ds.readable).blob();
        const BATCH=3;
        for(let start=1;start<=TOTAL;start+=BATCH){
          const end=Math.min(start+BATCH-1,TOTAL);
          detail.textContent="Carregando arquivos "+start+"–"+end+" de "+TOTAL+" em paralelo…";
          const files=await Promise.all(Array.from({length:end-start+1},async function(_,offset){
            const i=start+offset,name="questoes-banco-"+String(i).padStart(2,"0")+".gz";
            const response=await fetch("banco-questoes/"+name);
            if(!response.ok)throw new Error("Não foi possível carregar "+name+" (HTTP "+response.status+").");
            return new Uint8Array(await response.arrayBuffer());
          }));
          for(let offset=0;offset<files.length;offset++){
            await writer.write(files[offset]);
            const done=start+offset;
            progress.style.width=(done/TOTAL*100)+"%";
          }
        }
        await writer.close();
        blob=await blobPromise;
        if(blob.size<1000000)throw new Error("O banco descompactado parece incompleto.");
        detail.textContent="Salvando banco para abrir mais rápido nas próximas vezes…";
        await writeCachedBank(blob);
      }
      progress.style.width="100%";
      bank.onload=async function(){
        status.style.display="none";
        bank.style.display="block";
        try{

          const targetDoc=bank.contentDocument;
          const bridgeScript=targetDoc.createElement("script");
          bridgeScript.textContent="("+function(){
            "use strict";
            function emit(source,id,subject,topic,picked,correct){
              if(!id||!subject||!picked||typeof correct!=="boolean")return;
              const now=new Date();
              const date=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
              const eventId=source+":"+id+":"+Date.now()+":"+Math.random().toString(36).slice(2);
              window.parent.postMessage({type:"eear-question-attempt",attempt:{
                source:source,questionId:String(id),eventId:eventId,subject:String(subject),
                topic:String(topic||"Geral"),picked:String(picked),correct:correct,date:date
              }},"*");
            }
            const rawBank=(typeof B!=="undefined"&&B)||window.__eearBridgeQ||{};
            const taxonomy={},hierarchy={};
            Object.keys(rawBank).forEach(function(id){const q=rawBank[id];if(!q||typeof q!=="object")return;const d=String(q.d||q.discipline||q.subject||"").trim();if(!d)return;const m=String(q.m||q.matter||q.area||"Geral").trim()||"Geral",c=String(q.s||q.content||q.topic||"Geral").trim()||"Geral",u=String(q.u||q.subtopic||q.detail||"Geral").trim()||"Geral",t=String(q.u||q.s||q.m||q.topic||"Geral").trim()||"Geral";if(!taxonomy[d])taxonomy[d]=[];if(!taxonomy[d].includes(t))taxonomy[d].push(t);if(!hierarchy[d])hierarchy[d]={};if(!hierarchy[d][m])hierarchy[d][m]={};if(!hierarchy[d][m][c])hierarchy[d][m][c]=[];if(!hierarchy[d][m][c].includes(u))hierarchy[d][m][c].push(u)});
            function sortTree(o){Object.keys(o).forEach(k=>Array.isArray(o[k])?o[k].sort((a,b)=>a.localeCompare(b,"pt-BR")):sortTree(o[k]))}
            Object.keys(taxonomy).forEach(n=>taxonomy[n].sort((a,b)=>a.localeCompare(b,"pt-BR")));sortTree(hierarchy);
            window.parent.postMessage({type:"eear-question-taxonomy",taxonomy:taxonomy},"*");window.parent.postMessage({type:"eear-question-taxonomy-full",hierarchy:hierarchy},"*");
            fetch("https://doiserrer1895-dotcom.github.io/meu-app-estudos/banco-questoes/classificacao-600-questoes.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("taxonomy");return r.json()}).then(data=>{
              const grouped={},flat={};
              (data.subjects||[]).forEach(subject=>{
                grouped[subject.name]={};flat[subject.name]=[];
                (subject.areas||[]).forEach(area=>{
                  const contents={};
                  (area.topics||[]).forEach(item=>{const label=item[0];contents[label]=[]});
                  grouped[subject.name][area.name]=contents;
                  flat[subject.name].push(area.name);
                });
              });
              window.parent.postMessage({type:"eear-question-taxonomy",taxonomy:flat},"*");
              window.parent.postMessage({type:"eear-question-taxonomy-full",hierarchy:grouped},"*");
            }).catch(()=>{});
            function applyLinkedFilter(f){document.querySelectorAll(".card[data-id]").forEach(card=>{const q=rawBank[card.dataset.id]||{},norm=v=>String(v||"").normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").trim().toLowerCase(),fields=[q.d||q.discipline||q.subject,q.m||q.matter||q.area,q.s||q.content||q.topic,q.u||q.subtopic||q.detail].map(norm),wanted=[f.subject,f.matter,f.content,f.specific].map(norm);card.style.display=wanted.every((v,i)=>!v||fields[i]===v)?"":"none"})}
            window.addEventListener("message",ev=>{if(ev.data&&ev.data.type==="app-question-filter"){window.__appQuestionFilter=ev.data.filter||{};applyLinkedFilter(window.__appQuestionFilter)}});
            try{new MutationObserver(()=>{if(window.__appQuestionFilter)applyLinkedFilter(window.__appQuestionFilter)}).observe(document.body,{childList:true,subtree:true})}catch(e){}
            document.addEventListener("click",function(event){
              const bankAnswer=event.target.closest&&event.target.closest(".alt[data-a]");
              if(bankAnswer){
                const card=bankAnswer.closest(".card");
                if(!card)return;
                const id=card.dataset.id,q=window.__eearBridgeQ&&window.__eearBridgeQ[id];
                const question=(typeof B!=="undefined"&&B[id])||q;
                const picked=(typeof ans!=="undefined"&&ans[id])||bankAnswer.dataset.a;
                if(!question||question.open||!question.r||question.r==="ANULADA")return;
                const accepted=question.legacy_d==="Física 2"?[question.r,question.r2].filter(Boolean):[question.r];
                emit("banco",id,question.d,question.u||question.s||question.m,picked,accepted.includes(picked));
                return;
              }
              const examAnswer=event.target.closest&&event.target.closest("[data-exam-answer]");
              if(examAnswer){
                const card=examAnswer.closest("[data-exam-q]");
                if(!card||typeof provaState==="undefined"||typeof PROVAS_DATA==="undefined")return;
                const number=Number(card.dataset.examQ),exam=PROVAS_DATA[provaState.exam];
                const question=exam&&exam.questions.find(item=>Number(item.n)===number);
                const picked=provaState.answers[provaState.exam+"_"+number];
                if(!question||!picked||question.a==="ANULADA")return;
                emit("prova",provaState.exam+"_q"+number,question.s,exam.title,picked,picked===question.a);
                return;
              }
              const simAnswer=event.target.closest&&event.target.closest("[data-sim-answer]");
              if(simAnswer){
                const card=simAnswer.closest("[data-sim-q]");
                if(!card||typeof simState==="undefined"||typeof SIMULADOS_DATA==="undefined")return;
                const parts=card.dataset.simQ.split("_"),subject=parts[0],number=Number(parts[1]);
                const questions=SIMULADOS_DATA[simState.exam]&&SIMULADOS_DATA[simState.exam][subject];
                const question=questions&&questions.find(item=>Number(item.n)===number);
                const picked=simState.answers[simState.exam+"_"+subject+"_"+number];
                if(!question||!picked)return;
                const year=simState.exam==="s1"?"2021.1":"2021.2";
                emit("simulado",simState.exam+"_"+subject+"_q"+number,subject,"Simulado "+year,picked,picked===question.a);
              }
            },false);
          }.toString()+")();";

          targetDoc.body.appendChild(bridgeScript);

          // Ajustes visuais exclusivos do Banco de Questões: largura mais confortável,
          // maior área vertical para leitura e paleta estritamente neutra.
          const bankVisualStyle = targetDoc.createElement("style");
          bankVisualStyle.id = "eear-bank-visual-adjustments";
          bankVisualStyle.textContent = `
            :root { color-scheme: dark; }
            html, body {
              background: #080808 !important;
              color: #f5f5f5 !important;
              accent-color: #f5f5f5 !important;
            }
            body {
              background-image: none !important;
            }
            .card[data-id] {
              width: 100% !important;
              max-width: none !important;
              min-height: 190px !important;
              height: auto !important;
              margin: 0 0 24px !important;
              padding: 30px !important;
              box-sizing: border-box !important;
              background: #141414 !important;
              color: #f5f5f5 !important;
              border: 1px solid #383838 !important;
              border-radius: 14px !important;
              box-shadow: 0 8px 24px rgba(0,0,0,.22) !important;
            }
            .card[data-id] p,
            .card[data-id] .question-text,
            .card[data-id] .enunciado {
              color: #f5f5f5 !important;
              font-size: 16px !important;
              line-height: 1.7 !important;
            }
            .card[data-id] .alt[data-a] {
              display: block !important;
              width: 100% !important;
              min-height: 48px !important;
              height: auto !important;
              margin: 10px 0 !important;
              padding: 12px 16px !important;
              box-sizing: border-box !important;
              color: #f5f5f5 !important;
              background: #202020 !important;
              border: 1px solid #484848 !important;
              border-radius: 10px !important;
              line-height: 1.55 !important;
              text-align: left !important;
            }
            .card[data-id] img,
            .card[data-id] svg,
            .card[data-id] canvas {
              max-width: 100% !important;
              max-height: 420px !important;
              object-fit: contain !important;
            }
            .card[data-id] * {
              --primary: #f5f5f5 !important;
              --accent: #f5f5f5 !important;
              --brand: #f5f5f5 !important;
            }
            @media (min-width: 1100px) {
              .card[data-id] { padding: 30px !important; }
              .card[data-id] p,
              .card[data-id] .question-text,
              .card[data-id] .enunciado { font-size: 17px !important; }
            }
            @media (max-width: 700px) {
              .card[data-id] {
                width: 100% !important;
                max-width: none !important;
                min-height: 0 !important;
                padding: 18px !important;
                margin-bottom: 16px !important;
              }
            }
          `;
          targetDoc.head.appendChild(bankVisualStyle);
          applyQuestionTheme(activeTheme);
          try{new MutationObserver(function(){hideInnerThemeControls(targetDoc)}).observe(targetDoc.body,{childList:true,subtree:true})}catch(e){}
        }catch(bridgeError){
          console.error("Não foi possível ativar a integração de desempenho do banco EEAR:",bridgeError);
        }
      };
      bank.src=URL.createObjectURL(new Blob([blob],{type:"text/html;charset=utf-8"}));
    }catch(error){
      if(writer)try{await writer.abort(error)}catch(_){}
      throw error;
    }
  }
  retry.addEventListener("click",function(){start().catch(fail)});
  function fail(error){
    detail.textContent=error&&error.message?error.message:String(error);
    progress.style.width="0";
    retry.style.display="inline-block";
  }
  start().catch(fail);
})();
</script>
</body>
</html>
