<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Banco de Questões · EEAR</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0a0a0a;color:#fff;font:14px/1.5 system-ui,Arial,sans-serif}
#status{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:24px;color:#fff;background:#0a0a0a;z-index:2}
#status strong{font-size:17px;margin-bottom:8px}#status small{color:#aaa}
#bar{height:6px;background:#282828;border-radius:99px;overflow:hidden;margin:16px auto;width:min(320px,80vw)}
#bar i{display:block;height:100%;width:0;background:#4ade80;transition:width .2s}
#retry{display:none;margin:14px auto 0;padding:10px 18px;border:1px solid #555;border-radius:10px;background:#171717;color:#fff;font-weight:700}
#bank{display:none;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<div id="status"><strong>Preparando o banco completo de questões…</strong><span id="detail">Aguarde enquanto os arquivos são carregados.</span><div id="bar"><i id="progress"></i></div><small>O download inicial pode demorar por causa das imagens originais.</small><button id="retry" type="button">Tentar novamente</button></div>
<iframe id="bank" title="Banco completo de questões EEAR"></iframe>
<script>
(function(){
  "use strict";
  const TOTAL=9;
  const status=document.getElementById("status");
  const detail=document.getElementById("detail");
  const progress=document.getElementById("progress");
  const retry=document.getElementById("retry");
  const bank=document.getElementById("bank");
  window.addEventListener("message",function(event){
    if(event.source===bank.contentWindow&&event.data&&event.data.type==="eear-question-attempt"){
      window.parent.postMessage(event.data,"*");
    }
  });
  async function start(){
    retry.style.display="none";
    bank.style.display="none";
    status.style.display="grid";
    detail.textContent="Verificando suporte à descompactação…";
    if(typeof DecompressionStream==="undefined"){
      throw new Error("Este navegador não oferece suporte à descompactação necessária. Atualize o Chrome ou Edge.");
    }
    const ds=new DecompressionStream("gzip");
    const writer=ds.writable.getWriter();
    const blobPromise=new Response(ds.readable).blob();
    try{
      for(let i=1;i<=TOTAL;i++){
        detail.textContent="Carregando arquivo "+i+" de "+TOTAL+"…";
        const name="questoes-banco-"+String(i).padStart(2,"0")+".gz";
        const response=await fetch(name);
        if(!response.ok)throw new Error("Não foi possível carregar "+name+" (HTTP "+response.status+").");
        await writer.write(new Uint8Array(await response.arrayBuffer()));
        progress.style.width=(i/TOTAL*100)+"%";
      }
      await writer.close();
      const blob=await blobPromise;
      if(blob.size<1000000)throw new Error("O banco descompactado parece incompleto.");
      bank.onload=function(){
        status.style.display="none";
        bank.style.display="block";
      };
      bank.src=URL.createObjectURL(new Blob([blob],{type:"text/html;charset=utf-8"}));
    }catch(error){
      try{await writer.abort(error)}catch(_){}
      throw error;
    }
  }
  retry.addEventListener("click",function(){start().catch(fail)});
  function fail(error){
    detail.textContent=error&&error.message?error.message:String(error);
    progress.style.width="0";
    retry.style.display="inline-block";
  }
  start().catch(fail);
})();
</script>
</body>
</html>
