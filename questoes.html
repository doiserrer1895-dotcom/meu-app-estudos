<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Banco de Questões · EEAR</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0a0a0a;color:#fff;font:14px/1.5 system-ui,Arial,sans-serif}
#status{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:24px;color:#fff;background:#0a0a0a;z-index:2}
#status strong{font-size:17px;margin-bottom:8px}#status small{color:#aaa}
#bar{height:6px;background:#282828;border-radius:99px;overflow:hidden;margin:16px auto;width:min(320px,80vw)}
#bar i{display:block;height:100%;width:0;background:#4ade80;transition:width .2s}
#retry{display:none;margin:14px auto 0;padding:10px 18px;border:1px solid #555;border-radius:10px;background:#171717;color:#fff;font-weight:700}
body{position:relative;overflow:hidden}
#bank{display:none;position:absolute;inset:0;width:100%;height:100%;min-height:0;border:0;background:#fff}


html,body,#status{background:radial-gradient(60% 50% at 50% 0%,#161616,#020202) fixed;color:#fafafa;font-family:Inter,-apple-system,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#bar{background:rgba(255,255,255,.10);border-radius:99px}
#retry{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);border-radius:13px}


#export-bank{display:none;position:fixed;right:12px;top:12px;z-index:10;padding:9px 13px;border:1px solid #4ade80;border-radius:10px;background:#101810;color:#d1fae5;font:700 12px system-ui;box-shadow:0 4px 18px #0008;cursor:pointer}#export-bank:disabled{opacity:.65;cursor:wait}
</style>
</head>
<body>
<div id="status"><strong>Preparando o banco completo de questões…</strong><span id="detail">Aguarde enquanto os arquivos são carregados.</span><div id="bar"><i id="progress"></i></div><small>O download inicial pode demorar por causa das imagens originais.</small><button id="retry" type="button">Tentar novamente</button></div>
<iframe id="bank" title="Banco completo de questões EEAR"></iframe>
<button id="export-bank" type="button">Exportar banco para edição</button>
<script>
(function(){
  "use strict";
  const TOTAL=13;
  const status=document.getElementById("status");
  const detail=document.getElementById("detail");
  const progress=document.getElementById("progress");
  const retry=document.getElementById("retry");
  const bank=document.getElementById("bank");
  const exportBank=document.getElementById("export-bank");
  let activeTheme=(function(){try{return localStorage.getItem("app-theme-evolucao")==="light"?"light":"dark"}catch(e){return "dark"}})();
  function hideInnerThemeControls(doc){
    if(!doc)return;
    const iconOnly=/^(☾|☽|🌙|☀|☀️|🌞)$/;
    doc.querySelectorAll("button,[role='button']").forEach(function(el){
      const label=[el.textContent,el.getAttribute("aria-label"),el.getAttribute("title"),el.getAttribute("data-theme")].filter(Boolean).join(" ").trim();
      if(/^(tema claro|tema escuro|alternar tema|mudar tema|modo claro|modo escuro|theme|dark mode|light mode)$/i.test(label)||iconOnly.test(label)){
        el.style.setProperty("display","none","important");el.setAttribute("aria-hidden","true");
      }
    });
  }
  function applyQuestionTheme(theme){
    activeTheme=theme==="light"?"light":"dark";
    document.documentElement.setAttribute("data-theme",activeTheme);
    let outer=document.getElementById("eear-outer-theme");
    if(!outer){outer=document.createElement("style");outer.id="eear-outer-theme";document.head.appendChild(outer);}
    outer.textContent=activeTheme==="light"
      ? "html,body,#status{background:#f5f5f5!important;color:#111!important}#status small{color:#555!important}#retry{background:#fff!important;color:#111!important;border-color:#ccc!important}#bar{background:#ddd!important}"
      : "html,body,#status{background:radial-gradient(60% 50% at 50% 0%,#161616,#020202) fixed!important;color:#fafafa!important}#status small{color:#aaa!important}#retry{background:rgba(255,255,255,.07)!important;color:#fff!important;border-color:rgba(255,255,255,.14)!important}#bar{background:rgba(255,255,255,.10)!important}";
    try{
      const doc=bank.contentDocument;if(!doc||!doc.head)return;
      let style=doc.getElementById("eear-bank-theme");
      if(!style){style=doc.createElement("style");style.id="eear-bank-theme";doc.head.appendChild(style);}
      style.textContent=activeTheme==="light" ? `
        :root{color-scheme:light!important}
        html,body{background:#f5f5f5!important;color:#111!important}
        .card[data-id]{background:#fff!important;color:#111!important;border-color:#d5d5d5!important;box-shadow:0 5px 18px rgba(0,0,0,.07)!important}
        .card[data-id] p,.card[data-id] .question-text,.card[data-id] .enunciado{color:#111!important}
        .card[data-id] .alt[data-a]{background:#f1f1f1!important;color:#111!important;border-color:#d0d0d0!important}
        .card[data-id] img,.card[data-id] svg,.card[data-id] canvas{filter:none!important}
      ` : `
        :root{color-scheme:dark!important}
        html,body{background:#080808!important;color:#f5f5f5!important}
        .card[data-id]{background:#141414!important;color:#f5f5f5!important;border-color:#383838!important;box-shadow:0 8px 24px rgba(0,0,0,.22)!important}
        .card[data-id] p,.card[data-id] .question-text,.card[data-id] .enunciado{color:#f5f5f5!important}
        .card[data-id] .alt[data-a]{background:#202020!important;color:#f5f5f5!important;border-color:#484848!important}
        .card[data-id] img,.card[data-id] svg,.card[data-id] canvas{filter:none!important}
      `;
      hideInnerThemeControls(doc);
    }catch(e){}
  }
  window.addEventListener("message",function(event){if(event.data&&event.data.type==="app-theme-change")applyQuestionTheme(event.data.theme);});
  window.addEventListener("message",function(event){if(event.source===window.parent&&event.data&&event.data.type==="app-question-filter"&&bank.contentWindow)bank.contentWindow.postMessage(event.data,"*")});
  window.addEventListener("message",function(event){
    if(event.source===bank.contentWindow&&event.data&&event.data.type&&
       (event.data.type==="eear-question-attempt"||event.data.type==="eear-question-taxonomy"||event.data.type==="eear-question-taxonomy-full")){
      window.parent.postMessage(event.data,"*");
    }
  });
  function openBankCache(){return new Promise(function(resolve){if(!window.indexedDB)return resolve(null);const request=indexedDB.open("meu-app-estudos-question-bank",1);request.onupgradeneeded=function(){if(!request.result.objectStoreNames.contains("cache"))request.result.createObjectStore("cache")};request.onsuccess=function(){resolve(request.result)};request.onerror=function(){resolve(null)}})}
  function bankCacheKey(){return new URL("__eear_question_bank_cache_v5.html",location.href).href}
  async function readCachedBank(){try{if(window.caches){const cache=await caches.open("eear-question-bank-cache-v5"),response=await cache.match(bankCacheKey());if(response){const blob=await response.blob();if(blob.size>=1000000)return blob}}}catch(e){}const db=await openBankCache();if(!db)return null;return new Promise(function(resolve){try{const request=db.transaction("cache","readonly").objectStore("cache").get("bank-html-v5");request.onsuccess=function(){const blob=request.result instanceof Blob&&request.result.size>=1000000?request.result:null;resolve(blob)};request.onerror=function(){resolve(null)}}catch(e){resolve(null)}finally{db.close()}})}
  async function writeCachedBank(blob){try{if(window.caches){const cache=await caches.open("eear-question-bank-cache-v5");await cache.put(bankCacheKey(),new Response(blob,{headers:{"Content-Type":"text/html;charset=utf-8"}}))}}catch(e){console.warn("Cache API não conseguiu guardar o banco:",e)}const db=await openBankCache();if(!db)return;await new Promise(function(resolve){try{const tx=db.transaction("cache","readwrite");tx.objectStore("cache").put(blob,"bank-html-v5");tx.oncomplete=resolve;tx.onerror=resolve;tx.onabort=resolve}catch(e){resolve()}});db.close()}
  async function exportCurrentBank(){
    if(!exportBank)return;
    exportBank.disabled=true;
    exportBank.textContent="Preparando arquivo…";
    try{
      const blob=await readCachedBank();
      if(!blob)throw new Error("O banco ainda não está salvo neste dispositivo. Recarregue a página e aguarde o carregamento completo.");
      const doc=bank.contentDocument;
      const count=doc?doc.querySelectorAll(".card[data-id]").length:0;
      const url=URL.createObjectURL(new Blob([await blob.text()],{type:"text/html;charset=utf-8"}));
      const a=document.createElement("a");a.href=url;a.download="banco-eear-atual-exportado.html";document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url)},60000);
      exportBank.textContent=count?"Banco exportado ("+count+" questões)":"Banco exportado";
    }catch(error){alert(error&&error.message?error.message:"Não foi possível exportar o banco.");exportBank.textContent="Exportar banco para edição";}
    finally{exportBank.disabled=false;}
  }
  exportBank.addEventListener("click",exportCurrentBank);
  async function start(){
    retry.style.display="none";
    bank.style.display="none";
    status.style.display="grid";
    detail.textContent="Verificando banco salvo neste dispositivo…";
    let writer=null;
    try{
      let blob=await readCachedBank();
      if(!blob){
        detail.textContent="Primeiro carregamento: preparando banco de questões…";
        if(typeof DecompressionStream==="undefined")throw new Error("Este navegador não oferece suporte à descompactação necessária. Atualize o Chrome ou Edge.");
        const parts=[];
        const BATCH=3;
        // Exibição unificada: arquivos 1 a 13. Os nove primeiros são
        // fragmentos do mesmo GZIP e precisam ser unidos antes de descompactar.
        const legacyChunks=[];
        let loadedFiles=0;
        for(let start=1;start<=9;start+=BATCH){
          const end=Math.min(start+BATCH-1,9);
          detail.textContent="Carregando banco de questões ("+(loadedFiles+1)+" a "+end+" de "+TOTAL+")…";
          const batch=await Promise.all(Array.from({length:end-start+1},async function(_,offset){
            const i=start+offset,name="questoes-banco-"+String(i).padStart(2,"0")+".gz";
            const response=await fetch("banco-questoes/"+name,{cache:"no-store"});
            if(!response.ok)throw new Error("Não foi possível carregar "+name+" (HTTP "+response.status+").");
            return new Uint8Array(await response.arrayBuffer());
          }));
          legacyChunks.push.apply(legacyChunks,batch);
          loadedFiles=end;
          progress.style.width=(loadedFiles/TOTAL*100)+"%";
        }
        const legacySize=legacyChunks.reduce((sum,chunk)=>sum+chunk.byteLength,0);
        const legacyStream=new Uint8Array(legacySize);
        let legacyOffset=0;
        legacyChunks.forEach(function(chunk){legacyStream.set(chunk,legacyOffset);legacyOffset+=chunk.byteLength});
        detail.textContent="Descompactando os arquivos 1 a 9…";
        const legacyDecoded=await new Response(new Blob([legacyStream]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
        parts.push(legacyDecoded);
        // Os arquivos 10–13 são pacotes GZIP independentes, na mesma sequência visual.
        for(let fileNumber=10;fileNumber<=TOTAL;fileNumber++){
          const name="questoes-banco-"+String(fileNumber).padStart(2,"0")+".gz";
          detail.textContent="Carregando banco de questões ("+fileNumber+" de "+TOTAL+")…";
          const response=await fetch("banco-questoes/"+name,{cache:"no-store"});
          if(!response.ok)throw new Error("Não foi possível carregar "+name+" (HTTP "+response.status+").");
          const compressed=new Uint8Array(await response.arrayBuffer());
          const decoded=await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
          const normalized=fileNumber>=11&&/^\s*Q\.push\s*\(/.test(decoded)?"<script>\n"+decoded:decoded;
          parts.push(normalized);
          loadedFiles=fileNumber;
          progress.style.width=(loadedFiles/TOTAL*100)+"%";
        }
        blob=new Blob(parts,{type:"text/html;charset=utf-8"});
        if(blob.size<1000000)throw new Error("O banco descompactado parece incompleto.");
        detail.textContent="Salvando banco para abrir mais rápido nas próximas vezes…";
        await writeCachedBank(blob);
      }
      progress.style.width="100%";
      bank.onload=async function(){
        status.style.display="none";
        bank.style.display="block";
        exportBank.style.display="block";
        try{

          const targetDoc=bank.contentDocument;
          const bridgeScript=targetDoc.createElement("script");
          bridgeScript.textContent="("+function(){
            "use strict";
            function emit(source,id,subject,topic,picked,correct){
              if(!id||!subject||!picked||typeof correct!=="boolean")return;
              const now=new Date();
              const date=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
              const eventId=source+":"+id+":"+Date.now()+":"+Math.random().toString(36).slice(2);
              window.parent.postMessage({type:"eear-question-attempt",attempt:{
                source:source,questionId:String(id),eventId:eventId,subject:String(subject),
                topic:String(topic||"Geral"),picked:String(picked),correct:correct,date:date
              }},"*");
            }
            const rawBank=Object.assign({},(typeof B!=="undefined"&&B&&!Array.isArray(B))?B:{});
            function addBridgeQuestion(question,key){
              if(!question||typeof question!=="object")return;
              const id=question.id??question.qid??question.key??question.i??question.n??key;
              if(id===undefined||id===null||String(id).trim()==="")return;
              rawBank[String(id)]=question;
              if(key!==undefined&&key!==null&&String(key).trim()!==""&&!rawBank[String(key)])rawBank[String(key)]=question;
            }
            if(typeof B!=="undefined"&&Array.isArray(B))B.forEach((question,index)=>addBridgeQuestion(question,index));
            if(typeof Q!=="undefined"&&Q){
              if(Array.isArray(Q))Q.forEach((question,index)=>addBridgeQuestion(question,index));
              else if(typeof Q==="object")Object.keys(Q).forEach(key=>addBridgeQuestion(Q[key],key));
            }
            if(window.__eearBridgeQ&&typeof window.__eearBridgeQ==="object")Object.keys(window.__eearBridgeQ).forEach(key=>{if(!rawBank[key])rawBank[key]=window.__eearBridgeQ[key]});
            window.__eearBridgeQ=rawBank;
            // Correção do banco: questões discursivas tinham R/vazio no campo de alternativa,
            // embora a resposta estivesse preservada em t. Convertemos para resposta aberta.
            const textAnswerFixes=[];
            const textAnswerSeen=new Set();
            Object.keys(rawBank).forEach(function(key){
              const q=rawBank[key];
              if(!q||typeof q!=="object"||textAnswerSeen.has(q))return;
              textAnswerSeen.add(q);
              const rawKey=q.r===undefined||q.r===null?"":String(q.r).trim().toUpperCase();
              const answer=typeof q.t==="string"?q.t.trim():"";
              if(q.pdf_import||q.open||!answer||!(rawKey==="R"||rawKey===""))return;
              q.__eearTextAnswer=true;
              q.open=true;
              q.text=String(q.prompt||q.text||"");
              q.answerText=answer;
              q.r="";
              textAnswerFixes.push(q.id||key);
            });
            const noKeyIds=new Set(["m2-06-Difícil-22","triunfo_eear_208"]);
            noKeyIds.forEach(function(id){
              const q=rawBank[id];if(!q)return;
              q.__eearNoKey=true;q.open=true;q.r="";
              q.text=String(q.prompt||q.text||"");
              q.answerText="O material de origem não informa o gabarito desta questão.";
            });
            if(textAnswerFixes.length||noKeyIds.size){
              const originalQuestionCard=card;
              card=function(q){
                if(!q||(!q.__eearTextAnswer&&!q.__eearNoKey))return originalQuestionCard(q);
                const v=ans[q.id],esc=function(x){return String(x??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")};
                const tags='<div class="tags"><span class="tag lv">'+esc(q.l||"")+'</span><span class="tag">Matéria: '+esc(q.d||"")+'</span><span class="tag">Conteúdo: '+esc(q.m||"")+'</span>'+(q.s?'<span class="tag">Assunto: '+esc(q.s)+'</span>':"")+(q.u&&q.u!==q.s?'<span class="tag">Conteúdo específico: '+esc(q.u)+'</span>':"")+(q.__eearNoKey?'<span class="tag">Gabarito indisponível</span>':'<span class="tag">Resposta aberta</span>')+'</div>';
                const prompt=q.text?'<div class="qtext">'+esc(q.text).replace(/\n/g,"<br>")+'</div>':"";
                const image=q.i?'<div class="qi" data-z="1"><img loading="lazy" alt="Imagem de apoio da questão '+esc(q.n)+'" src="'+q.i+'"><span class="zm">⤢ Ampliar</span></div>':"";
                const feedback=q.__eearNoKey?'<div class="fb"><span>'+esc(q.answerText)+'</span></div>':(v?'<div class="fb ok"><span>'+esc(q.answerText)+'</span><button data-redo="1">Ocultar</button></div>':'<button class="more" data-show="1" style="margin-top:12px;width:100%;align-self:stretch">Ver resposta</button>');
                return '<article class="card" data-id="'+esc(q.id)+'">'+tags+prompt+image+feedback+'</article>';
              };
              if(typeof render==="function")render();
            }
            // ID permanente do Banco de Questões: sequência única, agrupada por disciplina
            // e por assunto, respeitando a ordem em que os assuntos aparecem no próprio banco.
            // IDs não são aplicados às áreas de simulados ou provas.
            const uidSubjectOrder=["Matemática","Física","Português","Inglês"];
            const uidCounts={"Matemática":0,"Física":0,"Português":0,"Inglês":0};
            const uidSeen=new Set(),uidQuestions=[],uidUnclassified=[],uidMatterOrder={};
            function uidMatterKey(question){
              return String(question.m||question.matter||question.area||"Sem assunto").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim()||"Sem assunto";
            }
            Object.keys(rawBank).forEach(function(key){
              const question=rawBank[key];
              if(!question||typeof question!=="object"||uidSeen.has(question))return;
              uidSeen.add(question);
              const rawSubject=question.d||question.discipline||question.subject||"";
              const subject=canonicalSubject(rawSubject);
              const order=uidSubjectOrder.indexOf(subject);
              if(order<0){
                if(rawSubject)uidUnclassified.push({key:String(key),subject:String(rawSubject)});
                return;
              }
              const matter=uidMatterKey(question);
              const matterKey=matter.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
              if(!uidMatterOrder[subject])uidMatterOrder[subject]=new Map();
              if(!uidMatterOrder[subject].has(matterKey))uidMatterOrder[subject].set(matterKey,uidMatterOrder[subject].size);
              uidQuestions.push({question:question,subject:subject,order:order,matterKey:matterKey,matterOrder:uidMatterOrder[subject].get(matterKey),sequence:uidQuestions.length});
            });
            uidQuestions.sort((a,b)=>a.order-b.order||a.matterOrder-b.matterOrder||a.sequence-b.sequence);
            uidQuestions.forEach(function(item,index){
              item.question.__eearUID=String(index+1).padStart(3,"0");
              item.question.__eearUIDLabel="ID #"+item.question.__eearUID;
              uidCounts[item.subject]++;
            });
            // Nem toda questão cadastrada pode ser respondida: algumas são abertas,
            // anuladas ou não possuem gabarito. Mantemos os IDs nas 5.250 questões,
            // mas contamos separadamente as que têm resposta válida no banco.
            function uidHasValidAnswer(question){
              return !!question&&!question.open&&question.r!==undefined&&question.r!==null&&String(question.r).trim()!==""&&String(question.r).trim().toUpperCase()!=="ANULADA";
            }
            const uidAnswerable=uidQuestions.filter(function(item){return uidHasValidAnswer(item.question)});
            const uidAnswerableCounts={"Matemática":0,"Física":0,"Português":0,"Inglês":0};
            uidAnswerable.forEach(function(item){uidAnswerableCounts[item.subject]++});
            // Diagnóstico individual das questões que não passam pela correção automática.
            const uidBlocked={open:[],annulled:[],missingKey:[],other:[]};
            uidQuestions.forEach(function(item){
              const q=item.question,rawKey=q&&q.r,normalized=rawKey===undefined||rawKey===null?"":String(rawKey).trim().toUpperCase();
              if(q&&q.open)uidBlocked.open.push(item);
              else if(normalized==="ANULADA")uidBlocked.annulled.push(item);
              else if(normalized==="")uidBlocked.missingKey.push(item);
              else if(!uidHasValidAnswer(q))uidBlocked.other.push(item);
            });
            const uidBlockedAudit={
              total:uidQuestions.length-uidAnswerable.length,
              open:uidBlocked.open.length,
              annulled:uidBlocked.annulled.length,
              missingKey:uidBlocked.missingKey.length,
              other:uidBlocked.other.length,
              examples:{
                open:uidBlocked.open.slice(0,20).map(item=>({uid:item.question.__eearUID,subject:item.subject,key:item.question.r,open:item.question.open})),
                annulled:uidBlocked.annulled.slice(0,20).map(item=>({uid:item.question.__eearUID,subject:item.subject,key:item.question.r,open:item.question.open})),
                missingKey:uidBlocked.missingKey.slice(0,20).map(item=>({uid:item.question.__eearUID,subject:item.subject,key:item.question.r,open:item.question.open})),
                other:uidBlocked.other.slice(0,20).map(item=>({uid:item.question.__eearUID,subject:item.subject,key:item.question.r,open:item.question.open}))
              }
            };
            window.__eearUnanswerableAudit=uidBlockedAudit;
            const uidExpected={"Matemática":2004,"Física":1095,"Português":1671,"Inglês":480};
            let uidCursor=1;
            const uidRanges={};
            uidSubjectOrder.forEach(function(subject){
              const count=uidCounts[subject];
              uidRanges[subject]=count?{first:String(uidCursor).padStart(3,"0"),last:String(uidCursor+count-1).padStart(3,"0")}:null;
              uidCursor+=count;
            });
            const uidUniqueCount=new Set(uidQuestions.map(item=>item.question.__eearUID)).size;
            const uidExpectedMatch=uidSubjectOrder.every(subject=>uidCounts[subject]===uidExpected[subject]);
            const uidAudit={
              expectedTotal:5250,
              totalIdentified:uidSeen.size,
              totalWithUID:uidQuestions.length,
              answerableTotal:uidAnswerable.length,
              notAnswerableTotal:uidQuestions.length-uidAnswerable.length,
              answerableBySubject:uidAnswerableCounts,
              unanswerableReasons:uidBlockedAudit,
              withoutUID:uidSeen.size-uidQuestions.length,
              duplicateUIDs:uidQuestions.length-uidUniqueCount,
              unclassified:uidUnclassified,
              bySubject:uidCounts,
              expectedBySubject:uidExpected,
              ranges:uidRanges,
              firstUID:uidQuestions.length?uidQuestions[0].question.__eearUID:null,
              lastUID:uidQuestions.length?uidQuestions[uidQuestions.length-1].question.__eearUID:null,
              allQuestionsCovered:uidQuestions.length===uidSeen.size&&uidQuestions.length===5250&&uidExpectedMatch&&uidUniqueCount===uidQuestions.length
            };
            window.__eearUIDAudit=uidAudit;
            console.info("[EEAR] Auditoria de IDs sequenciais:",uidAudit);
            // Resumo enxuto no topo: faixas contínuas por disciplina.
            const uidSummary=document.createElement("section");
            uidSummary.className="eear-uid-summary";
            const uidSummaryTitle=document.createElement("strong");
            uidSummaryTitle.textContent="Faixas de IDs";
            uidSummary.appendChild(uidSummaryTitle);
            uidSubjectOrder.forEach(function(subject){
              const range=uidRanges[subject];
              const line=document.createElement("span");
              line.className="eear-uid-summary-line";
              line.textContent=subject+": "+(range?"#"+range.first+" até #"+range.last:"sem questões");
              uidSummary.appendChild(line);
            });
            document.body.insertBefore(uidSummary,document.body.firstChild);
            const uidAuditStyle=document.createElement("style");
            uidAuditStyle.textContent=".eear-uid-summary{display:flex;flex-wrap:wrap;gap:5px 18px;align-items:center;margin:0 0 18px;padding:10px 14px;border:1px solid #383838;border-radius:10px;background:#141414;color:#f5f5f5;font:12px/1.5 system-ui,Arial,sans-serif}.eear-uid-summary strong{font-size:13px;width:100%}.eear-uid-summary-line{color:#ccc}.eear-question-uid{display:inline-flex!important;align-items:center;margin:0 0 14px;padding:5px 10px;border:1px solid #777;border-radius:7px;background:#252525;color:#fff;font:800 12px/1.2 system-ui,Arial,sans-serif;letter-spacing:.04em;position:relative;z-index:1}.card .eear-question-uid{visibility:visible!important;opacity:1!important}";
            document.head.appendChild(uidAuditStyle);
            function firstQuestionValue(question,names){
              for(const name of names){
                const value=question&&question[name];
                if(value!==undefined&&value!==null&&String(value).trim()!=="")return cleanLabel(value);
              }
              return "";
            }
            const uidAliasMap=new Map(),uidNumericAliasMap=new Map();
            function uidNormalizeAlias(value){
              return String(value==null?"":value).trim().toLowerCase().replace(/^(?:bank|questao|question|q)[_-]?/,"");
            }
            Object.keys(rawBank).forEach(function(key){
              const q=rawBank[key];if(!q||typeof q!=="object")return;
              [key,q.id,q.qid,q.key,q.i,q.n].forEach(function(alias){
                if(alias===undefined||alias===null||String(alias).trim()==="")return;
                const exact=String(alias),normalized=uidNormalizeAlias(exact);
                if(!uidAliasMap.has(exact))uidAliasMap.set(exact,q);
                if(normalized&&!uidAliasMap.has(normalized))uidAliasMap.set(normalized,q);
                const digits=normalized.match(/\d+$/);
                if(digits&&!uidNumericAliasMap.has(digits[0]))uidNumericAliasMap.set(digits[0],q);
              });
            });
            function applyQuestionUIDs(root){
              const scope=root&&root.querySelectorAll?root:document;
              const cards=[];
              if(scope.matches&&scope.matches(".card[data-id]"))cards.push(scope);
              scope.querySelectorAll(".card[data-id]").forEach(card=>cards.push(card));
              const allCards=Array.from(document.querySelectorAll(".card[data-id]"));
              let matchedByKey=0;
              cards.forEach(function(card){
                // A mesma chave usada pelo corretor do banco é a fonte do ID.
                // Não usar posição visual como fallback: a ordem dos cartões pode
                // mudar com filtros, paginação ou carregamento dinâmico.
                const key=String(card.getAttribute("data-id")||card.getAttribute("data-qid")||card.getAttribute("data-question-id")||"");
                const normalized=uidNormalizeAlias(key),digits=normalized.match(/\d+$/);
                const question=rawBank[key]||uidAliasMap.get(key)||uidAliasMap.get(normalized)||(digits&&uidNumericAliasMap.get(digits[0]));
                if(question&&question.__eearUID)matchedByKey++;
                let label=card.querySelector(":scope > .eear-question-uid");
                const uid=question&&question.__eearUID;
                if(!uid){if(label)label.remove();return}
                if(!label){
                  label=document.createElement("div");
                  label.className="eear-question-uid";
                  card.insertBefore(label,card.firstChild);
                }
                label.textContent="ID #"+uid;
                label.dataset.uid=uid;
                label.style.cssText="display:flex!important;visibility:visible!important;opacity:1!important;width:max-content!important;max-width:100%;align-items:center;margin:0 0 14px;padding:5px 10px;border:1px solid #777;border-radius:7px;background:#252525;color:#fff;font:800 12px/1.2 system-ui,Arial,sans-serif;letter-spacing:.04em;position:relative;z-index:5";
                label.setAttribute("aria-label","ID #"+uid);
              });
              window.__eearUIDCardAudit={cardsFound:allCards.length,cardsMapped:document.querySelectorAll(".card[data-id] > .eear-question-uid").length,matchedByKey:matchedByKey,questionsWithUID:uidQuestions.length};
            }
            const uidStyle=document.createElement("style");
            uidStyle.textContent=".eear-question-uid{display:inline-flex!important;align-items:center;margin:0 0 14px;padding:5px 10px;border:1px solid #777;border-radius:7px;background:#252525;color:#fff;font:800 12px/1.2 system-ui,Arial,sans-serif;letter-spacing:.04em;position:relative;z-index:1}.card .eear-question-uid{visibility:visible!important;opacity:1!important}";
            document.head.appendChild(uidStyle);
            applyQuestionUIDs(document);
            try{
              new MutationObserver(function(records){
                records.forEach(function(record){
                  if(record.type==="attributes"){applyQuestionUIDs(record.target);return}
                  record.addedNodes.forEach(function(node){if(node.nodeType===1)applyQuestionUIDs(node)});
                });
              }).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["data-id"]});
            }catch(e){}
            const taxonomy={},hierarchy={};
            function cleanLabel(value){return String(value||"").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim()}
            function normLabel(value){return cleanLabel(value).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
            function canonicalSubject(value){
              const n=normLabel(value).replace(/[._-]+/g," ").replace(/\s+/g," ").trim();
              if(/^matematica(?:\s*[123])?$/.test(n))return "Matemática";
              if(/^fisica(?:\s*[123])?$/.test(n))return "Física";
              if(/^portugues(?:\s*[123])?$/.test(n))return "Português";
              if(/^ingles(?:\s*[123])?$/.test(n))return "Inglês";
              return "";
            }
            const subjectOrder=["Matemática","Português","Física","Inglês"];
            Object.keys(rawBank).forEach(function(id){
              const question=rawBank[id];if(!question||typeof question!=="object")return;
              const d=canonicalSubject(question.d||question.discipline||question.subject||"");if(!d)return;
              const raw=[question.m||question.matter||question.area,question.s||question.content||question.topic,question.u||question.subtopic||question.detail].map(cleanLabel);
              const path=[];
              raw.forEach(function(value){if(!value)return;const n=normLabel(value);if(!path.length||normLabel(path[path.length-1])!==n)path.push(value)});
              const assunto=path[0]||"";
              const topico=path[1]||"";
              const conteudo=path[2]||"";
              question.__eearFilterPath={subject:d,assunto:assunto,topico:topico,conteudo:conteudo};
              if(!assunto)return;
              if(!taxonomy[d])taxonomy[d]=[];
              if(!taxonomy[d].includes(assunto))taxonomy[d].push(assunto);
              if(!hierarchy[d])hierarchy[d]={};
              if(!hierarchy[d][assunto])hierarchy[d][assunto]={};
              if(topico){
                if(!hierarchy[d][assunto][topico])hierarchy[d][assunto][topico]=[];
                if(conteudo&&!hierarchy[d][assunto][topico].includes(conteudo))hierarchy[d][assunto][topico].push(conteudo);
              }
            });
            subjectOrder.forEach(function(subject){if(taxonomy[subject])taxonomy[subject].sort((a,b)=>a.localeCompare(b,"pt-BR"))});
            function sortTree(o){Object.keys(o).forEach(k=>{if(Array.isArray(o[k]))o[k].sort((a,b)=>a.localeCompare(b,"pt-BR"));else sortTree(o[k])})}
            Object.keys(hierarchy).forEach(sortTree);
            function sortTree(o){Object.keys(o).forEach(k=>Array.isArray(o[k])?o[k].sort((a,b)=>a.localeCompare(b,"pt-BR")):sortTree(o[k]))}
            Object.keys(taxonomy).forEach(n=>taxonomy[n].sort((a,b)=>a.localeCompare(b,"pt-BR")));sortTree(hierarchy);
            window.parent.postMessage({type:"eear-question-taxonomy",taxonomy:taxonomy},"*");window.parent.postMessage({type:"eear-question-taxonomy-full",hierarchy:hierarchy},"*");
            function applyLinkedFilter(f){document.querySelectorAll(".card[data-id]").forEach(card=>{const q=rawBank[card.dataset.id]||{},path=q.__eearFilterPath||{},norm=v=>String(v||"").normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").trim().toLowerCase(),fields=[path.subject,path.assunto,path.topico,path.conteudo],wanted=[f.subject,f.matter,f.content,f.specific].map(norm);card.style.display=wanted.every((v,i)=>!v||norm(fields[i])===v)?"":"none"})}
            window.addEventListener("message",ev=>{if(ev.data&&ev.data.type==="app-question-filter"){window.__appQuestionFilter=ev.data.filter||{};applyLinkedFilter(window.__appQuestionFilter)}});
            try{new MutationObserver(()=>{if(window.__appQuestionFilter)applyLinkedFilter(window.__appQuestionFilter)}).observe(document.body,{childList:true,subtree:true})}catch(e){}
            document.addEventListener("click",function(event){
              const bankAnswer=event.target.closest&&event.target.closest(".alt[data-a]");
              if(bankAnswer){
                const card=bankAnswer.closest(".card");
                if(!card)return;
                const id=card.dataset.id,question=rawBank[id]||(window.__eearBridgeQ&&window.__eearBridgeQ[id])||(typeof B!=="undefined"&&B[id]);
                const picked=(typeof ans!=="undefined"&&ans[id])||bankAnswer.dataset.a;
                if(!question||question.open||!question.r||question.r==="ANULADA")return;
                const accepted=question.legacy_d==="Física 2"?[question.r,question.r2].filter(Boolean):[question.r];
                emit("banco",id,question.d||question.discipline||question.subject,question.u||question.subtopic||question.s||question.content||question.m||question.matter,picked,accepted.includes(picked));
                return;
              }
              const examAnswer=event.target.closest&&event.target.closest("[data-exam-answer]");
              if(examAnswer){
                const card=examAnswer.closest("[data-exam-q]");
                if(!card||typeof provaState==="undefined"||typeof PROVAS_DATA==="undefined")return;
                const number=Number(card.dataset.examQ),exam=PROVAS_DATA[provaState.exam];
                const question=exam&&exam.questions.find(item=>Number(item.n)===number);
                const picked=provaState.answers[provaState.exam+"_"+number];
                if(!question||!picked||question.a==="ANULADA")return;
                emit("prova",provaState.exam+"_q"+number,question.s,exam.title,picked,picked===question.a);
                return;
              }
              const simAnswer=event.target.closest&&event.target.closest("[data-sim-answer]");
              if(simAnswer){
                const card=simAnswer.closest("[data-sim-q]");
                if(!card||typeof simState==="undefined"||typeof SIMULADOS_DATA==="undefined")return;
                const parts=card.dataset.simQ.split("_"),subject=parts[0],number=Number(parts[1]);
                const questions=SIMULADOS_DATA[simState.exam]&&SIMULADOS_DATA[simState.exam][subject];
                const question=questions&&questions.find(item=>Number(item.n)===number);
                const picked=simState.answers[simState.exam+"_"+subject+"_"+number];
                if(!question||!picked)return;
                const year=simState.exam==="s1"?"2021.1":"2021.2";
                emit("simulado",simState.exam+"_"+subject+"_q"+number,subject,"Simulado "+year,picked,picked===question.a);
              }
            },false);
          }.toString()+")();";

          targetDoc.body.appendChild(bridgeScript);

          // Ajustes visuais exclusivos do Banco de Questões: largura mais confortável,
          // maior área vertical para leitura e paleta estritamente neutra.
          const bankVisualStyle = targetDoc.createElement("style");
          bankVisualStyle.id = "eear-bank-visual-adjustments";
          bankVisualStyle.textContent = `
            :root { color-scheme: dark; }
            html, body {
              background: #080808 !important;
              color: #f5f5f5 !important;
              accent-color: #f5f5f5 !important;
            }
            body {
              background-image: none !important;
            }
            .card[data-id] {
              width: 100% !important;
              max-width: none !important;
              min-height: 190px !important;
              height: auto !important;
              margin: 0 0 24px !important;
              padding: 30px !important;
              box-sizing: border-box !important;
              background: #141414 !important;
              color: #f5f5f5 !important;
              border: 1px solid #383838 !important;
              border-radius: 14px !important;
              box-shadow: 0 8px 24px rgba(0,0,0,.22) !important;
            }
            .card[data-id] p,
            .card[data-id] .question-text,
            .card[data-id] .enunciado {
              color: #f5f5f5 !important;
              font-size: 16px !important;
              line-height: 1.7 !important;
            }
            .card[data-id] .alt[data-a] {
              display: block !important;
              width: 100% !important;
              min-height: 48px !important;
              height: auto !important;
              margin: 10px 0 !important;
              padding: 12px 16px !important;
              box-sizing: border-box !important;
              color: #f5f5f5 !important;
              background: #202020 !important;
              border: 1px solid #484848 !important;
              border-radius: 10px !important;
              line-height: 1.55 !important;
              text-align: left !important;
            }
            .card[data-id] img,
            .card[data-id] svg,
            .card[data-id] canvas {
              max-width: 100% !important;
              max-height: 420px !important;
              object-fit: contain !important;
            }
            .card[data-id] * {
              --primary: #f5f5f5 !important;
              --accent: #f5f5f5 !important;
              --brand: #f5f5f5 !important;
            }
            @media (min-width: 1100px) {
              .card[data-id] { padding: 30px !important; }
              .card[data-id] p,
              .card[data-id] .question-text,
              .card[data-id] .enunciado { font-size: 17px !important; }
            }
            @media (max-width: 700px) {
              .card[data-id] {
                width: 100% !important;
                max-width: none !important;
                min-height: 0 !important;
                padding: 18px !important;
                margin-bottom: 16px !important;
              }
            }
          `;
          targetDoc.head.appendChild(bankVisualStyle);
          applyQuestionTheme(activeTheme);
          try{new MutationObserver(function(){hideInnerThemeControls(targetDoc)}).observe(targetDoc.body,{childList:true,subtree:true})}catch(e){}
        }catch(bridgeError){
          console.error("Não foi possível ativar a integração de desempenho do banco EEAR:",bridgeError);
        }
      };
      bank.src=URL.createObjectURL(new Blob([blob],{type:"text/html;charset=utf-8"}));
    }catch(error){
      if(writer)try{await writer.abort(error)}catch(_){}
      throw error;
    }
  }
  retry.addEventListener("click",function(){start().catch(fail)});
  function fail(error){
    detail.textContent=error&&error.message?error.message:String(error);
    progress.style.width="0";
    retry.style.display="inline-block";
  }
  start().catch(fail);
})();
</script>
