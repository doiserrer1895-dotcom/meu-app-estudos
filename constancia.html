<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Constância</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0b0b0b;--cd:#101010;--bd:#2b2b2b;--tx:#f4f4f2;--mu:#9a9a96;--in:#1a1a1a;--lt:#e6e6e4;--ltx:#111;--gold:#fbbf24;--rd:#f87171;--or:#fb923c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{zoom:.68}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,#1a1a1a,#0b0b0b 420px) no-repeat;min-height:100vh;-webkit-font-smoothing:antialiased}
#app{width:100%;max-width:920px;margin:0 auto;padding:16px 22px 270px}
button{font-family:inherit;color:inherit;cursor:pointer}
svg{width:22px;height:22px;display:block}
.hd{display:flex;align-items:center;gap:12px}
.av{width:60px;height:60px;border-radius:50%;border:2px solid var(--lt);display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.av svg{width:30px;height:30px}
.av b{position:absolute;right:-6px;bottom:-4px;width:24px;height:24px;border-radius:50%;background:var(--lt);color:var(--ltx);font-size:13px;display:flex;align-items:center;justify-content:center}
.nm{flex:1;min-width:0}.nm h2{margin:0;font-size:22px;font-weight:800;letter-spacing:.01em}
.nm span{display:flex;align-items:center;gap:6px;color:var(--mu);font-weight:700;margin-top:2px}.nm span svg{width:16px;height:16px}
.pl{display:flex;gap:6px}
.pl span{display:flex;align-items:center;gap:5px;border-radius:999px;padding:7px 10px;font-weight:800;font-size:15px;border:1px solid}
.pl svg{width:17px;height:17px}
.p1{color:var(--or);border-color:#6b3a1c;background:#2a1a10}.p2{color:var(--gold);border-color:#6b5514;background:#272010}.p3{color:var(--rd);border-color:#6b2a2a;background:#2a1313}
.xp{margin:14px -16px 0;position:relative}
.xp small{display:block;text-align:right;padding-right:16px;color:var(--mu);font-size:13px;margin-bottom:6px}
.xp div{height:4px;background:#2a2a2a;position:relative}.xp i{display:block;height:100%;background:#cfcfcd}
.xp i:after{content:"";position:absolute;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--lt);margin-left:-6px}
h1{text-align:center;font-size:28px;margin:22px 0 18px;letter-spacing:-.03em}

.dn{display:flex;align-items:center;justify-content:space-between;margin:6px 0 22px}
.dn>button{width:52px;height:52px;border-radius:50%;border:1px solid var(--bd);background:#1a1a1a;color:var(--tx);display:flex;align-items:center;justify-content:center;padding:0}
.dn>button svg{width:24px;height:24px}
.dn div{text-align:center;cursor:pointer}.dn b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em}.dn small{color:var(--mu);font-size:16px;font-weight:600}
.wkb{display:flex;justify-content:space-between;gap:4px}
.wkb button{flex:1;background:none;border:1px solid transparent;border-radius:30px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--mu);font-weight:700;font-size:14px}
.wkb button i{font-style:normal;width:52px;height:52px;border-radius:50%;background:#1f1f1f;color:var(--tx);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.wkb button.ok i{background:var(--lt);color:var(--ltx)}
.wkb button.on{background:#262626;border-color:#4a4a48;box-shadow:0 0 22px rgba(255,255,255,.12);color:var(--tx)}
.wkb button.on i{box-shadow:0 0 0 2px #fff}
.cs{display:flex;align-items:center;margin-top:16px;border:1px solid var(--bd);background:#141414;border-radius:22px;padding:16px 18px;font-size:17px;line-height:1.35;font-weight:600}
.cs b{font-weight:800}
.days{display:flex;gap:10px;justify-content:center}
.days button{width:96px;border:1px solid transparent;background:#1a1a1a;border-radius:20px;padding:11px 0;color:var(--mu);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.days button b{display:block;font-size:26px;color:var(--tx);letter-spacing:0;margin-top:2px}
.days button.on{background:#bdbdbb;color:#2b2b2b;box-shadow:0 0 24px rgba(255,255,255,.12)}.days button.on b{color:#111}
.back{display:block;margin:10px auto 0;background:none;border:0;color:var(--mu);font-size:13px;font-weight:600}
.pr{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 0;color:var(--mu);font-weight:800;letter-spacing:.06em;font-size:15px}
.pr b{color:var(--tx);font-size:19px;letter-spacing:0}
.sg{display:flex;gap:5px}.sg i{flex:1;height:12px;border-radius:4px;background:#1f1f1f;transition:background .25s}.sg i.f{background:var(--lt)}
.seg{display:flex;margin:30px 0 18px;border-bottom:1px solid var(--bd);padding-bottom:14px}
.seg button{flex:1;border:1px solid transparent;background:none;border-radius:22px;padding:12px 0;font-size:15px;font-weight:700;color:var(--mu)}
.seg button b{display:block;font-size:24px;color:var(--tx);line-height:1.1}
.seg button.on{background:var(--lt);color:#222;box-shadow:0 0 26px rgba(255,255,255,.14)}.seg button.on b{color:#111}
.ch{display:flex;gap:8px;overflow-x:auto;padding:2px 0 16px;scrollbar-width:none}.ch::-webkit-scrollbar{display:none}
.ch button{flex:none;border:1px solid transparent;background:#1a1a1a;color:var(--mu);border-radius:999px;padding:12px 18px;font-size:16px;font-weight:600;white-space:nowrap}
.ch button.on{border-color:#cfcfcd;color:var(--tx);background:none}.ch em{font-style:normal;font-size:12px;opacity:.7;margin-left:6px}
.mc{border:1px solid var(--bd);border-left:3px solid var(--sk,#cfcfcd);border-radius:28px;padding:0;margin-bottom:14px;background:var(--cd);display:flex}
.mn{flex:1;min-width:0;padding:18px}
.ar{flex:none;width:62px;border-left:1px solid var(--bd);display:flex;align-items:flex-start;justify-content:center;padding-top:26px;cursor:pointer;color:var(--lt)}.ar svg{width:24px;height:24px;transition:transform .25s}.ar.o svg{transform:rotate(180deg)}
.mc{transition:background .2s,border-color .2s,box-shadow .2s}.mc.tap{cursor:pointer}
.ttl b{background:linear-gradient(#111,#111) no-repeat 0 58%/0 2.5px;transition:background-size .45s cubic-bezier(.65,0,.35,1)}
.pc{align-self:center;font-weight:800;font-size:14px;color:var(--mu);padding-right:6px;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.mc.ok{background:#c6c6c4;border-color:#d2d2d0;box-shadow:0 0 12px rgba(255,255,255,.05);color:#111}.mc.ok .ttl b{color:#111;background-size:100% 2.5px}.mc.ok .mt,.mc.ok .ac button,.mc.ok .rg{color:#555}.mc.ok .tm{background:#cfcfcd;color:#111}
.tp{display:flex;gap:10px;align-items:flex-start}
.ttl{flex:1;min-width:0;font-size:18px;line-height:1.3;font-weight:500}
.ttl b{font-family:Georgia,"Times New Roman",serif;font-weight:800;font-size:21px;text-transform:uppercase;letter-spacing:-.02em;line-height:1.15}
.ttl em{font-style:normal;color:var(--mu);font-size:16px}
.rc{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex:none}
.ac{display:flex;gap:2px}.ac button{background:none;border:0;color:var(--mu);padding:6px}.ac svg{width:20px;height:20px}.ac .fv.on{color:var(--lt)}.ac .fv.on svg{fill:currentColor}
.tm{display:flex;align-items:center;gap:5px;background:#1f1f1f;border-radius:10px;padding:6px 10px;font-weight:700;font-size:15px}.tm svg{width:15px;height:15px}
.mt{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:12px;color:var(--mu);font-weight:600;font-size:15px}
.mt span{display:inline-flex;align-items:center;gap:6px}.mt svg{width:16px;height:16px}
.dot{width:10px;height:10px;border-radius:50%}
.tr{position:relative;margin:20px 0 4px 36px}
.tr .ln{position:absolute;background:#e8e8e6;box-shadow:0 0 8px rgba(255,255,255,.55)}
.mb{display:flex;align-items:center;gap:12px;border:2px solid #e8e8e6;border-radius:12px;padding:12px 14px;font-weight:700;font-size:17px;text-transform:uppercase;line-height:1.2;background:linear-gradient(180deg,#242424,#161616);color:#f4f4f2;box-shadow:0 0 14px rgba(255,255,255,.35),inset 0 0 10px rgba(255,255,255,.08)}
.mb i{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid #cfcfcd;display:flex;align-items:center;justify-content:center;color:#e6e6e4}
.mb i svg{width:24px;height:24px}
.sb{position:relative;margin-top:26px;border:2px solid #cfcfcd;border-radius:12px;padding:12px 14px 12px 22px;background:linear-gradient(180deg,#242424,#161616);cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:0 0 14px rgba(255,255,255,.28),inset 0 0 10px rgba(255,255,255,.06)}
.sb .sx{flex:1;min-width:0;font-size:18px;font-weight:600;line-height:1.25;color:#fff}
.sb .sx b{display:block;font-size:17px;letter-spacing:.02em;text-transform:uppercase;font-weight:700;color:#fff}
.sb .sx small{color:#9a9a96;font-size:14px;font-weight:600;margin-left:6px}
.sb .cx{width:28px;height:28px;border-radius:50%;border:2px solid #cfcfcd;flex:none;display:flex;align-items:center;justify-content:center;color:transparent;font-weight:800;font-size:15px}
.sb .sl{position:absolute;left:12px;right:12px;top:50%;height:2.5px;margin-top:-1px;border-radius:2px;background:#111;transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.65,0,.35,1);pointer-events:none}.sb.on .sl{transform:scaleX(1)}
.sb.on{background:#c6c6c4;border-color:#d2d2d0;box-shadow:0 0 8px rgba(255,255,255,.05),inset 0 0 10px rgba(255,255,255,.06)}.sb.on .cx{background:#111;border-color:#111;color:#e6e6e4}.sb.on .sx,.sb.on .sx b{color:#111}.sb.on .sx small{color:#555}
.gg{border:1px solid var(--bd);border-radius:18px;background:#101010;padding:22px 16px 18px;margin-top:10px;text-align:center}
.gg svg{width:100%;max-width:340px;height:auto;margin:0 auto;display:block;overflow:visible}
.gg small{display:block;color:var(--mu);font-weight:600;font-size:14px;margin-top:10px}
.sp{display:flex;align-items:center;gap:8px;border:1px solid #3a3a3a;background:#161616;border-radius:14px;padding:10px 14px;font-weight:700;font-size:15px}
.sp i{width:20px;height:20px;border-radius:7px;border:2px solid #5c5c5c;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;color:transparent}
.sp.on{background:var(--lt);color:var(--ltx);border-color:var(--lt)}.sp.on i{border-color:var(--ltx);color:var(--ltx)}
.bt{display:flex;align-items:center;gap:14px;margin-top:14px;font-weight:800;font-size:17px}
.bt span{display:flex;align-items:center;gap:6px}.bt svg{width:19px;height:19px}.bt .xx{color:var(--tx)}.bt .cc{color:var(--gold)}
.bt .rg{margin-left:auto;font-size:15px;color:var(--mu)}
.ck{margin-left:auto;width:40px;height:40px;border-radius:50%;border:2px solid #5c5c5c;background:none;font-size:18px;font-weight:800;color:transparent;padding:0;display:flex;align-items:center;justify-content:center}
.ck.on{background:var(--lt);border-color:var(--lt);color:var(--ltx)}
.empty{text-align:center;color:var(--mu);padding:36px 10px}.empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:6px}
.empty button{margin-top:14px;border:0;background:var(--lt);color:var(--ltx);border-radius:14px;padding:12px 20px;font-weight:800;font-size:15px}
.soon{text-align:center;min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mu)}.soon svg{width:44px;height:44px}.soon h2{color:var(--tx);margin:8px 0 0;font-size:24px}
.fab{position:fixed;right:max(18px,calc(50% - 302px));bottom:calc(148px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;border:0;background:var(--lt);color:var(--ltx);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:6}.fab svg{width:30px;height:30px}
#nav{position:fixed;left:0;right:0;bottom:0;padding:0 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5;pointer-events:none}
#nav div{pointer-events:auto;display:flex;width:100%;max-width:820px;height:132px;min-height:132px;padding:12px 10px calc(12px + env(safe-area-inset-bottom,0px));background:#050505;border:1px solid #292929;border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.45)}
#nav button{position:relative;flex:1;min-height:108px;border:0;border-radius:16px;background:transparent;color:#858585;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#nav button svg{display:block;width:38px;height:38px;margin:0;stroke:#f4f4f2;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s,opacity .18s;opacity:.72}
#nav button span{display:block;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600;font-size:11px;line-height:1.2;letter-spacing:.02em;text-transform:none;color:#8d8d8d;text-shadow:none;-webkit-text-stroke:0}
#nav button.on{background:#171717;color:#f4f4f2}
#nav button.on svg{opacity:1;transform:translateY(-1px)}
#nav button.on span{color:#fff}
#nav button.on::before,#nav button.on::after{content:none}
#sheet{position:fixed;inset:0;z-index:20;display:none}#sheet.open{display:block}
.bk{position:absolute;inset:0;background:rgba(0,0,0,.65)}
.sh{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:600px;max-height:94%;overflow-y:auto;background:#141414;border:1px solid var(--bd);border-radius:28px 28px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sh h3{margin:0 0 4px;font-size:22px}
.sh label{display:block;font-size:13px;color:var(--mu);margin:16px 0 6px;font-weight:700}
.sh input{width:100%;font:inherit;font-size:17px;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:14px;padding:13px}
.sh input:focus{outline:2px solid rgba(230,230,228,.35)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1px solid var(--bd);background:var(--in);color:var(--mu);border-radius:999px;padding:10px 14px;font-size:14px;font-weight:700}
.pills button.on{background:var(--lt);color:var(--ltx);border-color:var(--lt)}
.wk{display:flex;gap:5px}.wk button{flex:1;border:1px solid var(--bd);background:var(--in);color:var(--mu);border-radius:12px;padding:12px 0;font-size:12px;font-weight:800}.wk button.on{background:var(--lt);color:var(--ltx)}
.nt{font-size:12.5px;color:var(--mu);margin-top:7px;line-height:1.4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fs{display:grid;grid-template-columns:1fr 110px;gap:8px;margin-top:8px}
.stp{display:flex;align-items:center;gap:14px}.stp button{width:42px;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--in);font-size:22px;font-weight:700}.stp b{font-size:20px;min-width:24px;text-align:center}
.er{color:var(--rd);font-size:14px;margin-top:12px;min-height:18px}
.act{display:flex;gap:8px;margin-top:10px}.act button{flex:1;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:16px;background:var(--lt);color:var(--ltx)}.act .gh{background:var(--in);color:var(--tx);border:1px solid var(--bd)}

/* ===== perfil ===== */
.ph{display:flex;gap:16px;align-items:center;margin-top:8px}
.pf{position:relative;width:108px;height:108px;border-radius:50%;border:2px solid var(--lt);background:#1a1a1a center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center;color:var(--mu);cursor:pointer;overflow:visible}
.pf svg{width:40px;height:40px}
.pf b{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:var(--lt);color:var(--ltx);display:flex;align-items:center;justify-content:center}.pf b svg{width:18px;height:18px}
.pf input{display:none}
.pfl{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.pfl label{font-size:11px;letter-spacing:.1em;color:var(--mu);font-weight:800;text-transform:uppercase;margin:0 0 3px;display:block}
.pfl input{width:100%;font:inherit;font-size:17px;font-weight:700;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:9px 12px}
.pfl .r2{display:grid;grid-template-columns:90px 1fr;gap:8px}
.pt{display:flex;align-items:center;gap:14px;margin-top:18px;border:1px solid var(--rb,#6b5514);background:linear-gradient(180deg,color-mix(in srgb,var(--rc,#fbbf24) 24%,#0b0b0b),#121212);box-shadow:0 0 20px color-mix(in srgb,var(--rc,#fbbf24) 28%,transparent);border-radius:20px;padding:14px 16px;cursor:pointer}
.pt>svg{width:34px;height:34px;color:var(--gold);flex:none}
.pt div{flex:1;min-width:0}.pt small{display:block;font-size:11px;letter-spacing:.1em;color:var(--rt,#b89a3c);opacity:.8;font-weight:800}
.pt b{display:block;font-size:22px;color:var(--rt,var(--gold));font-weight:800;letter-spacing:.01em}
.pt span{font-size:13px;color:var(--mu);font-weight:600}
.pt em{font-style:normal;color:var(--rt,var(--gold));font-weight:800;font-size:13px;white-space:nowrap}
.at2{margin-top:22px;border-radius:18px;padding:18px 14px 20px;background:linear-gradient(180deg,#181818,#101010);border:1px solid var(--bd)}
.at2 h4{margin:0 0 4px;text-align:center;font:700 22px/1.1 "Arial Narrow","Roboto Condensed",Impact,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#fff}
.ov{text-align:center;margin:8px 0 6px}
.ov svg{width:210px;max-width:70%;height:auto;margin:0 auto}
.ov small{display:block;color:var(--mu);font-weight:700;font-size:13px;letter-spacing:.08em}
.gn{font:700 40px "Arial Narrow","Roboto Condensed",Impact,sans-serif;fill:var(--tx);text-anchor:middle}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:26px 18px;margin-top:20px}
.ac2 h5{margin:0;text-align:center;font:600 17px "Arial Narrow","Roboto Condensed",Impact,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.ac2 svg{width:100%;max-width:150px;height:auto;margin:2px auto 10px;display:block}
.ab{margin-bottom:9px}
.al{display:flex;justify-content:space-between;font:600 15px "Arial Narrow","Roboto Condensed",Impact,sans-serif;color:var(--mu);letter-spacing:.02em}
.al b{color:var(--tx)}
.atk{height:5px;margin-top:3px;background:#262626;border-radius:3px;overflow:hidden}.atk i{display:block;height:100%;background:var(--lt);border-radius:3px;transform-origin:left;animation:gw .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes gw{from{transform:scaleX(0)}}
.gv{animation:ga 1s cubic-bezier(.2,.8,.2,1) both}@keyframes ga{from{stroke-dasharray:0 100}}
.nt2{font-size:12.5px;color:var(--mu);text-align:center;margin-top:14px;line-height:1.4}
.rkb{display:block;width:100%;margin-top:16px;border:1px solid var(--bd);background:#1a1a1a;border-radius:16px;padding:15px;font-weight:800;font-size:16px;color:var(--tx)}
.rl{display:flex;align-items:center;gap:12px;border:1px solid var(--bd);border-left:4px solid var(--rc,var(--bd));background:#101010;border-radius:16px;padding:12px 14px;margin-top:8px}
.rl .n{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid #4a4a48;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--mu)}
.rl div{flex:1;min-width:0}.rl b{display:block;font-size:17px}.rl small{color:var(--mu);font-weight:600;font-size:13px}

async function flushConstanciaCloud(){
 if(!CONSTANCIA_CLOUD_READY||!CONSTANCIA_USER_ID||!CONSTANCIA_DB)return;
 if(CONSTANCIA_SAVING)return;
 CONSTANCIA_SAVING=true;
 const pendingKey=K+':pending:'+CONSTANCIA_USER_ID;
 try{
  do{
   CONSTANCIA_CLOUD_DIRTY=false;
   const snapshot=JSON.stringify(S);
   const result=await CONSTANCIA_DB.from('constancia_data').upsert({user_id:CONSTANCIA_USER_ID,data:JSON.parse(snapshot),updated_at:new Date().toISOString()},{onConflict:'user_id'});
   if(result.error)throw result.error;
   localStorage.setItem(K+':'+CONSTANCIA_USER_ID,snapshot);
   if(localStorage.getItem(pendingKey)===snapshot)localStorage.removeItem(pendingKey);
  }while(CONSTANCIA_CLOUD_DIRTY);

 }catch(error){

flask:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M8 15h8"/>',
trophy:'<path d="M8 4h8v6a4 4 0 0 1-8 0z"/><path d="M8 6H4v2a3 3 0 0 0 4 3M16 6h4v2a3 3 0 0 1-4 3M12 14v4M8 20h8"/>',
apple:'<path d="M12 7c-2-2-7-1-7 5 0 4 3 8 5 8 1 0 1.5-.5 2-.5s1 .5 2 .5c2 0 5-4 5-8 0-6-5-7-7-5z"/><path d="M12 7c0-2 1-3 3-4"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
ban:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
plate:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/>',
shoe:'<path d="M3 16v-3l4-1 3 2h4l4 2v3H3z"/><path d="M3 19h18"/>'
};
const DEFICON={estudo:'book',nutricao:'salad',treino:'dumbbell',financas:'wallet'};
S.skills.forEach(k=>{if(!ICONS[k.icon])k.icon=DEFICON[k.id]||'star'});
const ico=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]||ICONS.star}</svg>`;

function tierOf(n){let i=0;LG.forEach((g,k)=>{if(n>=g[2])i=k});const g=LG[i];return{i,g,p:g[3]==null?1:(n-g[2])/(g[3]-g[2]+1)}}
let DSHOW=false;
function vD(st){
 const rows=S.skills.map(k=>({k,n:st.m[k.id]||0,r:tierOf(st.m[k.id]||0)})).sort((a,b)=>b.r.i-a.r.i||b.r.p-a.r.p||b.n-a.n);
 const vis=DSHOW?rows:rows.slice(0,5);let g='',h='';
 vis.forEach(x=>{const G=x.r.g,C=G[4],TX=lgTx(C);if(G[0]!==g){g=G[0];h+=`<div class="tg" style="color:${TX}">${G[0]}</div>`}
  h+=`<div class="dr" onclick="openSk('${esc(x.k.id)}')"><div class="ic" style="color:${esc(x.k.color||'#e6e6e4')};background:${esc(x.k.color||'#e6e6e4')}1f">${ico(x.k.icon)}</div><div class="bd"><div class="t1"><b>${esc(x.k.name)}</b><span>${x.n} ${x.n===1?'missão':'missões'}</span></div><div class="t2"><span class="bg" style="color:${TX};background:${C}33;border:1px solid ${C}${G[0]==='Lendário'?';border-color:#fff;box-shadow:0 0 10px '+C+'88':''}">${G[0]}${G[1]?' '+G[1]:''}</span><div class="tk"><i style="width:${Math.round(x.r.p*100)}%;background:${C}"></i></div></div></div></div>`});
 if(!rows.length)h+=`<div class="nt2">Nenhuma habilidade ainda. Toque no + para criar.</div>`;
 return `<div class="ds"><div class="dh"><h4>HABILIDADES</h4><button onclick="openSk()" aria-label="Adicionar habilidade">${I.plus}</button></div>${h}${rows.length>5?`<button class="mm" onclick="DSHOW=!DSHOW;render()">${DSHOW?'mostrar menos':'mostrar mais '+(rows.length-5)}</button>`:''}</div>`;
}
let SK=null;
function openSk(id){const k=id&&S.skills.find(x=>x.id===id);SK=k?{id:k.id,name:k.name,icon:k.icon||'star',attrs:(k.attrs||[]).slice(),draft:'',err:''}:{id:null,name:'',icon:'star',attrs:[],draft:'',err:''};renderSk()}
function closeSk(){SK=null;const el=$('#sheet');el.className='';el.innerHTML=''}
function renderSk(f){const el=$('#sheet');if(!SK)return closeSk();
 el.className='open';el.innerHTML=`<div class="bk" onclick="closeSk()"></div><div class="sh"><h3>${SK.id?'Editar':'Nova'} habilidade</h3>
 <label>Nome</label><input value="${esc(SK.name)}" maxlength="24" placeholder="Ex.: Leitura" oninput="SK.name=this.value">
 <label>Ícone</label><div class="eg">${Object.keys(ICONS).map(e=>`<button class="${SK.icon===e?'on':''}" onclick="SK.icon='${e}';renderSk()" aria-label="${e}">${ico(e)}</button>`).join('')}</div>
 <label>Atributos <span style="font-weight:600">(${SK.attrs.length}/6)</span></label>
 ${SK.attrs.length?`<div class="chips">${SK.attrs.map((x,i)=>`<span class="chip">${esc(x)}<button onclick="rmAt(${i})" aria-label="Remover">×</button></span>`).join('')}</div>`:''}
 ${SK.attrs.length<6?`<div class="adr"><input id="ai" value="${esc(SK.draft)}" maxlength="20" placeholder="Novo atributo (ex.: Foco)" oninput="SK.draft=this.value" onkeydown="if(event.key==='Enter'){event.preventDefault();addAt()}"><button onclick="addAt()">+ Adicionar</button></div>`:''}
 <div class="nt">Os atributos aparecem ao criar uma missão dessa habilidade e viram barras no perfil.</div>
 <div class="er">${esc(SK.err)}</div><div class="act"><button class="gh" onclick="closeSk()">Cancelar</button><button onclick="saveSk()">Salvar</button></div>${SK.id?`<div class="act"><button class="gh dang" onclick="delSk()">Excluir habilidade</button></div>`:''}</div>`;if(f){const x=$('#ai');if(x)x.focus()}}
function addAt(){const v=SK.draft.trim().slice(0,20);if(!v||SK.attrs.length>=6)return;if(SK.attrs.some(x=>x.toLowerCase()===v.toLowerCase())){SK.err='Esse atributo já existe.';SK.draft='';return renderSk(true)}SK.attrs.push(v);SK.draft='';SK.err='';renderSk(true)}
function rmAt(i){SK.attrs.splice(i,1);renderSk()}
function saveSk(){if(SK.draft.trim())addAt();const nm=SK.name.trim();if(!nm){SK.err='Dê um nome.';return renderSk()}
 if(S.skills.some(x=>x.id!==SK.id&&x.name.toLowerCase()===nm.toLowerCase())){SK.err='Já existe uma habilidade com esse nome.';return renderSk()}
 const at=SK.attrs.slice(0,6);
 if(SK.id){const k=S.skills.find(x=>x.id===SK.id);k.name=nm;k.icon=SK.icon;k.attrs=at;if(isLifestyle(k))k.color=LIFESTYLE_COLOR;if(isVitalidade(k))k.color=VITALIDADE_COLOR;S.items.forEach(it=>{if(it.skill===k.id)it.attrs=(it.attrs||[]).filter(a=>at.includes(a))})}
 else{const k={id:uid(),name:nm,icon:SK.icon,attrs:at,color:PAL[S.skills.length%PAL.length]};if(isLifestyle(k))k.color=LIFESTYLE_COLOR;if(isVitalidade(k))k.color=VITALIDADE_COLOR;S.skills.push(k)}
 save();closeSk();render()}
function delSk(){ask('Excluir esta habilidade? As missões dela ficam sem habilidade.',()=>{S.items.forEach(it=>{if(it.skill===SK.id){it.skill='';it.attrs=[]}});S.skills=S.skills.filter(x=>x.id!==SK.id);save();closeSk();render()})}
function vP(){
 const P=S.profile,st=stats(),ri=rankOf(st.total),r=RK[ri],nx=RK[ri+1];
 const wr=st.created?Math.min(100,Math.round(st.total/st.created*100)):0,prog=nx?`${st.total} / ${nx[1]} para ${nx[0]}`:'Patente máxima alcançada';
 return `<div class="pfv"><h1>Perfil</h1>
 <div class="ph">
  <label class="pf" style="${P.photo?`background-image:url(${P.photo})`:''}">${P.photo?'':I.pad}<b>${I.plus}</b><input type="file" accept="image/*" onchange="setPhoto(this)"></label>
  <div class="pfl">
   <div><label>Nome</label><input value="${esc(P.name)}" placeholder="Seu nome" onchange="pSet('name',this.value.trim())"></div>
   <div class="r2"><div><label>Idade</label><input inputmode="numeric" maxlength="3" value="${esc(P.age)}" placeholder="--" oninput="this.value=this.value.replace(/\\D/g,'')" onchange="pSet('age',this.value)"></div>
   <div><label>Título militar</label><input value="${esc(P.title)}" placeholder="Ex.: Operador" onchange="pSet('title',this.value.trim())"></div></div>
  </div>
 </div>
 <div class="pt" style="${rkSt(ri)}" onclick="openRanks()"><i class="ins">${insig(ri,72)}</i><div><small>PATENTE ATUAL</small><b>${r[0]}</b><span>${prog}</span></div><em>Ver tabela ›</em></div>
 <div class="cn"><div><small>MISSÕES RECEBIDAS</small><b>${st.created}</b></div><div><small>MISSÕES CONCLUÍDAS</small><b>${st.total}</b></div><div><small>OFENSIVA</small><b style="color:var(--or)">${streak()}<span class="u"> ${streak()===1?'dia':'dias'}</span></b></div><div><small>WIN RATE</small><b style="color:${col(wr)}">${wr}<span class="u">%</span></b></div></div>
 ${vD(st)}
 <div class="at2"><h4>Atributos de combate</h4>
  
  ${st.areas.length?`<div class="ag">${st.areas.map(a=>`<div class="ac2"><h5>${esc(a.k.name)}</h5>${gauge(a.v)}${a.at.map(x=>bar(x[0],x[1],wOf(a.k.id,x[0]))).join('')}</div>`).join('')}</div>`:''}
  
 </div></div>`;
}
function openRanks(){
 const t=stats().total,ci=rankOf(t),el=$('#sheet');
 el.className='open';
 el.innerHTML=`<div class="bk" onclick="closeRanks()"></div><div class="sh pfv"><h3>Tabela de patentes</h3><p class="sub">Patente pelo total de missões concluídas. Você tem <b style="color:var(--tx)">${t}</b>.</p>`+
 RK.map((r,i)=>{const lg=!r[2],cls=i<ci?'ps':i===ci?'cu':lg?'lg':'',rg=r[2]!=null?`${r[1]} a ${r[2]} missões`:`${r[1]}+ missões`,pr=i===ci&&r[2]!=null?Math.round((t-r[1])/(r[2]-r[1]+1)*100):0;
  return `<div class="rl ${cls}" style="${rkSt(i)}"><span class="n">${i<ci?'✓':i+1}</span><i class="ins">${insig(i,56)}</i><div><b>${r[0]}</b><small>${rg}</small>${i===ci&&r[2]!=null?`<div class="rb"><i style="width:${pr}%"></i></div>`:''}</div>${lg?'<em>LENDÁRIO</em>':i===ci?'<em>ATUAL</em>':''}</div>`}).join('')+
 `<div class="act" style="margin-top:16px"><button class="gh" onclick="closeRanks()">Fechar</button></div></div>`;
}
function closeRanks(){const el=$('#sheet');el.className='';el.innerHTML=''}

let GP=0,GR=0,PV={};
function setG(p){const g=document.getElementById('gp');if(!g)return;g.setAttribute('stroke-dasharray',p.toFixed(2)+' 100');const c=document.getElementById('gc'),a=Math.PI*p/100;c.setAttribute('cx',(100-80*Math.cos(a)).toFixed(2));c.setAttribute('cy',(100-80*Math.sin(a)).toFixed(2));c.setAttribute('opacity',p>0.3?1:0);document.getElementById('gt').textContent=Math.round(p)+'%'}
function animG(from,to){cancelAnimationFrame(GR);const t0=performance.now(),D=1400;setG(from);const f=n=>{const k=Math.min(1,(n-t0)/D),e=1-Math.pow(1-k,4);setG(from+(to-from)*e);if(k<1)GR=requestAnimationFrame(f)};GR=requestAnimationFrame(f)}

/* ícones da barra de abas */
const NI={
i:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9.5v10h13v-10"/><path d="M9.5 19.5v-6h5v6"/></svg>`,
c:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6 5-2 8 2 5-2v14l-5 2-8-2-5 2z"/><path d="M8 4v14M16 6v14"/><path d="M17.5 3.5c2.2 0 4 1.8 4 4 0 3-4 7-4 7s-4-4-4-7c0-2.2 1.8-4 4-4z"/><circle cx="17.5" cy="7.5" r="1.2"/></svg>`,j:`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>`,
};
function render(){
 const N=[['i','Início',I.chart],['c','Campo',I.sword],['j','Perfil',I.pad]];
 $('#app').innerHTML=view==='c'?vC():view==='j'?vP():view==='i'?vI():vSoon(N.find(x=>x[0]===view)[1],N.find(x=>x[0]===view)[2]);
 $('#app').insertAdjacentHTML('afterbegin','<button class="central-return" onclick="returnCentral()" type="button">← Central de Aplicativos</button>');
 $('#nav div').innerHTML=N.map(x=>`<button class="${view===x[0]?'on':''}" onclick="go('${x[0]}')">${NI[x[0]]}<span>${x[1]}</span></button>`).join('');
 $('.fab').style.display=view==='c'?'flex':'none';
 lay();
 document.querySelectorAll('.mc[data-k]').forEach(c=>{const k=c.dataset.k,p=+c.dataset.p,pv=PV[k];PV[k]=p;if(pv===undefined||pv===p)return;
  const was=pv===100,now=p===100;if(c.dataset.w==='1'){if(now&&!was){c.classList.remove('ok');void c.offsetWidth;c.classList.add('ok')}else if(was&&!now){c.classList.add('ok');void c.offsetWidth;c.classList.remove('ok')}}
  const el=c.querySelector('.pc'),t0=performance.now();const f=n=>{const q=Math.min(1,(n-t0)/550),e=1-Math.pow(1-q,3);el.textContent=Math.round(pv+(p-pv)*e)+'%';if(q<1)requestAnimationFrame(f)};requestAnimationFrame(f)});
 document.querySelectorAll('.sb[data-k]').forEach(c=>{const k=c.dataset.k,on=c.classList.contains('on')?1:0,pv=PV[k];PV[k]=on;if(pv===undefined||pv===on)return;
  if(on){c.classList.remove('on');void c.offsetWidth;c.classList.add('on')}else{c.classList.add('on');void c.offsetWidth;c.classList.remove('on')}});
 const g=document.getElementById('gp');if(g){const to=+g.dataset.p;animG(GP,to);GP=to}
}
initConstanciaCloud().then(function(){render()}).catch(function(error){console.error('Falha ao iniciar sincronização da Constância:',error);constanciaCloudStatus('Dados locais preservados · nuvem indisponível',true);render()});
</script>
