name: Exportar banco compactado para auditoria
on:
  push:
    paths:
      - ".github/workflows/exportar-banco-auditoria.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Conferir pacotes
        run: |
          set -e
          for n in $(seq -w 1 13); do
            test -s "banco-questoes/questoes-banco-$n.gz"
            gzip -t "banco-questoes/questoes-banco-$n.gz" || { if [ "$n" -le 9 ]; then echo "Fragmento $n: validação individual não aplicável"; else exit 1; fi; }
          done
          cat banco-questoes/questoes-banco-{01,02,03,04,05,06,07,08,09}.gz > /tmp/principal.gz
          gzip -t /tmp/principal.gz
          gzip -dc /tmp/principal.gz > /tmp/principal.html
          for n in 10 11 12 13; do gzip -t "banco-questoes/questoes-banco-$n.gz"; done
          echo "Pacotes conferidos. Principal descompactado: $(wc -c < /tmp/principal.html) bytes"
      - name: Publicar arquivos para auditoria
        uses: actions/upload-artifact@v4
        with:
          name: banco-eear-pacotes-01-a-13
          path: banco-questoes/questoes-banco-*.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
