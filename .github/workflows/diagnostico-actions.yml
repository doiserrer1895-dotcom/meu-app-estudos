name: Diagnóstico do GitHub Actions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar inicialização do runner
        run: |
          echo "GitHub Actions iniciou corretamente."
          echo "Commit: $GITHUB_SHA"
      - name: Verificar arquivos principais do aplicativo
        uses: actions/checkout@v4
      - name: Confirmar arquivos do app
        run: |
          test -s index.html
          test -s nutricao.html
          test -s service-worker.js
          echo "Arquivos principais encontrados."
