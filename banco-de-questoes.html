   const secureClaudeFunction = "async function ai(q,key,model){\n const images=[q.baseImg,q.img].filter(Boolean).map(u=>{\n  const m=/^data:(image\\/(?:jpeg|png|gif|webp));base64,([\\s\\S]+)$/i.exec(u);\n  if(!m)throw new Error(\"A imagem da questão está em formato inválido.\");\n  return {base64:m[2],mediaType:m[1].toLowerCase()};\n });\n if(!images.length)throw new Error(\"Não foi possível preparar a imagem da questão.\");\n const sys='Classifique a questão pelo CONTEÚDO REAL do enunciado e das alternativas, não pela posição no PDF nem pelo cabeçalho anterior. Matemática deve ser Matemática mesmo quando estiver próxima da seção de Inglês; identifique idioma apenas quando o exercício exigir interpretação de língua inglesa. Responda SOMENTE um JSON: {\"d\",\"m\",\"t\",\"c\",\"f\",\"a\",\"n\",\"tm\",\"e\"}. d/m/t/c = disciplina, matéria, tópico e conteúdo específico: use EXATAMENTE os nomes da taxonomia abaixo (d→m→t→[c]); se nada servir, crie um nome curto e coerente. f = \"Fácil\"|\"Médio\"|\"Difícil\". a = letra correta (A-E). n = número de alternativas. tm = minutos estimados (1 a 6). e = explicação passo a passo em português (2 a 5 frases) dizendo por que a alternativa correta está certa. Se a imagem mostrar fórmulas, cálculos, símbolos matemáticos ou problemas numéricos, não classifique como Inglês apenas por conter palavras em inglês. Taxonomia: '+JSON.stringify(TREE);\n const txt=(images.length>1?\"A primeira imagem é o texto-base; a última é a questão. \":\"A imagem é a questão. \")+(q.a>=0?\"Gabarito oficial: \"+LT[q.a]+\".\":\"\");\n const host=window.parent&&window.parent.parent;\n const client=host&&host.__estudosSupabaseClient;\n if(!client||!client.functions||typeof client.functions.invoke!==\"function\")throw new Error(\"Não encontrei a conexão da sua conta com o Supabase. Entre novamente no aplicativo e tente outra vez.\");\n for(let tr=0;tr<2;tr++){\n  try{\n   const result=await client.functions.invoke(\"claude-pdf-analyze\",{body:{images,prompt:sys+\"\\n\"+txt}});\n   if(result.error){let detail=result.error.message||\"Falha ao chamar o serviço seguro do Claude.\";try{const ctx=result.error.context;if(ctx&&typeof ctx.clone===\"function\"){const payload=await ctx.clone().json();detail=payload.error||payload.message||detail}}catch(e){}throw new Error(detail)}\n   const responseText=String(result.data&&result.data.text||\"\");\n   const start=responseText.indexOf(\"{\"),end=responseText.lastIndexOf(\"}\");\n   if(start<0||end<=start)throw new Error(\"O Claude não retornou uma classificação em JSON válida.\");\n   return JSON.parse(responseText.slice(start,end+1));\n  }catch(e){if(tr)throw e;await new Promise(r=>setTimeout(r,1200))}\n }\n}";
   const aiStart=html.indexOf('async function ai(q,key,model){');

   replaceExact("W.gab=$(\"imG\").value;W.ai=$(\"imU\").checked;W.key=$(\"imK\").value.trim();W.model=$(\"imM\").value.trim();","W.gab=$(\"imG\").value;W.ai=$(\"imU\").checked;",'leitura da chave');

   html=html.replace(/<head([^>]*)>/i,'<head$1><base href="'+new URL('.',location.href).href+'">');

 }
 const allowed=new Set(['eear-question-taxonomy-full','eear-question-taxonomy','eear-question-attempt']);

   if(bridgeInstalled)return;

   (function(){
    'use strict';
    const norm=s=>String(s||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/[._-]+/g,' ').replace(/\\s+/g,' ').trim();
    const family=s=>norm(s).replace(/\\s+(?:[123]|i{1,3})$/i,'').trim();
    function canonical(s){return norm(s)}
    function publishTaxonomy(){
     if(typeof TREE==='undefined'||!TREE||typeof TREE!=='object')return false;
     const hierarchy={},taxonomy={};
     Object.keys(TREE).forEach(key=>{
      const subject=String(key||'').trim(),tree=TREE[key]||{};
      hierarchy[subject]=tree;
      taxonomy[subject]=[...new Set(Object.values(tree).flatMap(node=>Object.keys(node||{})))];
     });
     window.parent.postMessage({type:'eear-question-taxonomy-full',hierarchy},location.origin);
     window.parent.postMessage({type:'eear-question-taxonomy',taxonomy},location.origin);
     return true;
    }
    window.addEventListener('message',function(event){
     if(event.source!==window.parent||event.origin!==location.origin)return;
     const msg=event.data;
     if(!msg||msg.type!=='app-question-filter'||!msg.filter||typeof S==='undefined')return;
     const f=msg.filter,keys=Object.keys(TREE||{}),wanted=canonical(f.subject),exact=keys.find(k=>canonical(k)===wanted),familyMatches=keys.filter(k=>family(k)===family(f.subject)),disc=exact||(familyMatches.length===1?familyMatches[0]:'');
     S.banca=[];S.disc=disc?[disc]:[];S.mat=f.matter?[f.matter]:[];
     S.top=f.content?[f.content]:[];S.cont=f.specific?[f.specific]:[];S.dif=[];
     provaSel=null;
     if(typeof prune==='function')prune();
     if(typeof render==='function')render();
    });
    document.addEventListener('click',function(event){
     const button=event.target&&event.target.closest?event.target.closest('.opt'):null;
     if(!button||typeof Q==='undefined'||typeof ans==='undefined')return;
     const index=Number(button.dataset.q),question=Q[index];

     setTimeout(function(){
      const selected=ans[index];

      const attempt={
       source:'banco',
       subject:String(question.d||'').trim(),
       topic:String(question.t||question.m||'Geral').trim(),
       correct:selected===question.a,
       questionId:String(question.id||''),
       eventId:'bq-'+String(question.id||index)+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),
       date:new Date().toISOString().slice(0,10)
      };
      window.parent.postMessage({type:'eear-question-attempt',attempt},location.origin);
     },0);
    },true);
    let taxonomyAttempts=0;
    const taxonomyTimer=setInterval(function(){if(publishTaxonomy()||++taxonomyAttempts>=80)clearInterval(taxonomyTimer)},250);
   })();
   `;
   (doc.head||doc.documentElement).appendChild(bridge);
   window.parent.postMessage({type:'eear-question-bank-ready'},location.origin);
   if(pendingFilter){bank.contentWindow.postMessage(pendingFilter,location.origin);pendingFilter=null;}

 }
