<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Banco de Questões</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;min-height:100%;margin:0;overflow:hidden;background:#050505}
#bank{display:block;width:100%;height:100%;min-height:100%;border:0;background:#050505}
</style>
</head>
<body>
<iframe id="bank" title="Banco de Questões EEAR" src="banco-de-questoes%20(2).html?v=20261123e" allow="fullscreen"></iframe>
<script>
(function(){
 'use strict';
 const bank=document.getElementById('bank');
 const allowed=new Set(['eear-question-taxonomy-full','eear-question-taxonomy','eear-question-attempt']);
 let bridgeInstalled=false;
 function installBridge(){
  if(!bank.contentWindow||!bank.contentDocument)return;
  const doc=bank.contentDocument;
  if(!doc.documentElement||!doc.body)return;
  try{
   let layout=doc.getElementById('question-bank-responsive-layout');
   if(!layout){
    layout=doc.createElement('style');
    layout.id='question-bank-responsive-layout';
    (doc.head||doc.documentElement).appendChild(layout);
   }
   layout.textContent='nav,#nav{display:none!important;height:0!important;min-height:0!important;visibility:hidden!important;pointer-events:none!important}html,body{width:100%!important;max-width:100%!important;min-width:0!important;margin:0!important;overflow-x:hidden!important}html{height:100%!important;zoom:1!important;overflow-y:auto!important;scrollbar-width:auto!important;-ms-overflow-style:auto!important;overscroll-behavior:contain!important}body{height:auto!important;min-height:100%!important;overflow-y:visible!important}*:not(html){scrollbar-width:none!important;-ms-overflow-style:none!important}*:not(html)::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}html{scrollbar-width:none!important;-ms-overflow-style:none!important}html::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}#app{padding-bottom:24px!important}.fab{bottom:24px!important}#app,.app{display:block!important;width:100%!important;max-width:none!important;min-width:0!important;height:auto!important;max-height:none!important;overflow-x:clip!important;overflow-y:visible!important;margin:0!important;transform:none!important;zoom:1!important;padding-left:clamp(10px,1.5vw,22px)!important;padding-right:clamp(10px,1.5vw,22px)!important;box-sizing:border-box!important}#app>*,.app>*{width:auto;min-width:0!important;max-width:100%!important;box-sizing:border-box!important}img,svg,canvas{max-width:100%!important}';
   if(bridgeInstalled)return;
   bridgeInstalled=true;
   const bridge=doc.createElement('script');
   bridge.textContent=`
   (function(){
    'use strict';
    const norm=s=>String(s||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().trim();
    function canonical(s){
     const n=norm(s).replace(/\\s+/g,' ');
     if(n==='lingua portuguesa'||n==='portugues')return 'Português';
     if(/^matematica(?:\\s*[123])?$/.test(n))return 'Matemática';
     if(/^fisica(?:\\s*[123])?$/.test(n))return 'Física';
     if(n==='ingles')return 'Inglês';
     return s;
    }
    function publishTaxonomy(){
     if(typeof TREE==='undefined')return;
     const hierarchy={},taxonomy={};
     Object.keys(TREE).forEach(key=>{
      const subject=canonical(key),tree=TREE[key]||{};
      hierarchy[subject]=tree;
      taxonomy[subject]=[...new Set(Object.values(tree).flatMap(node=>Object.keys(node||{})))];
     });
     window.parent.postMessage({type:'eear-question-taxonomy-full',hierarchy},location.origin);
     window.parent.postMessage({type:'eear-question-taxonomy',taxonomy},location.origin);
    }
    window.addEventListener('message',function(event){
     if(event.source!==window.parent||event.origin!==location.origin)return;
     const msg=event.data;
     if(!msg||msg.type!=='app-question-filter'||!msg.filter||typeof S==='undefined')return;
     const f=msg.filter,disc=Object.keys(TREE||{}).find(k=>canonical(k)===canonical(f.subject));
     S.banca=[];S.disc=disc?[disc]:[];S.mat=f.matter?[f.matter]:[];
     S.top=f.content?[f.content]:[];S.cont=f.specific?[f.specific]:[];S.dif=[];
     provaSel=null;
     if(typeof prune==='function')prune();
     if(typeof render==='function')render();
    });
    document.addEventListener('click',function(event){
     const button=event.target&&event.target.closest?event.target.closest('.opt'):null;
     if(!button||typeof Q==='undefined'||typeof ans==='undefined')return;
     const index=Number(button.dataset.q),question=Q[index];
     if(!question)return;
     setTimeout(function(){
      const selected=ans[index];
      if(selected===undefined)return;
      const attempt={
       source:'banco',
       subject:String(question.d||'').trim(),
       topic:String(question.t||question.m||'Geral').trim(),
       correct:selected===question.a,
       questionId:String(question.id||''),
       eventId:'bq-'+String(question.id||index)+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),
       date:new Date().toISOString().slice(0,10)
      };
      window.parent.postMessage({type:'eear-question-attempt',attempt},location.origin);
     },0);
    },true);
    publishTaxonomy();
   })();
   `;
   (doc.head||doc.documentElement).appendChild(bridge);
  }catch(error){bridgeInstalled=false;console.error('Falha ao instalar integração do Banco de Questões:',error)}
 }
 bank.addEventListener('load',installBridge);
 window.addEventListener('message',function(event){
  if(event.source===bank.contentWindow){
   const data=event.data;
   if(data&&allowed.has(data.type))window.parent.postMessage(data,location.origin);
   return;
  }
  if(event.source===window.parent&&event.origin===location.origin){
   const data=event.data;
   if(data&&data.type==='app-question-filter'&&bank.contentWindow)bank.contentWindow.postMessage(data,location.origin);
  }
 });
})();
</script>
</body>
</html>
