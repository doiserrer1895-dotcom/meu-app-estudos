(function(){

 const bank=document.getElementById('bank');
 async function loadBankWithPdfFixes(){
  try{

   const response=await fetch(source,{cache:'no-store'});

   let html=await response.text();
   const patches=[
    [String.raw`const MK=/^\s*(?:QUEST[ÃA]O\s*[:\-–]?\s*)?(\d{1,3})\s*(?:[.)\-–—:º°]|(?=\s|$))/i,QW=/^\s*QUEST[ÃA]O\s*\d/i,OPT=/^\s*\(?\s*([A-Ea-e])\s*[).\-–]\s*\S/;`,String.raw`const MK=/^\s*(?:QUEST[ÃA]O\s*[:\-–]?\s*)?(\d{1,3})\s*(?:[.)\-–—:º°]|(?=\s|$))/i,QW=/^\s*QUEST[ÃA]O\s*\d/i,OPT=/^\s*\(?\s*([A-Ea-e])\s*[).\-–]\s*\S/;`],
    [String.raw`const DH=[[/^lingua portuguesa|^portugues/,"Língua Portuguesa"],[/^matematica/,"Matemática"],[/^fisica/,"Física"],[/^(lingua )?ingles|^english/,"Inglês"]];`,String.raw`const DH=[[/^lingua portuguesa|^portugues/,"Língua Portuguesa"],[/^matematica/,"Matemática"],[/^fisica/,"Física"],[/^(lingua )?ingles|^english/,"Inglês"]];`],
    [String.raw`function detect(L){
 const qs=[];let exp=1,last=-1;
 L.forEach((l,i)=>{
  const m=MK.exec(l.t);if(!m)return;const n=+m[1],w=QW.test(l.t);
  if(!(n===exp||(n===1&&qs.length)||(!qs.length&&w)))return;
  if(qs.length){let o=0;for(let j=last;j<i;j++)if(OPT.test(L[j].t))o++;if(o<2)return}
  let ok=false;
  for(let j=i;j<Math.min(i+40,L.length);j++){if(j>i&&QW.test(L[j].t))break;const q=OPT.exec(L[j].t);if(q&&/a/i.test(q[1])){ok=true;break}}
  if(ok){qs.push({n,i,seq:qs.length+1});exp=n+1;last=i}
 });
 return qs;
}`,String.raw`function detect(L){
 const qs=[];let exp=1,last=-1;
 L.forEach((l,i)=>{
  const m=MK.exec(l.t);if(!m)return;const n=+m[1],w=QW.test(l.t);
  if(!(n===exp||(n===1&&qs.length)||(!qs.length&&w)))return;
  if(qs.length){let o=0;for(let j=last;j<i;j++)if(OPT.test(L[j].t))o++;if(o<2)return}
  let ok=false;
  for(let j=i;j<Math.min(i+40,L.length);j++){if(j>i&&QW.test(L[j].t))break;const q=OPT.exec(L[j].t);if(q&&/a/i.test(q[1])){ok=true;break}}
  if(ok){qs.push({n,i,seq:qs.length+1});exp=n+1;last=i}
 });
 return qs;
}`],
    [String.raw`function bounds(L,qs,B){
 const bs={};B.forEach(b=>b.qs.forEach(q=>bs[q.seq]=b));
 qs.forEach((q,k)=>{
  const nx=qs[k+1],hard=nx?(bs[nx.seq]&&bs[nx.seq].qs[0]===nx?bs[nx.seq].start:nx.i):L.length,lim=hard-1;
  let lo=-1,ex="a";
  for(let j=q.i;j<=lim;j++){const o=OPT.exec(L[j].t);if(o&&o[1].toLowerCase()===ex){lo=j;ex=String.fromCharCode(ex.charCodeAt(0)+1)}}
  q.nopt=lo<0?0:ex.charCodeAt(0)-97;q.s=q.i;q.e=lim;
  if(lo>=0){let e=lo;const h=L[lo].bot-L[lo].top;
   while(e<lim&&e-lo<4){const a=L[e],b=L[e+1];if(a.p!==b.p||a.c!==b.c||b.top-a.bot>.9*h||OPT.test(b.t)||MK.test(b.t)||(b.t.length>6&&b.t===b.t.toUpperCase()))break;e++}
   q.e=e}
  q.base=bs[q.seq]||null;
 });
}`,String.raw`function bounds(L,qs,B){
 const bs={};B.forEach(b=>b.qs.forEach(q=>bs[q.seq]=b));
 qs.forEach((q,k)=>{
  const nx=qs[k+1],hard=nx?(bs[nx.seq]&&bs[nx.seq].qs[0]===nx?bs[nx.seq].start:nx.i):L.length,lim=hard-1;
  let lo=-1,ex="a";
  for(let j=q.i;j<=lim;j++){const o=OPT.exec(L[j].t);if(o&&o[1].toLowerCase()===ex){lo=j;ex=String.fromCharCode(ex.charCodeAt(0)+1)}}
  q.nopt=lo<0?0:ex.charCodeAt(0)-97;q.s=q.i;q.e=lim;
  if(lo>=0){let e=lo;const h=L[lo].bot-L[lo].top;
   while(e<lim&&e-lo<4){const a=L[e],b=L[e+1];if(a.p!==b.p||a.c!==b.c||b.top-a.bot>.9*h||OPT.test(b.t)||MK.test(b.t)||(b.t.length>6&&b.t===b.t.toUpperCase()))break;e++}
   q.e=e}
  q.base=bs[q.seq]||null;
 });
}`],
    [String.raw`return G.map((g,k)=>{const{W,H,two}=P[g.p];return{p:g.p,x0:two?g.c*W/2:0,x1:two?(g.c+1)*W/2:W,y0:k?.045*H:Math.max(.045*H,L[g.s].top-5),y1:k<G.length-1?.955*H:Math.min(.955*H,L[g.e].bot+6)}});`,String.raw`return G.map((g,k)=>{const{W,H,two}=P[g.p];return{p:g.p,x0:two?g.c*W/2:0,x1:two?(g.c+1)*W/2:W,y0:k?.045*H:Math.max(.045*H,L[g.s].top-5),y1:k<G.length-1?.955*H:Math.min(.955*H,L[g.e].bot+6)}});`],
    [String.raw`if(!d&&(n.match(/\b(the|of|and|is|that|with|are|was|which|according)\b/g)||[]).length>6)d=IN;`,String.raw`if(!d&&(n.match(/\b(the|of|and|is|that|with|are|was|which|according)\b/g)||[]).length>6)d=IN;`],
    [String.raw`const secs=[];L.forEach((l,i)=>{if(l.t.length<45&&l.t===l.t.toUpperCase()){const n=norm(l.t);const h=DH.find(d=>d[0].test(n));if(h)secs.push({i,d:h[1]})}});`,String.raw`const secs=[];L.forEach((l,i)=>{if(l.t.length<45&&l.t===l.t.toUpperCase()){const n=norm(l.t);const h=DH.find(d=>d[0].test(n));if(h)secs.push({i,d:h[1]})}});`],
   ];
   for(const [before,after] of patches){
    if(!html.includes(before))throw new Error('Não encontrei um trecho esperado da ferramenta Importar PDF.');
    html=html.replace(before,after);
   }

   const secureClaudeFunction = "async function ai(q,key,model){\n const images=[q.baseImg,q.img].filter(Boolean).map(u=>{\n  const m=/^data:(image\\/(?:jpeg|png|gif|webp));base64,([\\s\\S]+)$/i.exec(u);\n  if(!m)throw new Error(\"A imagem da questão está em formato inválido.\");\n  return {base64:m[2],mediaType:m[1].toLowerCase()};\n });\n if(!images.length)throw new Error(\"Não foi possível preparar a imagem da questão.\");\n const sys='Classifique a questão pelo CONTEÚDO REAL do enunciado e das alternativas, não pela posição no PDF nem pelo cabeçalho anterior. Matemática deve ser Matemática mesmo quando estiver próxima da seção de Inglês; identifique idioma apenas quando o exercício exigir interpretação de língua inglesa. Responda SOMENTE um JSON: {\"d\",\"m\",\"t\",\"c\",\"f\",\"a\",\"n\",\"tm\",\"e\"}. d/m/t/c = disciplina, matéria, tópico e conteúdo específico: use EXATAMENTE os nomes da taxonomia abaixo (d→m→t→[c]); se nada servir, crie um nome curto e coerente. f = \"Fácil\"|\"Médio\"|\"Difícil\". a = letra correta (A-E). n = número de alternativas. tm = minutos estimados (1 a 6). e = explicação passo a passo em português (2 a 5 frases) dizendo por que a alternativa correta está certa. Se a imagem mostrar fórmulas, cálculos, símbolos matemáticos ou problemas numéricos, não classifique como Inglês apenas por conter palavras em inglês. Taxonomia: '+JSON.stringify(TREE);\n const txt=(images.length>1?\"A primeira imagem é o texto-base; a última é a questão. \":\"A imagem é a questão. \")+(q.a>=0?\"Gabarito oficial: \"+LT[q.a]+\".\":\"\");\n const host=window.parent&&window.parent.parent;\n const client=host&&host.__estudosSupabaseClient;\n if(!client||!client.functions||typeof client.functions.invoke!==\"function\")throw new Error(\"Não encontrei a conexão da sua conta com o Supabase. Entre novamente no aplicativo e tente outra vez.\");\n for(let tr=0;tr<2;tr++){\n  try{\n   const result=await client.functions.invoke(\"claude-pdf-analyze\",{body:{images,prompt:sys+\"\\n\"+txt}});\n   if(result.error){let detail=result.error.message||\"Falha ao chamar o serviço seguro do Claude.\";try{const ctx=result.error.context;if(ctx&&typeof ctx.clone===\"function\"){const payload=await ctx.clone().json();detail=payload.error||payload.message||detail}}catch(e){}throw new Error(detail)}\n   const responseText=String(result.data&&result.data.text||\"\");\n   const start=responseText.indexOf(\"{\"),end=responseText.lastIndexOf(\"}\");\n   if(start<0||end<=start)throw new Error(\"O Claude não retornou uma classificação em JSON válida.\");\n   return JSON.parse(responseText.slice(start,end+1));\n  }catch(e){if(tr)throw e;await new Promise(r=>setTimeout(r,1200))}\n }\n}";
   const aiStart=html.indexOf('async function ai(q,key,model){');
   const aiEnd=html.indexOf('/* ---------- persistência ---------- */',aiStart);
   if(aiStart<0||aiEnd<0)throw new Error('Não encontrei a função original de classificação.');
   html=html.slice(0,aiStart)+secureClaudeFunction+'\n'+html.slice(aiEnd);
   function replaceExact(before,after,label){
    const first=html.indexOf(before);
    if(first<0||html.indexOf(before,first+before.length)>=0)throw new Error('Integração segura: trecho '+label+' não encontrado de forma única.');
    html=html.slice(0,first)+after+html.slice(first+before.length);
   }
   replaceExact("let key=\"\",model=\"claude-sonnet-5-5\",useAi=false;try{key=localStorage.getItem(\"bq-key\")||\"\";model=localStorage.getItem(\"bq-model\")||model;useAi=!!key}catch(e){}","let useAi=true;",'configuração inicial da IA');
   const keyUiStart=html.indexOf('<div class="ig2"><label>Chave da API Anthropic');
   const keyUiEnd=html.indexOf('api.anthropic.com.</small>',keyUiStart);
   if(keyUiStart<0||keyUiEnd<0)throw new Error('Não encontrei o campo antigo da chave.');
   html=html.slice(0,keyUiStart)+'<small>A classificação é feita pelo Claude usando a chave protegida no servidor. Você não precisa informar nem armazenar chave neste navegador.</small>'+html.slice(keyUiEnd+'api.anthropic.com.</small>'.length);
   replaceExact("W.gab=$(\"imG\").value;W.ai=$(\"imU\").checked;W.key=$(\"imK\").value.trim();W.model=$(\"imM\").value.trim();","W.gab=$(\"imG\").value;W.ai=$(\"imU\").checked;",'leitura da chave');
   replaceExact("if(W.ai&&!W.key)return toast(\"Cole a chave da API ou desmarque a IA\");",'','validação da chave');
   replaceExact("try{if(W.key){localStorage.setItem(\"bq-key\",W.key);localStorage.setItem(\"bq-model\",W.model)}}catch(e){}",'','armazenamento local da chave');
   html=html.replace(/<head([^>]*)>/i,'<head$1><base href="'+new URL('.',location.href).href+'">');
   bank.addEventListener('load',installBridge,{once:true});
   bank.srcdoc=html;
  }catch(error){
   console.error('Falha ao aplicar correções do Importar PDF:',error);
   bank.srcdoc='<!doctype html><html lang="pt-BR"><meta charset="utf-8"><body style="margin:0;padding:24px;background:#080808;color:#fff;font:14px system-ui">Não foi possível carregar o Banco de Questões com as correções do Importar PDF. Atualize a página e tente novamente.</body></html>';
  }
 }
 const allowed=new Set(['eear-question-taxonomy-full','eear-question-taxonomy','eear-question-attempt']);
 let bridgeInstalled=false,pendingFilter=null;
 function installBridge(){
  if(!bank.contentWindow||!bank.contentDocument)return;
  const doc=bank.contentDocument;
  if(!doc.documentElement||!doc.body)return;
  try{
   let layout=doc.getElementById('question-bank-responsive-layout');
   if(!layout){
    layout=doc.createElement('style');
    layout.id='question-bank-responsive-layout';
    (doc.head||doc.documentElement).appendChild(layout);
   }
   layout.textContent='nav,#nav{display:none!important;height:0!important;min-height:0!important;visibility:hidden!important;pointer-events:none!important}html,body{width:100%!important;max-width:100%!important;min-width:0!important;margin:0!important;overflow-x:hidden!important}html{height:100%!important;zoom:1!important;overflow-y:auto!important;scrollbar-width:auto!important;-ms-overflow-style:auto!important;overscroll-behavior:contain!important}body{height:auto!important;min-height:100%!important;overflow-y:visible!important}*:not(html){scrollbar-width:none!important;-ms-overflow-style:none!important}*:not(html)::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}html{scrollbar-width:thin!important;scrollbar-color:#888 #171717!important;-ms-overflow-style:auto!important}html::-webkit-scrollbar{display:block!important;visibility:visible!important;width:8px!important;height:8px!important;background:#171717!important}html::-webkit-scrollbar-track{display:block!important;background:#171717!important}html::-webkit-scrollbar-thumb{display:block!important;visibility:visible!important;background:#888!important;border:1px solid #171717!important;border-radius:8px!important}html::-webkit-scrollbar-thumb:hover{background:#aaa!important}#app{padding-bottom:24px!important}.fab{bottom:24px!important}#app,.app{display:block!important;width:100%!important;max-width:none!important;min-width:0!important;height:auto!important;max-height:none!important;overflow-x:clip!important;overflow-y:visible!important;margin:0!important;transform:none!important;zoom:1!important;padding-left:clamp(10px,1.5vw,22px)!important;padding-right:clamp(10px,1.5vw,22px)!important;box-sizing:border-box!important}#app>*,.app>*{width:auto;min-width:0!important;max-width:100%!important;box-sizing:border-box!important}img,svg,canvas{max-width:100%!important}';
   if(bridgeInstalled)return;
   bridgeInstalled=true;
   const bridge=doc.createElement('script');
   bridge.textContent=`
   (function(){
    'use strict';
    const norm=s=>String(s||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/[._-]+/g,' ').replace(/\\s+/g,' ').trim();
    const family=s=>norm(s).replace(/\\s+(?:[123]|i{1,3})$/i,'').trim();
    function canonical(s){return norm(s)}
    function publishTaxonomy(){
     if(typeof TREE==='undefined'||!TREE||typeof TREE!=='object')return false;
     const hierarchy={},taxonomy={};
     Object.keys(TREE).forEach(key=>{
      const subject=String(key||'').trim(),tree=TREE[key]||{};
      hierarchy[subject]=tree;
      taxonomy[subject]=[...new Set(Object.values(tree).flatMap(node=>Object.keys(node||{})))];
     });
     window.parent.postMessage({type:'eear-question-taxonomy-full',hierarchy},location.origin);
     window.parent.postMessage({type:'eear-question-taxonomy',taxonomy},location.origin);
     return true;
    }
    window.addEventListener('message',function(event){
     if(event.source!==window.parent||event.origin!==location.origin)return;
     const msg=event.data;
     if(!msg||msg.type!=='app-question-filter'||!msg.filter||typeof S==='undefined')return;
     const f=msg.filter,keys=Object.keys(TREE||{}),wanted=canonical(f.subject),exact=keys.find(k=>canonical(k)===wanted),familyMatches=keys.filter(k=>family(k)===family(f.subject)),disc=exact||(familyMatches.length===1?familyMatches[0]:'');
     S.banca=[];S.disc=disc?[disc]:[];S.mat=f.matter?[f.matter]:[];
     S.top=f.content?[f.content]:[];S.cont=f.specific?[f.specific]:[];S.dif=[];
     provaSel=null;
     if(typeof prune==='function')prune();
     if(typeof render==='function')render();
    });
    document.addEventListener('click',function(event){
     const button=event.target&&event.target.closest?event.target.closest('.opt'):null;
     if(!button||typeof Q==='undefined'||typeof ans==='undefined')return;
     const index=Number(button.dataset.q),question=Q[index];
     if(!question)return;
     setTimeout(function(){
      const selected=ans[index];
      if(selected===undefined)return;
      const attempt={
       source:'banco',
       subject:String(question.d||'').trim(),
       topic:String(question.t||question.m||'Geral').trim(),
       correct:selected===question.a,
       questionId:String(question.id||''),
       eventId:'bq-'+String(question.id||index)+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),
       date:new Date().toISOString().slice(0,10)
      };
      window.parent.postMessage({type:'eear-question-attempt',attempt},location.origin);
     },0);
    },true);
    let taxonomyAttempts=0;
    const taxonomyTimer=setInterval(function(){if(publishTaxonomy()||++taxonomyAttempts>=80)clearInterval(taxonomyTimer)},250);
   })();
   `;
   (doc.head||doc.documentElement).appendChild(bridge);
   window.parent.postMessage({type:'eear-question-bank-ready'},location.origin);
   if(pendingFilter){bank.contentWindow.postMessage(pendingFilter,location.origin);pendingFilter=null;}
  }catch(error){bridgeInstalled=false;console.error('Falha ao instalar integração do Banco de Questões:',error)}
 }
 loadBankWithPdfFixes();
 window.addEventListener('message',function(event){
  if(event.source===bank.contentWindow){
   const data=event.data;
   if(data&&allowed.has(data.type))window.parent.postMessage(data,location.origin);
   return;
  }
  if(event.source===window.parent&&event.origin===location.origin){
   const data=event.data;
   if(data&&data.type==='app-question-filter'&&bank.contentWindow){if(bridgeInstalled)bank.contentWindow.postMessage(data,location.origin);else pendingFilter=data;}
  }
 });
})();
