<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leitor de tópicos — diagnóstico</title><body style="font:16px system-ui;background:#111;color:#fff;padding:20px"><h2>Leitor de tópicos de Matemática</h2><p id="status">Carregando o banco de questões… aguarde.</p><pre id="out" style="white-space:pre-wrap;background:#222;padding:16px;border-radius:8px"></pre><button id="copy" disabled style="padding:12px">Copiar lista</button><iframe id="reader" src="../questoes.html" style="position:absolute;width:1px;height:1px;opacity:.01;pointer-events:none"></iframe><script>
const status=document.getElementById('status'),out=document.getElementById('out'),copy=document.getElementById('copy');let result='';
window.addEventListener('message',e=>{if(e.source!==document.getElementById('reader').contentWindow||e.data?.type!=='eear-question-taxonomy')return;const tax=e.data.taxonomy||{};const math=Object.entries(tax).find(([k])=>/matem.tica/i.test(k));if(!math){status.textContent='Banco carregado, mas a disciplina Matemática não foi localizada.';return}const topics=math[1],selected=topics.filter(t=>/tri.ngul/i.test(t));result='DISCIPLINA: '+math[0]+'\nTÓPICOS COM “TRIÂNGULOS” ('+selected.length+'):\n'+(selected.length?selected.map((t,i)=>(i+1)+'. '+t).join('\n'):'Nenhum tópico encontrado.')+'\n\nTODOS OS TÓPICOS DE MATEMÁTICA ('+topics.length+'):\n'+topics.map((t,i)=>(i+1)+'. '+t).join('\n');out.textContent=result;status.textContent='Leitura concluída.';copy.disabled=false});
copy.onclick=async()=>{await navigator.clipboard.writeText(result);status.textContent='Lista copiada. Cole-a aqui na conversa.'};
</script></body></html>
