<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Nutrição | Diário de Estudos</title>
  <style>
    :root{color-scheme:dark;--bg:#0a0a0a;--card:#121212;--line:#303030;--text:#fff;--muted:#a3a3a3;--accent:#f5f5f5;--input:#1c1c1c}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:15px Inter,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    main{max-width:520px;margin:0 auto;padding:22px 16px 48px}
    header{display:flex;align-items:center;gap:12px;margin:4px 0 26px}
    header a{color:var(--text);text-decoration:none;font-size:24px;padding:4px 10px 4px 0}
    h1{font-size:25px;margin:0;letter-spacing:-.03em}
    .sub{color:var(--muted);margin:6px 0 22px;line-height:1.5}
    section{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0}
    h2{font-size:17px;margin:0 0 8px}
    p{color:var(--muted);line-height:1.5;margin:0 0 14px}
    label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
    input,select,textarea{width:100%;background:var(--input);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px;font:inherit}
    textarea{min-height:90px;resize:vertical}
    button{width:100%;border:0;border-radius:13px;background:var(--accent);color:#111;font-weight:700;font-size:15px;padding:13px;margin-top:16px;cursor:pointer}
    .note{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
    .status{min-height:20px;color:#4ade80;font-size:13px;margin-top:10px}
  </style>
</head>
<body>
  <main>
    <header><a href="./index.html" aria-label="Voltar ao início">←</a><h1>Nutrição</h1></header>
    <p class="sub">Sua área de alimentação começa do zero. Nenhuma meta ou informação foi preenchida previamente.</p>
    <section>
      <h2>Configuração inicial</h2>
      <p>Preencha apenas o que quiser. Você pode alterar essas informações depois.</p>
      <form id="nutrition-form">
        <label for="goal">Qual é seu objetivo?</label>
        <select id="goal" name="goal">
          <option value="">Selecione (opcional)</option>
          <option value="organizar">Organizar minha alimentação</option>
          <option value="manter">Manter o peso</option>
          <option value="ganhar">Ganhar peso ou massa</option>
          <option value="perder">Perder peso</option>
          <option value="outro">Outro</option>
        </select>
        <label for="notes">Anotações (opcional)</label>
        <textarea id="notes" name="notes" placeholder="Escreva aqui o que deseja acompanhar..."></textarea>
        <button type="submit">Salvar configuração</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </form>
    </section>
    <p class="note">As informações ficam salvas neste dispositivo.</p>
  </main>
  <script>
    const form = document.getElementById('nutrition-form');
    const status = document.getElementById('status');
    try {
      const saved = JSON.parse(localStorage.getItem('nutritionSetup') || '{}');
      if (saved.goal) form.elements.goal.value = saved.goal;
      if (saved.notes) form.elements.notes.value = saved.notes;
    } catch (_) {}
    form.addEventListener('submit', event => {
      event.preventDefault();
      const data = {goal: form.elements.goal.value, notes: form.elements.notes.value};
      try {
        localStorage.setItem('nutritionSetup', JSON.stringify(data));
        status.textContent = 'Configuração salva.';
      } catch (_) {
        status.textContent = 'Não foi possível salvar neste navegador.';
      }
    });
  </script>
</body>
</html>
