function delP(id){S.market=S.market.filter(x=>x.id!==id);save();render()}

function vC(){const lb=S.body[S.body.length-1]||{},pb=S.body[S.body.length-2];
 const fig=`<svg viewBox="0 0 200 250"><g transform="translate(40 0)" fill="var(--in)" stroke="var(--ac)" stroke-width="1.5"><circle cx="60" cy="22" r="16"/><rect x="38" y="42" width="44" height="86" rx="16"/><rect x="22" y="46" width="14" height="84" rx="7"/><rect x="84" y="46" width="14" height="84" rx="7"/><rect x="40" y="124" width="18" height="118" rx="9"/><rect x="62" y="124" width="18" height="118" rx="9"/></g>`+
 M.map(([k,n,y,r])=>`<text x="${r?198:2}" y="${y-8}" text-anchor="${r?'end':'start'}" fill="var(--mu)" font-size="9">${n}</text><text x="${r?198:2}" y="${y+4}" text-anchor="${r?'end':'start'}" fill="var(--ac)" font-size="12" font-weight="700">${lb[k]?f1(lb[k])+' cm':'—'}</text><line x1="${r?150:50}" x2="${r?138:62}" y1="${y}" y2="${y}" stroke="var(--ac)" stroke-dasharray="2 2"/>`).join('')+`</svg>`;
 const imc=lb.pe&&lb.al?lb.pe/((lb.al/100)**2):0,dp=pb&&lb.pe?lb.pe-pb.pe:0;
 return`<div class="top">Avaliação corporal<small>Leve estes dados para a nutricionista</small></div>
 <div class="tiles"><div class="tile"><small>Peso</small><b>${lb.pe?f1(lb.pe)+' kg':'—'}</b><small>${pb&&lb.pe?(dp>0?'+':'')+f1(dp)+' kg vs anterior':'último registro'}</small></div><div class="tile"><small>IMC</small><b>${imc?f1(imc):'—'}</b><small>${lb.gd?f1(lb.gd)+'% de gordura':'gordura: —'}</small></div></div>
 <div class="card"><h2>Medidas</h2><div class="body">${fig}<div>${M.map(([k,n])=>`<label style="margin-top:6px">${n} (cm)</label><input id="b_${k}" type="number" step="0.1" min="0" inputmode="decimal" value="${lb[k]||''}">`).join('')}</div></div>
 <div class="three"><div><label>Peso (kg)</label><input id="b_pe" type="number" step="0.1" value="${lb.pe||''}"></div><div><label>Altura (cm)</label><input id="b_al" type="number" value="${lb.al||''}"></div><div><label>Gordura (%)</label><input id="b_gd" type="number" step="0.1" value="${lb.gd||''}"></div></div>
 <div class="two"><div><label>Água no corpo (%)</label><input id="b_ag" type="number" step="0.1" value="${lb.ag||''}"></div></div>
 <button class="btn" style="width:100%;margin-top:14px" onclick="saveB()">Salvar avaliação de hoje</button></div>
 <div class="card"><h2>Evolução do peso</h2>${line(S.body.filter(b=>b.pe).map(b=>b.pe),S.body.filter(b=>b.pe).map(b=>b.date.slice(8)+'/'+b.date.slice(5,7)))}</div>
 <div class="card"><h2>Histórico</h2>${[...S.body].reverse().map(b=>`<div class="row"><div class="g"><b>${br(b.date)}</b><small>${b.pe?f1(b.pe)+' kg · ':''}${b.gd?f1(b.gd)+'% · ':''}${M.filter(m=>b[m[0]]).map(m=>m[1].slice(0,3)+' '+f1(b[m[0]])).join(' · ')}</small></div><button class="x" onclick="delB('${b.date}')">×</button></div>`).join('')||'<div class="empty">Nenhuma avaliação ainda</div>'}</div>`}
function saveB(){const r={date:td(),pe:num('b_pe'),al:num('b_al'),gd:num('b_gd'),ag:num('b_ag')};M.forEach(([k])=>r[k]=num('b_'+k));S.body=S.body.filter(b=>b.date!==r.date);S.body.push(r);S.body.sort((a,b)=>a.date.localeCompare(b.date));save();render()}
function delB(d){S.body=S.body.filter(b=>b.date!==d);save();render()}

function vL(){const T=tot(dsel);
 return`<div class="top">Diário nutricional<small>Registre o que você realmente comeu</small></div>
 <div class="card"><h2>Adicionar alimento</h2><label>Data</label><input type="date" value="${dsel}" onchange="dsel=this.value||td();render()"><label>Refeição</label><select id="ml">${MEALS.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select>
 <label>Alimento</label><input id="n" list="dl" oninput="fm()" placeholder="Digite o nome (ex.: Banana)"><datalist id="dl">${S.market.map(m=>`<option value="${esc(m.name)}">`).join('')}</datalist><div id="hint" style="color:var(--ac);font-size:13px;margin-top:5px"></div>
 <label id="diaryQtyLabel">Quantidade consumida (g)</label><input id="g" type="number" min="0" inputmode="decimal" placeholder="100"><label>Valores por 100 g (rótulo)</label>${ff('v_')}
 <div class="sw"><input id="sv" type="checkbox" checked><span>Salvar no Mercado se for um alimento novo</span></div><div id="err" style="color:#f87171;font-size:13px"></div><button class="btn" style="width:100%;margin-top:8px" onclick="saveL()">Registrar</button></div>
 <div class="card"><h2>Total do dia · ${Math.round(T.k)} kcal</h2><div class="two"><div>Proteínas <b>${f1(T.p)} g</b></div><div>Carboidratos <b>${f1(T.c)} g</b></div><div>Gorduras <b>${f1(T.f)} g</b></div><div>Fibras <b>${f1(T.fib)} g</b></div></div></div>`+
 MEALS.map(([k,n])=>{const L=S.diary.filter(e=>e.date===dsel&&e.meal===k);return`<div class="card"><h2>${n} · ${Math.round(tot(dsel,k).k)} kcal</h2>${L.map(e=>`<div class="row"><div class="g"><b>${esc(e.name)}</b><small>${f1(e.g)} ${e.u||'g'} · ${Math.round(e.k)} kcal · P ${f1(e.p)} · C ${f1(e.c)} · G ${f1(e.f)}</small></div><button class="x" onclick="delL('${e.id}')">×</button></div>`).join('')||'<div class="empty">Nada registrado</div>'}</div>`}).join('')}
function fm(){const q=$('#n').value.trim().toLowerCase(),exact=S.market.find(x=>x.name.toLowerCase()===q),matches=S.market.filter(x=>x.name.toLowerCase().includes(q)),m=exact||(q&&matches.length===1?matches[0]:null);if(m){diaryUnit=m.packageUnit||'g';F.forEach(k=>$('#v_'+k).value=m[k]??'');$('#diaryQtyLabel').textContent='Quantidade consumida ('+diaryUnit+')';$('#hint').textContent='Cadastro encontrado: '+m.name+' ✓ · valores por 100 '+diaryUnit}else{diaryUnit='g';$('#diaryQtyLabel').textContent='Quantidade consumida (g)';$('#hint').textContent=q&&matches.length>1?'Há mais de um resultado; selecione o nome completo.':''}}
function saveL(){const n=$('#n').value.trim(),g=num('g');if(!n||!g)return $('#err').textContent='Informe o alimento e a quantidade.';
 const v={};F.forEach(k=>v[k]=num('v_'+k));const e={id:uid(),date:dsel,meal:$('#ml').value,name:n,g,u:diaryUnit};F.forEach(k=>e[k]=v[k]*g/100);S.diary.push(e);
 if(!S.market.some(x=>x.name.toLowerCase()===n.toLowerCase())&&v.k+v.p+v.c+v.f>0&&$('#sv').checked)S.market.push(Object.assign({id:uid(),name:n,price:0,old:0,qty:1,bought:0},v));
 save();render()}
function delL(id){S.diary=S.diary.filter(x=>x.id!==id);save();render()}

function go(v){view=v;scrollTo(0,0);render()}
function render(){$('#app').innerHTML={i:vI,d:vD,m:vM,c:vC,l:vL}[view]();
 if(view==='i')fixStrip();
  $('#nav div').innerHTML=[['i',NI.i,'Início'],['d',NI.d,'Dieta'],['m',NI.m,'Mercado'],['c',NI.c,'Corpo'],['l',NI.l,'Diário']].map(x=>`<button class="${view===x[0]?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}
render();
</script></body></html>
